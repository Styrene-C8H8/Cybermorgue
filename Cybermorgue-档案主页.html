<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERMORGUE // 赛博停尸间 · 档案终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CYBERMORGUE 档案终端 — 复古未来 CRT（琥珀磷光）
   主色：琥珀 | 辅色：暖琥珀 / 警示红
   ============================================================ */
:root{
  --ph:#d9a44a;            /* 琥珀主色 */
  --ph-dim:#8a6a34;
  --ph-faint:rgba(217,164,74,.08);
  --amber:#e8b45e;
  --red:#c65b4e;
  --cy:#6fb3b8;            /* 数据青蓝（点缀） */
  --ok:#7fae6a;            /* 通过绿（点缀） */
  --amf:rgba(217,164,74,.07);
  --gr:#7fbf7f; --grd:#4a6b4a;
  --bg:#0a0805;
  --panel:#100d08;
  --line:rgba(217,164,74,.20);
  --txt:#d8ccb0;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --disp:'VT323','IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--mono);
  font-size:15px;
  line-height:1.75;
  cursor:crosshair;
  overflow-x:hidden;
}
::selection{background:var(--ph);color:#000}

/* ---------- CRT 全局覆层 ---------- */
.crt-scanlines{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px,transparent 2px,
    rgba(0,0,0,.22) 3px,rgba(0,0,0,.22) 4px);
  mix-blend-mode:multiply;
}
.crt-vignette{
  position:fixed;inset:0;z-index:9001;pointer-events:none;
  background:radial-gradient(ellipse at center,
    transparent 55%,rgba(0,0,0,.55) 100%);
}
.crt-flicker{
  position:fixed;inset:0;z-index:9002;pointer-events:none;
  background:var(--ph);
  opacity:.015;
  animation:flicker 4.2s infinite steps(1);
}
@keyframes flicker{
  0%,100%{opacity:.015} 7%{opacity:.04} 8%{opacity:.01}
  31%{opacity:.03} 32%{opacity:.012} 64%{opacity:.045} 65%{opacity:.015}
}
@media (prefers-reduced-motion: reduce) {
  .crt-flicker, .hero-scroll, #boot-enter { animation: none !important; }
  .radar .sweep, .compass-ring, .radar .blip { animation: none !important; }
  * { scroll-behavior: auto !important; }
}

/* ---------- BOOT 加载屏 ---------- */
#boot{
  position:fixed;inset:0;z-index:10000;background:#020201;
  display:flex;flex-direction:column;justify-content:center;
  padding:6vh 8vw;font-family:var(--disp);font-size:clamp(16px,2.2vw,24px);
  transition:opacity .25s;
}
#boot.done{opacity:0;pointer-events:none}
#boot-log{white-space:pre-wrap;line-height:1.5}
#boot-log .ok{color:var(--ph)}
#boot-log .warn{color:var(--amber)}
#boot-log .err{color:var(--red)}
#boot-bar-wrap{width:min(480px,70vw);height:14px;border:1px solid var(--line);margin-top:28px;padding:2px}
#boot-bar{height:100%;width:0%;background:
  repeating-linear-gradient(90deg,var(--ph) 0 8px,transparent 8px 11px)}
#boot-enter{
  margin-top:34px;color:var(--ph);letter-spacing:.15em;
  opacity:0;transition:opacity .4s;animation:pulse 1.2s infinite;
}
#boot-enter.show{opacity:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.boot-caret::after{content:"█";animation:blink .8s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ---------- CRT 通电闪屏 ---------- */
#crt-on{
  position:fixed;inset:0;z-index:9999;background:#fff;pointer-events:none;
  transform:scaleY(.002);opacity:0;
}
body.powering #crt-on{animation:crtOn .55s ease-out forwards}
@keyframes crtOn{
  0%{transform:scaleY(.002);opacity:.9}
  35%{transform:scaleY(.006);opacity:1}
  60%{transform:scaleY(1);opacity:.85}
  100%{transform:scaleY(1);opacity:0}
}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:20px;
  padding:10px 24px;border-bottom:1px solid var(--line);
  background:rgba(10,8,5,.92);backdrop-filter:blur(2px);
  font-size:12px;letter-spacing:.08em;
}
.logo{font-family:var(--disp);font-size:22px;color:var(--ph);letter-spacing:.06em;white-space:nowrap;cursor:pointer}
.logo b{color:var(--txt);font-weight:400}
.hdr-clock{color:var(--ph-dim);font-family:var(--disp);font-size:19px}
.hdr-sig{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ph-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ph);box-shadow:0 0 8px var(--ph);animation:pulse 2s infinite}
nav.main-nav{display:flex;gap:22px}
nav.main-nav a{color:var(--txt);text-decoration:none;position:relative;padding-left:14px;transition:color .2s;cursor:pointer}
nav.main-nav a::before{content:">";position:absolute;left:0;color:var(--ph-dim);transition:color .2s,transform .2s}
nav.main-nav a:hover{color:var(--ph)}
nav.main-nav a:hover::before{color:var(--ph);transform:translateX(-4px)}

/* ---------- 跑马灯通告 ---------- */
.ticker{
  border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;
  font-size:12px;color:var(--ph-dim);padding:5px 0;background:var(--ph-faint);
}
.ticker-track{display:inline-block;animation:tick 46s linear infinite}
.ticker span{margin-right:56px}
.ticker b{color:var(--amber);font-weight:400}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- HERO ---------- */
.hero{
  min-height:calc(100vh - 92px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;position:relative;padding:60px 20px 90px;
}
.hero-tag{
  font-size:13px;letter-spacing:.55em;color:var(--ph-dim);
  margin-bottom:26px;text-transform:uppercase;
}
.hero h1{
  font-family:'VT323',var(--disp);
  font-size:clamp(60px,15vw,190px);
  line-height:.95;color:var(--ph);
  letter-spacing:.02em;position:relative;
  text-shadow:0 0 18px rgba(217,164,74,.45),0 0 60px rgba(217,164,74,.2);
}
/* 故障字效 */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{
  content:attr(data-text);position:absolute;inset:0;
  opacity:0;pointer-events:none;
}
.glitch::before{color:var(--red);z-index:-1;animation:glA 3.7s infinite steps(1)}
.glitch::after{color:var(--amber);z-index:-2;animation:glB 3.7s infinite steps(1)}
@keyframes glA{
  0%,93%,100%{opacity:0;transform:none;clip-path:inset(0)}
  94%{opacity:.8;transform:translate(-5px,2px);clip-path:inset(12% 0 58% 0)}
  96%{opacity:.8;transform:translate(4px,-1px);clip-path:inset(62% 0 8% 0)}
  98%{opacity:0}
}
@keyframes glB{
  0%,94%,100%{opacity:0;transform:none;clip-path:inset(0)}
  95%{opacity:.7;transform:translate(5px,-2px);clip-path:inset(40% 0 30% 0)}
  97%{opacity:.7;transform:translate(-4px,1px);clip-path:inset(5% 0 78% 0)}
  99%{opacity:0}
}
.hero-sub{
  margin-top:36px;min-height:1.8em;font-size:clamp(15px,1.6vw,19px);
  color:var(--txt);letter-spacing:.12em;max-width:56em;
}
.hero-sub .caret{color:var(--ph);animation:blink .8s steps(1) infinite}
.hero-scroll{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.4em;color:var(--ph-dim);
  animation:pulse 2s infinite;
}

/* ---------- 四角括号组件 ---------- */
.corners{position:relative;padding:26px}
.corners::before,.corners::after{
  content:"";position:absolute;width:16px;height:16px;pointer-events:none;
}
.corners::before{top:0;left:0;border-top:2px solid var(--ph);border-left:2px solid var(--ph)}
.corners::after{bottom:0;right:0;border-bottom:2px solid var(--ph);border-right:2px solid var(--ph)}

/* ---------- 通用区块 ---------- */
section{max-width:1180px;margin:0 auto;padding:110px 28px}
.sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:52px;flex-wrap:wrap}
.sec-no{font-family:var(--disp);font-size:30px;color:var(--ph-dim)}
.sec-title{font-family:'VT323',var(--disp);font-size:clamp(30px,4vw,48px);color:var(--ph);letter-spacing:.08em}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 滚动显现 */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

/* ---------- 01 简介 ---------- */
.about-grid{display:grid;grid-template-columns:7fr 5fr;gap:44px;align-items:start}
.about-txt p{margin-bottom:1.4em;text-indent:0}
.about-txt .hl{color:var(--ph)}
.about-txt blockquote{
  border-left:2px solid var(--ph);padding:6px 0 6px 20px;margin:0 0 28px;
  color:var(--ph);font-style:normal;letter-spacing:.06em;
}
.term-panel{
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 0 40px rgba(217,164,74,.05) inset;
}
.term-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.2em;color:var(--ph-dim);
}
.term-body{padding:16px;height:300px;overflow:hidden;display:flex;flex-direction:column-reverse}
.log-line{font-size:12.5px;line-height:1.9;opacity:0;animation:logIn .4s forwards}
.log-line .t{color:var(--ph-dim)}
.log-line.warn{color:var(--amber)}
.log-line.ok{color:var(--ok)}
/* 点缀色：数据青蓝 / 通过绿 */
.stat .num, .sec-no, .hdr-clock, .gate-id { color: var(--cy); }
.zone .ze { color: var(--cy); }
@keyframes logIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.stat{background:var(--bg);padding:20px 16px;text-align:center}
.stat .num{font-family:var(--disp);font-size:42px;color:var(--ph);line-height:1}
.stat .lbl{font-size:11px;letter-spacing:.2em;color:var(--ph-dim);margin-top:8px}

/* ---------- 02 双通道入口 ---------- */
.gates{display:grid;grid-template-columns:3fr 2fr;gap:26px}
.gate{
  display:block;text-decoration:none;padding:44px 38px;position:relative;
  border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;
  transition:border-color .25s,transform .25s,box-shadow .25s;
  background:linear-gradient(160deg,var(--ph-faint),transparent 60%);
  font-family:var(--mono);
}
.gate:hover{transform:translateY(-4px)}
.gate-green:hover{border-color:var(--ph);box-shadow:0 0 0 1px var(--ph),0 14px 50px -18px rgba(217,164,74,.5)}
.gate-red{
  background:linear-gradient(160deg,rgba(198,91,78,.07),transparent 60%);
  border-color:rgba(198,91,78,.3);
}
.gate-red:hover{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 14px 50px -18px rgba(198,91,78,.5)}
.gate-kicker{font-size:11px;letter-spacing:.35em;margin-bottom:14px}
.gate-green .gate-kicker{color:var(--ph-dim)}
.gate-red .gate-kicker{color:rgba(198,91,78,.65)}
.gate h3{font-family:'VT323',var(--disp);font-size:clamp(34px,4vw,54px);line-height:1.05;letter-spacing:.05em}
.gate-green h3{color:var(--ph)}
.gate-red h3{color:var(--red)}
.gate p{margin-top:14px;color:var(--txt);opacity:.8;max-width:34em}
.gate-cta{
  display:inline-flex;align-items:center;gap:10px;margin-top:30px;
  font-size:13px;letter-spacing:.25em;
}
.gate-green .gate-cta{color:var(--ph)}
.gate-red .gate-cta{color:var(--red)}
.gate-cta svg{transition:transform .25s}
.gate:hover .gate-cta svg{transform:translateX(8px)}
.gate::after{
  content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(217,164,74,.09),transparent);
  transition:left .6s;pointer-events:none;
}
.gate:hover::after{left:130%}
.gate-id{
  position:absolute;top:16px;right:18px;font-family:var(--disp);
  font-size:17px;letter-spacing:.15em;opacity:.4;
}

/* ---------- 子视图（表单/区域/登录/员工） ---------- */
.subview{max-width:880px;margin:40px auto 90px;padding:0 20px}
.panel{background:var(--panel);border:1px solid var(--line);padding:26px 28px}
.ftitle{font-family:'VT323',var(--disp);font-size:clamp(30px,4vw,44px);color:var(--ph);letter-spacing:.08em;text-align:center;margin:10px 0 22px}
.flabel{color:var(--ph);letter-spacing:.08em;font-size:13px;margin-bottom:6px}
input,textarea,select{
  font-family:var(--mono);font-size:14px;background:#0d0a06;color:var(--txt);
  border:1px solid var(--line);padding:8px 12px;width:100%;outline:none;border-radius:0;
}
input:focus,textarea:focus{border-color:var(--ph);box-shadow:0 0 0 2px var(--ph-faint)}
textarea{resize:vertical;min-height:64px}
.frow2{padding:14px 0;border-bottom:1px dashed var(--line)}
.frow2:last-child{border-bottom:none}
.fradio{display:flex;gap:22px;font-size:14px}
.fradio label{display:flex;align-items:center;gap:6px;cursor:pointer}
.fradio input{width:auto}
.frow2.err input{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{
  font-family:var(--mono);font-size:12px;border:1px solid var(--line);
  background:#0d0a06;color:var(--txt);padding:5px 12px;cursor:pointer;border-radius:0;width:auto;
}
.chip:hover{border-color:var(--ph)}
.chip.sel{background:var(--ph);color:#000;border-color:var(--ph)}
.chip.none{border-style:dashed}
.zone-link{
  display:inline-block;margin-top:10px;font-size:12px;color:var(--ph);
  background:none;border:1px solid var(--ph);padding:5px 14px;cursor:pointer;font-family:var(--mono);border-radius:0;
}
.zone-link:hover{background:var(--ph);color:#000}

/* Stepper */
.stepper{margin-top:4px}
.step-indicator-row{display:flex;align-items:center;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}
.step-ind{
  width:26px;height:26px;border:1px solid var(--line);background:#0d0a06;color:var(--ph-dim);
  font-size:12px;font-weight:400;font-family:var(--disp);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:0;transition:all .2s;
}
.step-ind.done{background:var(--ph);border-color:var(--ph);color:#000}
.step-ind.cur{border-color:var(--ph);color:var(--ph);box-shadow:0 0 0 3px var(--ph-faint)}
.step-connector{flex:1;height:2px;background:var(--line);margin:0 3px;min-width:5px;overflow:hidden}
.sc-fill{display:block;height:100%;width:0;background:var(--ph);transition:width .3s ease}
.step-connector.done .sc-fill{width:100%}
.step-panel{display:none}
.step-panel.on{display:block}
.step-panel.anim.from-r{animation:stepInR .38s cubic-bezier(.2,.7,.2,1) both}
.step-panel.anim.from-l{animation:stepInL .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes stepInR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes stepInL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.step-footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.step-back{
  font-family:var(--mono);border:1px solid var(--line);background:none;color:var(--txt);
  padding:8px 20px;font-size:13px;cursor:pointer;border-radius:0;
}
.step-back:hover{color:var(--ph);border-color:var(--ph)}
.step-next{
  font-family:var(--mono);border:none;background:var(--ph);color:#000;
  padding:8px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:0;
}
.step-next:hover{filter:brightness(1.1)}
.step-next:active{transform:scale(.97)}

/* 区域网格 */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.zone{background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:0}
.zone .zn{font-size:15px;font-weight:600;color:var(--txt)}
.zone .ze{font-size:11px;color:var(--ph-dim);letter-spacing:1px}
.zone .zd{font-size:13px;margin-top:6px;color:var(--txt);opacity:.78}

/* ===== 登录闸门 ===== */
#gate{position:fixed;inset:0;z-index:2000;background:var(--bg);
  display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#gate.off{opacity:0;pointer-events:none}
.gbox{width:min(460px,90vw)}
.gtop{color:var(--ph-dim);font-size:15px;letter-spacing:.2em;line-height:1.9;margin-bottom:22px;font-family:var(--mono)}
.gtop b{color:var(--gr);font-weight:400}
.gline{display:flex;gap:10px;font-size:19px}
.gline .pr{color:var(--gr)}
.gbox input{flex:1;background:none;border:none;border-bottom:1px solid var(--line);
  color:var(--txt);font-family:var(--mono);font-size:20px;padding:2px 8px;outline:none;
  letter-spacing:.15em}
.gbox input:focus{border-bottom-color:var(--ph)}
#gmsg{margin-top:16px;color:var(--red);letter-spacing:.15em;min-height:1.7em;font-size:16px;font-family:var(--mono)}
.gnext{margin-top:16px;width:100%;font-family:var(--mono);background:none;border:1px solid var(--line);
  color:var(--ph);padding:10px 0;font-size:16px;letter-spacing:.3em;cursor:pointer;transition:all .2s}
.gnext:hover{background:var(--ph);color:#000;border-color:var(--ph)}

/* ===== 员工终端 ===== */
.term{max-width:1200px;margin:0 auto;padding:10px 0 60px}
.statbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:10px;
  border:1px solid var(--line);padding:4px 12px;font-size:11.5px;
  color:var(--ph-dim);letter-spacing:.08em;background:var(--panel);margin-bottom:18px;
  white-space:nowrap;overflow:hidden}
.statbar span{flex:0 0 auto}
.statbar b{color:var(--ph);font-weight:400}
.statbar i{font-style:normal;color:var(--cy)}
.statbar .logout{color:var(--red);cursor:pointer}
.statbar .logout:hover{text-decoration:underline}

.clockstrip{border:1px solid var(--line);background:linear-gradient(180deg,#14100a,#0e0b07);
  position:relative;overflow:hidden;padding:26px 20px 18px;text-align:center;margin-bottom:18px}
.clockstrip::before{content:"";position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(217,164,74,.05),transparent);
  animation:sweep2 7s linear infinite}
@keyframes sweep2{from{left:-60%}to{left:130%}}
.cs-label{color:var(--ph-dim);font-size:13px;letter-spacing:.5em;margin-bottom:4px}
#bigclock{font-size:clamp(60px,10vw,140px);line-height:1;color:var(--ph);
  text-shadow:0 0 26px rgba(217,164,74,.45),0 0 80px rgba(217,164,74,.15);letter-spacing:.04em;font-family:var(--disp)}
#bigclock .sep{animation:pul 1s steps(1) infinite}
.cs-sub{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:10px;
  font-size:15px;color:var(--ph-dim);letter-spacing:.25em}
.cs-sub span b{color:var(--gr);font-weight:400}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.15}}

.calrow{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-bottom:18px}
.panel{border:1px solid var(--line);background:var(--panel);position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--ph);border-left:2px solid var(--ph)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--ph);border-right:2px solid var(--ph)}
.p-head{display:flex;justify-content:space-between;padding:7px 14px;
  border-bottom:1px dashed var(--line);color:var(--ph-dim);font-size:13px;letter-spacing:.3em}
.p-head i{font-style:normal;color:var(--red);animation:pul 1.6s infinite}
.cal-grid{padding:12px 16px 16px}
.cal-top{display:flex;justify-content:space-between;align-items:center;
  color:var(--ph);font-size:18px;letter-spacing:.2em;margin-bottom:8px}
.cal-nav{background:none;border:1px solid var(--line);color:var(--ph-dim);
  font-family:var(--mono);font-size:15px;padding:0 9px;cursor:pointer}
.cal-nav:hover{color:var(--ph);border-color:var(--ph)}
.cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-week span{color:var(--ph-dim);font-size:13px;letter-spacing:.1em;padding:3px 0}
.cal-days span{padding:4px 0;font-size:17px;color:var(--txt);cursor:default;transition:all .15s}
.cal-days span.dim{color:rgba(138,106,47,.35)}
.cal-days span:hover{color:var(--ph);background:var(--amf)}
.cal-days span.today{color:#000;background:var(--ph);box-shadow:0 0 12px rgba(217,164,74,.55)}

.hello{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hello h1{font-size:clamp(28px,4vw,44px);color:var(--ph);line-height:1.05;
  text-shadow:0 0 20px rgba(217,164,74,.35);font-family:var(--disp)}
.hello small{display:block;font-family:'Noto Sans SC',sans-serif;font-weight:300;
  font-size:.42em;letter-spacing:.5em;color:var(--txt);margin-top:8px;text-shadow:none}
.hello .sysinfo{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end;margin-left:auto;
  text-align:right;font-size:14px;color:var(--ph-dim);letter-spacing:.15em}
.hello .sysinfo div{display:flex;gap:10px;white-space:nowrap;justify-content:flex-end}
.hello .sysinfo b{color:var(--gr);font-weight:400}

.menu{padding:10px 0;margin-bottom:18px}
.mi{display:flex;align-items:baseline;gap:16px;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px dashed rgba(217,164,74,.12);
  color:var(--txt);font-family:var(--mono);font-size:18px;padding:13px 24px;cursor:pointer;transition:all .18s}
.mi:last-child{border-bottom:none}
.mi .idx{color:var(--ph-dim);font-size:15px}
.mi .name{font-family:'Noto Sans SC',sans-serif;font-weight:500;font-size:20px;letter-spacing:.25em;color:var(--txt);transition:all .18s}
.mi .en{color:var(--grd);font-size:14px;letter-spacing:.2em}
.mi .desc{margin-left:auto;color:var(--ph-dim);font-size:14px;text-align:right;max-width:40%;transition:all .18s}
.mi .arr{color:var(--ph);opacity:0;transform:translateX(-8px);transition:all .18s}
.mi:hover{background:var(--amf)}
.mi:hover .name{color:var(--ph);text-shadow:0 0 14px rgba(217,164,74,.5)}
.mi:hover .desc{color:var(--txt)}
.mi:hover .arr{opacity:1;transform:none}

.widgets{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
#tapeBox{grid-column:1;grid-row:1}
#todoPanel{grid-column:1;grid-row:2}
#newsPanel{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column}
.tape-mid{display:flex;align-items:center;gap:14px;padding:16px 18px}
.tape-mid .reel{width:46px;height:46px}
@media(max-width:1100px){
  .widgets{grid-template-columns:1fr}
  #tapeBox,#todoPanel,#newsPanel{grid-column:1;grid-row:auto}
  .tape-mid{flex-wrap:wrap;justify-content:center;text-align:center}
  .tape-mid .reel:last-child{display:none}
  .tinfo{flex:1 1 100%;display:flex;flex-direction:column;align-items:center}
  .eq{width:100%;justify-content:center}
}
.tape-mid{display:flex;align-items:center;gap:14px;padding:16px 18px}
.reel{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
.reel::before{content:"";position:absolute;inset:7px;border-radius:50%;
  background:conic-gradient(var(--ph-dim) 0 25%,transparent 25% 50%,var(--ph-dim) 50% 75%,transparent 75%)}
.playing .reel::before{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tinfo{flex:1;min-width:0}
.track-name{font-size:15px;color:var(--txt);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-bottom:6px}
.eq{display:flex;align-items:flex-end;gap:3px;height:28px}
.eq i{width:5px;background:var(--ph);height:15%;opacity:.8}
.playing .eq i{animation:eq .65s ease-in-out infinite alternate}
@keyframes eq{from{height:10%}to{height:100%}}
.tbtns{display:flex;gap:8px;padding:0 18px 14px}
.tbtns button{font-family:var(--mono);flex:1;background:none;border:1px solid var(--line);
  color:var(--ph);font-size:17px;padding:3px 0;cursor:pointer;letter-spacing:.1em}
.tbtns button:hover{background:var(--amf);border-color:var(--ph-dim)}

.news-list{padding:10px 16px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px;flex:1}
.news-item b{color:var(--ph);font-weight:400;margin-right:8px}
.news-item.new b::after{content:"NEW";color:var(--red);font-size:11px;margin-left:8px;
  border:1px solid var(--red);padding:0 4px;vertical-align:2px}

.todo-list{padding:8px 16px 4px;font-size:16px}
.todo{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer}
.todo .bx{width:14px;height:14px;border:1px solid var(--ph-dim);flex-shrink:0;position:relative}
.todo.done .bx::after{content:"×";position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);color:var(--ph);font-size:15px;line-height:1}
.todo.done span{opacity:.35;text-decoration:line-through}
.todo-add{display:flex;gap:8px;padding:8px 16px 14px}
.todo-add input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  font-family:var(--mono);font-size:15px;padding:3px 10px;outline:none}
.todo-add input:focus{border-color:var(--ph)}
.todo-add button{font-family:var(--mono);background:none;border:1px solid var(--line);
  color:var(--ph);cursor:pointer;padding:0 14px}
.todo-add button:hover{border-color:var(--ph)}

.cmdline{margin-top:18px;border:1px solid var(--line);background:var(--panel);
  padding:9px 16px;display:flex;gap:10px;font-size:16px;align-items:center}
.cmdline .pr{color:var(--gr);white-space:nowrap}
.cmdline input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:var(--mono);font-size:17px}
.cmd-hist{margin-top:6px;font-size:14px;color:var(--ph-dim);min-height:1.6em;letter-spacing:.08em;padding:0 4px}
.cmd-hist b{color:var(--gr);font-weight:400}

.masked{filter:blur(6px);user-select:none;opacity:.85;color:var(--ph)}

/* ===== 区域划分：设施地图（参考 Code/地图参考.html） ===== */
.subview#view-zones{max-width:1060px}
.stage{perspective:1100px;margin-top:14px}
.zm-head{text-align:center;margin-bottom:10px}
.zm-head .zm-en{color:var(--ph-dim);font-size:12px;letter-spacing:.5em;text-transform:uppercase;margin-bottom:8px}
.zm-head h1{font-family:var(--disp);font-size:clamp(38px,7vw,72px);color:var(--ph);letter-spacing:.12em;
  line-height:1;text-shadow:0 0 22px rgba(217,164,74,.4);min-height:1em}
.zm-head h1 .ch{display:inline-block;opacity:0}
.zm-head .zm-sub{color:var(--ph-dim);font-size:14px;letter-spacing:.4em;margin-top:8px}
.map3d{position:relative;border:1px solid var(--line);
  background:
    repeating-linear-gradient(to right,transparent 0 39px,rgba(217,164,74,.05) 39px 40px),
    repeating-linear-gradient(to bottom,transparent 0 39px,rgba(217,164,74,.05) 39px 40px),
    radial-gradient(ellipse at center,#141008 0%,#0e0b06 70%);
  box-shadow:0 40px 80px -30px rgba(217,164,74,.25),inset 0 0 80px rgba(0,0,0,.7);
  transform-style:preserve-3d;aspect-ratio:16/10;min-height:440px}
.map3d .corner{position:absolute;width:18px;height:18px;z-index:20;pointer-events:none}
.map3d .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--ph);border-left:2px solid var(--ph)}
.map3d .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--ph);border-right:2px solid var(--ph)}
.map3d .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--ph);border-left:2px solid var(--ph)}
.map3d .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--ph);border-right:2px solid var(--ph)}
/* 景深分层：地图板在最底，区块各自不同高度（错落），雷达/罗盘在最前 */
.mz{position:absolute;border:1px solid rgba(138,106,47,.55);
  background:rgba(217,164,74,.04);cursor:pointer;transition:all .2s;
  transform:translateZ(var(--mz,48px))}
.mz:hover,.mz.hot{border-color:var(--ph);background:rgba(217,164,74,.13);
  box-shadow:0 0 24px rgba(217,164,74,.35),inset 0 0 20px rgba(217,164,74,.12)}
.mz .mz-code{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--ph-dim);font-size:24px;letter-spacing:.15em;transition:all .2s;font-family:var(--disp)}
.mz:hover .mz-code,.mz.hot .mz-code{color:var(--ph);text-shadow:0 0 12px rgba(217,164,74,.7)}
.mz.locked{border-style:dashed;border-color:rgba(200,90,74,.45)}
.mz.locked:hover,.mz.locked.hot{border-color:var(--red);background:rgba(200,90,74,.08);
  box-shadow:0 0 22px rgba(200,90,74,.3)}
.mz.locked .mz-code{color:var(--red)}
.leader{position:absolute;height:1px;pointer-events:none;z-index:6;
  background:linear-gradient(90deg,var(--ph),transparent);opacity:.6;
  transform:translateZ(36px)}
.mzlabel{position:absolute;color:var(--ph);font-size:14px;letter-spacing:.16em;
  pointer-events:none;white-space:nowrap;z-index:7;line-height:1.5;
  text-shadow:0 0 8px rgba(217,164,74,.5);transform:translateZ(calc(var(--mz,48px) + 16px))}
.mzlabel small{display:block;font-size:10px;color:var(--ph-dim);letter-spacing:.28em}
.radar{position:absolute;top:-8px;right:-6px;width:64px;height:64px;z-index:30;
  border-radius:50%;border:1px solid var(--line);
  background:radial-gradient(circle,rgba(217,164,74,.03) 0 60%,rgba(127,191,127,.06));
  overflow:hidden;box-shadow:inset 0 0 14px rgba(0,0,0,.7);
  transform:translateZ(96px)}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(138,106,47,.35)}
.radar::before{left:50%;top:0;bottom:0;width:1px}
.radar::after{top:50%;left:0;right:0;height:1px}
.radar .ring1{position:absolute;inset:28%;border:1px solid rgba(138,106,47,.3);border-radius:50%}
.radar .ring2{position:absolute;inset:42%;border:1px solid rgba(138,106,47,.3);border-radius:50%}
.radar .sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(217,164,74,.45),transparent 70deg,transparent 360deg);
  animation:sweepA 3.2s linear infinite}
@keyframes sweepA{to{transform:rotate(360deg)}}
.radar .blip{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--red);
  box-shadow:0 0 8px var(--red);animation:blipA 3.2s infinite}
@keyframes blipA{0%,12%{opacity:0}16%,80%{opacity:1}100%{opacity:0}}
.radar-tag{position:absolute;top:60px;right:-6px;z-index:30;text-align:center;width:64px;
  color:var(--ph-dim);font-size:10px;letter-spacing:.35em;transform:translateZ(96px)}
.compass{position:absolute;bottom:14px;left:14px;width:72px;height:72px;z-index:10;
  border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(217,164,74,.04),transparent 70%);
  box-shadow:inset 0 0 12px rgba(0,0,0,.7);transform:translateZ(96px)}
.compass-ring{position:absolute;inset:-6px;border:1px dashed rgba(138,106,47,.3);
  border-radius:50%;animation:spinC 24s linear infinite}
@keyframes spinC{to{transform:rotate(360deg)}}
.compass .needle{width:2px;height:46px;position:relative;transition:transform .4s cubic-bezier(.3,.4,.4,1)}
.compass .needle::before,.compass .needle::after{content:"";position:absolute;left:-4px;
  border-left:5px solid transparent;border-right:5px solid transparent}
.compass .needle::before{top:0;border-bottom:20px solid var(--ph);filter:drop-shadow(0 0 5px rgba(217,164,74,.8))}
.compass .needle::after{bottom:0;border-top:20px solid var(--red)}
.cdir{position:absolute;font-size:10px;color:var(--ph-dim)}
.cdir.n{top:3px;left:50%;transform:translateX(-50%);color:var(--ph)}
.cdir.s{bottom:3px;left:50%;transform:translateX(-50%)}
.cdir.w{left:6px;top:50%;transform:translateY(-50%)}
.cdir.e{right:6px;top:50%;transform:translateY(-50%)}
.legend{position:absolute;bottom:96px;left:14px;top:auto;z-index:30;font-size:11px;
  letter-spacing:.2em;color:var(--ph-dim);line-height:2.1;transform:translateZ(96px)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:1px}
.lg-a{background:rgba(217,164,74,.15);border:1px solid var(--ph)}
.lg-b{background:rgba(200,90,74,.1);border:1px dashed var(--red)}
.coordbox{position:absolute;bottom:14px;right:14px;text-align:right;z-index:10;
  color:var(--ph-dim);font-size:12px;letter-spacing:.2em;line-height:1.7;transform:translateZ(96px)}
.coordbox b{color:var(--ph);font-weight:400}
.descbar{margin:16px 0 0;border:1px solid var(--line);background:var(--panel);
  padding:12px 20px;min-height:96px;display:flex;gap:22px;align-items:flex-start;
  position:relative;overflow:hidden}
.descbar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ph-dim);transition:background .2s}
.descbar.on::before{background:var(--ph)}
.db-name{color:var(--ph);font-size:18px;letter-spacing:.12em;white-space:nowrap;min-width:170px}
.db-name small{display:block;color:var(--ph-dim);font-size:11.5px;letter-spacing:.2em}
.db-text{font-size:15px;line-height:2;flex:1}
.db-warn{color:var(--red);font-size:13.5px;letter-spacing:.1em;display:block;margin-top:6px}
.descbar.idle .db-text{color:var(--ph-dim)}
@keyframes descIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.descbar.on .db-name,.descbar.on .db-text{animation:descIn .32s ease both}
.descbar.on{animation:barKick .4s cubic-bezier(.2,.7,.2,1)}
@keyframes barKick{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.descbar.on::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:28%;
  background:linear-gradient(105deg,transparent,rgba(217,164,74,.16),transparent);
  animation:barSweep .55s ease;pointer-events:none;z-index:2}
@keyframes barSweep{to{left:115%}}
.mz.hot{animation:mzPop .35s cubic-bezier(.2,.7,.2,1)}
@keyframes mzPop{
  0%{transform:translateZ(var(--mz,48px)) scale(1)}
  45%{transform:translateZ(calc(var(--mz,48px) + 10px)) scale(1.08)}
  100%{transform:translateZ(var(--mz,48px)) scale(1)}
}
@media(max-width:700px){.coordbox,.radar-tag{display:none}.map3d{min-height:360px}}

/* ================= 深度登记问卷（参考 Code/问卷参考.html + 音频选项格式参考 + 结果动画.html） ================= */
#quizApp{min-height:56vh;display:flex;flex-direction:column;justify-content:center;padding-top:26px}
.gauge{margin-top:14px}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--ph-dim);
  letter-spacing:.3em;margin-bottom:10px;font-family:var(--disp)}
.pbar{position:absolute;top:-26px;left:0;height:2px;background:var(--ph);
  box-shadow:0 0 12px var(--ph);width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.qcard{position:relative;display:flex;flex-direction:column;justify-content:center}
.qcard.enter{animation:qIn .6s cubic-bezier(.2,.7,.25,1) both}
.qcard.leave{animation:qOut .4s steps(6) both;pointer-events:none}
@keyframes qIn{0%{opacity:0;transform:translateY(30px) scale(.985);filter:brightness(2.2) blur(4px)}100%{opacity:1;transform:none;filter:none}}
@keyframes qOut{0%{opacity:1}22%{opacity:.9;transform:translateX(-10px) skewX(-6deg)}24%{transform:translateX(8px) skewX(4deg)}100%{opacity:0;transform:translateX(-40px) skewX(-10deg);filter:brightness(.4)}}
.q-no{font-family:var(--disp);font-size:19px;color:var(--cy);letter-spacing:.35em;margin-bottom:14px}
.q-text{font-family:'Noto Sans SC',sans-serif;font-weight:300;font-size:clamp(21px,3.2vw,32px);
  line-height:1.55;color:var(--amber);letter-spacing:.06em;margin-bottom:40px;white-space:pre-line;
  text-shadow:0 0 22px rgba(232,180,94,.25)}
.q-text .caret{display:inline-block;width:.55em;height:1.05em;background:var(--ph);
  vertical-align:-4px;margin-left:4px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.opts{display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .4s .1s}
.opts.ready{opacity:1}
.opt{display:flex;align-items:center;gap:16px;text-align:left;width:100%;
  background:none;border:none;border-left:2px solid transparent;color:var(--txt);
  font-family:var(--mono);font-size:clamp(14.5px,1.8vw,17.5px);line-height:1.6;
  padding:12px 18px;cursor:pointer;opacity:0;transform:translateY(10px);
  transition:border-color .18s,color .18s,padding .18s,background .18s}
.opt.show{opacity:1;transform:none;transition:opacity .4s,transform .4s,border-color .18s,color .18s,padding .18s,background .18s}
.opt .idx{font-family:var(--disp);font-size:18px;color:var(--ph-dim);flex-shrink:0;letter-spacing:.1em}
.opt .arr{margin-left:auto;color:var(--ph);opacity:0;transform:translateX(-6px);transition:all .22s}
.opt:hover,.opt.kbf{border-left-color:var(--ph);color:var(--amber);
  background:linear-gradient(90deg,var(--ph-faint),transparent 70%);padding-left:26px}
.opt:hover .idx,.opt.kbf .idx{color:var(--ph)}
.opt:hover .arr,.opt.kbf .arr{opacity:1;transform:none}
.kbd-hint{margin-top:26px;font-size:12px;color:var(--ph-dim);letter-spacing:.25em;opacity:0;transition:opacity .6s .6s}
.kbd-hint.ready{opacity:.7}
.blank-wrap{display:flex;flex-direction:column;gap:20px}
.blank-input{align-self:flex-start;width:min(520px,82vw);font-family:var(--mono);
  font-size:clamp(18px,2.3vw,23px);color:var(--amber);background:none;border:none;
  border-bottom:1px solid var(--line);padding:6px 4px;outline:none;line-height:2}
.blank-input:focus{border-bottom-color:var(--ph);box-shadow:0 14px 26px -18px rgba(217,164,74,.6)}
.blank-input::placeholder{color:var(--ph-dim);opacity:.55}
.blank-note{font-size:13px;color:var(--ph-dim);letter-spacing:.15em}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:40px;gap:14px}
.nbtn{font-family:var(--mono);font-size:15px;letter-spacing:.25em;background:none;
  border:1px solid var(--line);color:var(--ph-dim);padding:9px 24px;cursor:pointer;transition:all .2s}
.nbtn:hover:not(:disabled){border-color:var(--ph);color:var(--ph)}
.nbtn:disabled{opacity:.25;cursor:default}
.nbtn.primary{border-color:var(--ph);color:var(--ph);background:var(--ph-faint)}
.nbtn.primary:hover:not(:disabled){background:var(--ph);color:#000;box-shadow:0 0 24px rgba(217,164,74,.4)}
.gate-card{text-align:center;display:flex;flex-direction:column;align-items:center}
.gate-card .en{color:var(--ph-dim);font-size:13px;letter-spacing:.55em;margin-bottom:22px}
.gate-card h1{font-family:var(--disp);font-size:clamp(34px,6.8vw,72px);color:var(--ph);
  line-height:1.05;letter-spacing:.12em;text-shadow:0 0 30px rgba(217,164,74,.4);margin-bottom:24px;
  min-height:1em;transform-style:preserve-3d;transition:transform .18s ease-out}
.gate-card h1 .ch{display:inline-block;opacity:0;transition:opacity .4s ease}
.gate-card p{max-width:36em;color:var(--txt);line-height:2.1;font-family:'Noto Sans SC',sans-serif;
  font-weight:300;white-space:pre-line}
.bigbtn{margin-top:44px;font-family:var(--disp);font-size:22px;letter-spacing:.3em;background:none;
  border:1px solid var(--ph);color:var(--ph);padding:14px 54px;cursor:pointer;transition:all .25s}
.bigbtn:hover{background:var(--ph);color:#000;box-shadow:0 0 40px rgba(217,164,74,.5)}
/* ---- 音频题（参考 音频选项格式参考） ---- */
.aopts{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.aopt{display:flex;align-items:center;gap:16px;background:var(--ph-faint);
  border:1px solid var(--line);padding:11px 18px;cursor:pointer;text-align:left;width:100%;
  color:var(--txt);font-family:var(--mono);font-size:15px;opacity:0;transform:translateY(10px);
  transition:border-color .2s,background .2s,opacity .4s,transform .4s}
.aopt.show{opacity:1;transform:none}
.aopt:hover:not(.locked){border-color:var(--ph-dim);background:rgba(217,164,74,.1)}
.aopt.playing{border-color:var(--ph);box-shadow:0 0 22px rgba(217,164,74,.25),inset 0 0 18px rgba(217,164,74,.06)}
.aopt.chosen{border-color:var(--ok);background:rgba(127,191,127,.05)}
.aopt.chosen .a-play{color:var(--ok)}
.aopt.locked:not(.playing):not(.chosen){opacity:.28}
.a-play{flex-shrink:0;width:38px;height:38px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ph);

window.addEventListener("error", function (ev) {
  try {

      b.dataset.err = "1";
      b.style.cursor = "pointer";
      b.innerHTML = '<div style="color:var(--red);font-size:15px;white-space:pre-wrap">SCRIPT ERROR<br>' + String(ev.message || ev.error || "unknown") + '</div>' +

      b.onclick = function () {
        try { sessionStorage.setItem("cm-booted", "1"); } catch (e) {}
        b.remove();
        document.body.classList.add("powering");
        if (typeof startHero === "function") startHero();
      };
    }
  } catch (e) {}
});

let QUIZ_LIST = [];         /* 排序后的题目 */
let QUIZ_ANSWERS = [];      /* 每题答案索引 */
let QUIZ_NAME = "";         /* 姓名 */
let QUIZ_EGG = null;        /* 姓名彩蛋命中 */
let QUIZ_FORCE = null;      /* 直判分区 */
let QUIZ_SPECIAL = false;   /* 特殊结局 */
let QUIZ_EXCLUDES = {};     /* 剔除分区 */
let QUIZ_STEP = -1;         /* -1 开场 → 0..n-1 题目 → n 判定 → n+1 结果 → n+2 签字 */
let QUIZ_KEY = null;        /* 键盘监听（防叠） */
let QUIZ_RESULT = null;     /* {name, special} */
let QUIZ_T0 = 0;            /* 问卷开始时间（隐藏规则：作答过快=瞎点） */
let QUIZ_TOOFAST = false;   /* 作答过快标记 */
const QUIZ_AUDIO_CACHE = {};/* 音频全局缓存：常驻引用防止浏览器取消预载下载 */

function quizSorted(){
  return (D.quiz.questions||[]).map((x,i)=>({ ...x, _i:i }))
    .sort((a,b)=>{
      const aw=a.type==="scare"||a.type==="name"?999:(a.w||1);
      const bw=b.type==="scare"||b.type==="name"?999:(b.w||1);
      return aw-bw || a._i-b._i;
    });
}
/* 全局预加载音频题素材：对象存入缓存保持引用，浏览器按 preload=auto 自然调度
   （不手动 load()，避免 4 个大文件同时抢带宽拖慢页面本身） */
function quizPreloadAudio(){
  (D.quiz.questions||[]).forEach(q=>(q.opts||[]).forEach(o=>{
    if(!o.src||QUIZ_AUDIO_CACHE[o.src])return;
    try{
      const a=new Audio(o.src);
      a.preload="auto";
      QUIZ_AUDIO_CACHE[o.src]=a;
    }catch(e){}
  }));
}
function formHtml(){
  QUIZ_LIST=quizSorted();
  QUIZ_ANSWERS=[];QUIZ_NAME="";QUIZ_EGG=null;QUIZ_FORCE=null;QUIZ_SPECIAL=false;
  QUIZ_EXCLUDES={};QUIZ_STEP=-1;QUIZ_RESULT=null;QUIZ_T0=0;QUIZ_TOOFAST=false;
  return `<div class="qmeta">
      <span>DEEP REGISTRATION // 深度登记程序</span>
      <span id="qcount">STANDBY</span>
    </div>
    <div id="quizApp" style="position:relative">
      <div class="pbar" id="pbar" style="top:0"></div>
    </div>`;
}

/* ---------- 工具 ---------- */
function typeInto(el,text,speed){
  return new Promise(res=>{
    el.textContent="";
    let i=0;
    (function step(){
      el.textContent=text.slice(0,++i);
      const ca=document.createElement("span");ca.className="caret";
      el.appendChild(ca);
      if(i<text.length)setTimeout(step,speed+Math.random()*speed*.7);
      else{el.removeChild(ca);res();}
    })();
  });
}
function pulseFlash(color,ms){
  let fl=$("flicker");
  if(!fl){fl=document.createElement("div");fl.id="flicker";document.body.appendChild(fl);}
  fl.style.transition="background .1s";fl.style.background=color;
  setTimeout(()=>fl.style.background="none",ms);
}
function fmtQ(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function quizMeta(){
  const n=QUIZ_LIST.length;
  if(QUIZ_STEP<0){$("qcount").textContent="STANDBY";}
  else if(QUIZ_STEP<n){$("qcount").textContent=String(QUIZ_STEP+1).padStart(2,"0")+" / "+String(n).padStart(2,"0");}
  else if(QUIZ_STEP===n){$("qcount").textContent="JUDGING 判定中";}
  else if(QUIZ_STEP===n+1){$("qcount").textContent="DONE 已归档";}
  const pb=$("pbar");if(pb)pb.style.width=Math.min((QUIZ_STEP+1)/Math.max(1,n)*100,100)+"%";
}

/* ---------- 切换引擎 ---------- */
function quizShow(anim=true){
  const app=$("quizApp");if(!app)return;
  const old=app.querySelector(".qcard");
  const done=()=>{
    if(old)old.remove();
    const n=QUIZ_LIST.length;
    if(QUIZ_STEP===-1)renderGate();
    else if(QUIZ_STEP<n)renderQuestion(QUIZ_STEP);
    else if(QUIZ_STEP===n)renderJudging();
    else if(QUIZ_STEP===n+1)renderVerdict();
    else renderSign();
  };
  quizMeta();
  if(anim&&old){old.classList.add("leave");setTimeout(done,400);}else done();
}
function pickAnswer(i,k){
  QUIZ_ANSWERS[i]=k;
  QUIZ_STEP++;
  quizShow();
}

  $("quizApp").appendChild(c);

    const h=$("gate-title");if(!h)return;
    const txt=h.textContent,chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/*-+_";
    h.textContent="";
    const spans=[];
    for(let i=0;i<txt.length;i++){
      const s=document.createElement("span");s.className="ch";
      s.style.transitionDelay=(i*40)+"ms";
      s.textContent=txt[i]===" "?"\u00A0":txt[i];

    }

    }));

      const prog=Math.floor(performance.now()/40)-2;let all=true;

        if(i>=prog)return;
        if(Math.random()<.25&&s.dataset.locked!=="1"){s.textContent=chars[Math.floor(Math.random()*chars.length)];all=false;}
        else{s.dataset.locked="1";s.textContent=txt[i]===" "?"\u00A0":txt[i];}
      });
      if(all&&prog>txt.length){clearInterval(iv);spans.forEach((s,i)=>{s.textContent=txt[i]===" "?"\u00A0":txt[i];});}
    },50);
  })();

      ht.style.transform=`perspective(900px) rotateX(${(-py*5).toFixed(2)}deg) rotateY(${(px*5).toFixed(2)}deg)`;

}

  else if(q.type==="scare")renderQScare(c,q,back,i);

  else renderQSingle(c,q,back,i);
  const bk=c.querySelector("#qb");
  if(bk)bk.onclick=()=>{ if(QUIZ_STEP<=0)return; QUIZ_ANSWERS[QUIZ_STEP]=undefined; QUIZ_STEP--; quizShow(); };

function bindKeys(c,opts,i){
  let kf=0;
  const paint=()=>opts.forEach((o,k)=>o.classList.toggle("kbf",k===kf));
  /* 初始不高亮，按键后才显示 */
  if(QUIZ_KEY){document.removeEventListener("keydown",QUIZ_KEY);QUIZ_KEY=null;}
  const handler=e=>{
    if(!document.body.contains(c)){document.removeEventListener("keydown",handler);QUIZ_KEY=null;return;}
    if(e.key==="ArrowDown"){kf=(kf+1)%opts.length;paint();}
    else if(e.key==="ArrowUp"){kf=(kf-1+opts.length)%opts.length;paint();}
    else if(/^[1-9]$/.test(e.key)&&opts[+e.key-1]){kf=+e.key-1;paint();}
    else if(e.key==="Enter"&&opts[kf])pickAnswer(i,kf);
  };
  QUIZ_KEY=handler;document.addEventListener("keydown",handler);
}
function renderQSingle(c,q,back,i){
  c.innerHTML=`<div class="q-no">${esc("Q."+String(i+1).padStart(2,"0"))}</div>

    c.querySelector(".opts").classList.add("ready");
    opts.forEach((o,k)=>{o.classList.add("show");o.onclick=()=>pickAnswer(i,k);});
    c.querySelector(".kbd-hint").classList.add("ready");
    bindKeys(c,opts,i);
  });
}

function renderQAudio(c,q,back,i){
  c.innerHTML=`<div class="q-no">${esc("Q."+String(i+1).padStart(2,"0"))} · AUDITORY</div>
    <div class="q-text"></div>
    <div class="aopts"></div>
    <div class="kbd-hint">${esc(q.hint||"// 点击 ▶ 试听")}</div>
    <div class="kbd-hint" style="opacity:.45">// 初次加载可能需要 1-2 分钟，可先根据下方描述直接作答</div>
    <div class="nav-row"><button class="nbtn" id="qb">◀ 回退</button>
      <button class="nbtn primary" id="qa-ok" disabled>确认此段 ▶</button></div>`;
  typeInto(c.querySelector(".q-text"),q.q,40).then(()=>{
    const box=c.querySelector(".aopts");
    const players=[];let current=null,chosenK=-1;
    function stopAll(){
      players.forEach(p=>{
        if(p.timer){clearInterval(p.timer);p.timer=null;}
        try{if(p.audio){p.audio.pause();p.audio.currentTime=0;}}catch(e){}
        p.el.classList.remove("playing");
        p.el.querySelector(".a-play").textContent="▶";
        p.el.querySelector(".a-state").textContent="";
        p.el.querySelectorAll(".wave i").forEach(b=>b.style.height=(10+Math.random()*15)+"%");
      });
      current=null;
    }
    q.opts.forEach((o,k)=>{
      const el=document.createElement("button");el.className="aopt";
      el.innerHTML=`<span class="a-play">▶</span>
        <span class="a-main"><span class="a-title">${esc(o.t)}</span>${o.d?`<span class="a-desc">${esc(o.d)}</span>`:""}</span>
        <span class="wave"></span>
        <span class="a-meta"><span class="a-state"></span><span class="a-no">CH-0${k+1}</span><span class="a-dur">--:--</span></span>`;
      const w=el.querySelector(".wave");
      for(let j=0;j<16;j++){const b=document.createElement("i");b.style.height=(10+Math.random()*15)+"%";w.appendChild(b);}
      let audio=null;
      if(o.src){
        audio=QUIZ_AUDIO_CACHE[o.src]||new Audio(o.src);
        audio.preload="auto";
        if(!QUIZ_AUDIO_CACHE[o.src]){QUIZ_AUDIO_CACHE[o.src]=audio;audio.load();}
        audio.onloadedmetadata=()=>{const d=el.querySelector(".a-dur");if(d&&isFinite(audio.duration))d.textContent=fmtQ(audio.duration);};
        audio.onerror=()=>{const s=el.querySelector(".a-state");if(s)s.textContent="✕ 加载失败";};
        audio.oncanplaythrough=null; /* 每渲染清一次，防旧监听 */
        audio.onended=null;
        if(audio.readyState>=1&&isFinite(audio.duration)){const d=el.querySelector(".a-dur");if(d)d.textContent=fmtQ(audio.duration);}
      }
      const p={el,audio,timer:null};
      players.push(p);
      el.onclick=()=>{
        if(el.classList.contains("locked")||chosenK>-1)return;
        if(current===p){stopAll();$("qa-ok").disabled=true;return;}  /* 再点 = 暂停 */
        stopAll();current=p;
        el.classList.add("playing");el.querySelector(".a-play").textContent="■";
        const st=el.querySelector(".a-state");
        if(audio){
          if(audio.readyState>=3){  /* 已缓冲到可播放：直接播 */
            st.textContent="◉ PLAYING";
            audio.play().catch(()=>{});
          }else{  /* 数据未就绪：等待缓冲完成自动续播，绝不重复 load() */
            st.textContent="◉ LOADING…";
            audio.play().catch(()=>{
              audio.oncanplaythrough=function h(){
                audio.oncanplaythrough=null;
                if(current===p&&el.classList.contains("playing")){
                  st.textContent="◉ PLAYING";
                  audio.play().catch(()=>{});
                }
              };
            });
          }
          audio.onended=()=>{if(current===p)stopAll();};
        }
        p.timer=setInterval(()=>{
          if(!el.isConnected){clearInterval(p.timer);p.timer=null;return;}
          el.querySelectorAll(".wave i").forEach(b=>{if(Math.random()<.85)b.style.height=(12+Math.random()*82)+"%";});
        },110);
        $("qa-ok").disabled=false;
      };
      box.appendChild(el);
      setTimeout(()=>el.classList.add("show"),120*k+300);
    });
    c.querySelector("#qa-ok").onclick=()=>{
      if(!current||chosenK>-1)return;
      chosenK=players.indexOf(current);
      players.forEach(p=>{
        if(p.timer){clearInterval(p.timer);p.timer=null;}
        try{if(p.audio){p.audio.pause();p.audio.currentTime=0;}}catch(e){}
        p.el.classList.remove("playing");
        p.el.querySelector(".a-play").textContent="▶";
        p.el.querySelector(".a-state").textContent=p.el===current?"✓ SELECTED":"MUTED";
        p.el.classList.toggle("chosen",p.el===current);
        p.el.classList.toggle("locked",p.el!==current);
      });
      pickAnswer(i,chosenK);
    };
  });
}

/* ---------- 计分 ---------- */
function computeResult(){
  /* 隐藏规则：作答总时长 < 30 秒 = 全程瞎点 → 无结果 */
  const elapsed = QUIZ_T0 ? Date.now() - QUIZ_T0 : -1;
  QUIZ_TOOFAST = elapsed >= 0 && elapsed < 30000;
  const scores={};D.zones.forEach(z=>scores[z.name]=0);
  let space=0;   /* 太空选项计数：夜空与星辰之间 / 坐上飞船 / 浮空巨构 */
  QUIZ_LIST.forEach((q,idx)=>{
    const a=QUIZ_ANSWERS[idx];if(a==null||a<0)return;
    const o=q.opts&&q.opts[a];if(!o)return;
    if(o.special)QUIZ_SPECIAL=true;
    if(o.force)QUIZ_FORCE=o.force;
    if(o.space)space++;
    (o.x||[]).forEach(z=>{QUIZ_EXCLUDES[z]=true;});
    for(const z in (o.s||{}))scores[z]=(scores[z]||0)+o.s[z];
  });
  /* reason 优先级：force > 我是神 > 作答过快 > 并列/零分 */
  if(QUIZ_FORCE)return {name:QUIZ_FORCE,special:false};
  if(QUIZ_SPECIAL)return {name:null,special:true,reason:"god"};
  if(QUIZ_TOOFAST)return {name:null,special:true,reason:"fast"};
  /* 科幻双区判定：科幻区总分最高（冠军落在电子囚笼/激光停泊）时，
     太空选项选≥2个=激光停泊，≤1个=电子囚笼 */
  const scifiPick=z=>z==="激光停泊"||z==="电子囚笼";
  const FANT=["术法阵列","缸中之魂","浮点终端"],SCIF=["电子囚笼","激光停泊"];
  const order=[];
  for(const z in scores){if(QUIZ_EXCLUDES[z])continue;order.push([z,scores[z]]);}
  order.sort((a,b)=>b[1]-a[1]);
  const top=order[0];
  if(!top||top[1]<=0)return {name:null,special:true,reason:"tie"};
  /* 方向锁定：多个选项强指向某些区时，只在指向区里判定（防少数非典型作答制造并列/待分配） */
  const votes={};
  QUIZ_LIST.forEach((q,idx)=>{
    const a=QUIZ_ANSWERS[idx];if(a==null||a<0)return;
    const o=q.opts&&q.opts[a];if(!o)return;
    const vals=Object.values(o.s||{});if(!vals.length)return;
    const ms=Math.max(...vals);if(ms<2)return;
    for(const z in (o.s||{})){if(o.s[z]===ms&&!QUIZ_EXCLUDES[z])votes[z]=(votes[z]||0)+1;}
  });
  const vMax=Math.max(0,...Object.values(votes));
  if(vMax>=3){
    const locked=order.filter(([z])=>votes[z]>=vMax-1);
    if(locked.length){
      const lt=locked[0],l2=locked[1];
      if(locked.length===1||(l2&&lt[1]>l2[1]))return {name:lt[0],special:false};
      if(l2&&lt[1]===l2[1]){
        if(scifiPick(lt[0])&&scifiPick(l2[0]))return {name:space>=2?"激光停泊":"电子囚笼",special:false};
        if((FANT.includes(lt[0])&&SCIF.includes(l2[0]))||(FANT.includes(l2[0])&&SCIF.includes(lt[0])))
          return {name:"浮点终端",special:false};
        return {name:null,special:true,reason:"tie"};
      }
    }
  }
  /* 并列：科幻对并列由太空选项定夺；魔法×科幻对位→浮点终端；其余待分配 */
  if(order.length>1&&order[1][1]===top[1]&&top[1]>0){
    if(scifiPick(top[0])&&scifiPick(order[1][0]))return {name:space>=2?"激光停泊":"电子囚笼",special:false};
    if((FANT.includes(top[0])&&SCIF.includes(order[1][0]))||(FANT.includes(order[1][0])&&SCIF.includes(top[0])))
      return {name:"浮点终端",special:false};
    return {name:null,special:true,reason:"tie"};
  }
  /* 单冠军：落在科幻双区则用太空选项数定夺 */
  if(scifiPick(top[0]))return {name:space>=2?"激光停泊":"电子囚笼",special:false};
  return {name:top[0],special:false};
}

let stepCur = 1, stepTotal = 10, nameStep = 0;
function initStepper() {

function stepGo(n) {
  if (n < 1 || n > stepTotal || n === stepCur) return;
  const dir = n > stepCur ? 1 : -1;
  stepCur = n;
  document.querySelectorAll(".step-panel").forEach(p => p.classList.remove("on", "anim", "from-r", "from-l"));
  const neu = document.querySelector(`.step-panel[data-step="${n}"]`);
  if (neu) { neu.classList.add("on", "anim", dir > 0 ? "from-r" : "from-l"); void neu.offsetWidth; }
  renderStepper();
}
function stepNext() { if (stepCur < stepTotal) stepGo(stepCur + 1); else submitForm(); }
function stepBack() { if (stepCur > 1) stepGo(stepCur - 1); }
function renderStepper() {
  for (let n = 1; n <= stepTotal; n++) {
    const ind = document.getElementById("si-" + n);
    if (!ind) continue;
    ind.classList.toggle("done", stepCur > n);
    ind.classList.toggle("cur", stepCur === n);
    const ic = document.getElementById("sic-" + n);
    if (ic) ic.innerHTML = stepCur > n ? "✓" : n;
    const sc = document.getElementById("sc-" + n);
    if (sc) sc.classList.toggle("done", stepCur > n);
  }
  const back = document.getElementById("step-back");
  if (back) back.style.visibility = stepCur === 1 ? "hidden" : "visible";
  const next = document.getElementById("step-next");
  if (next) next.textContent = stepCur === stepTotal ? esc(D.form.submit) : "下一步";
}

function decodeZoneTitle() {
  const h = $("zmap-title");
  if (!h) return;
  const txt = h.textContent, chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/*-+_";
  h.textContent = "";
  const spans = [];
  for (let i = 0; i < txt.length; i++) {
    const s = document.createElement("span");
    s.className = "ch";
    s.style.transitionDelay = (i * 40) + "ms";
    s.textContent = txt[i] === " " ? "\u00A0" : txt[i];
    h.appendChild(s); spans.push(s);
  }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    spans.forEach(s => { s.style.opacity = 1; s.style.transition = "opacity .3s"; });
  }));
  const iv = setInterval(() => {
    const prog = Math.floor(performance.now() / 40) - 2;
    let all = true;
    spans.forEach((s, i) => {
      if (i >= prog) return;
      if (Math.random() < .25 && s.dataset.locked !== "1") { s.textContent = chars[Math.floor(Math.random() * chars.length)]; all = false; }
      else { s.dataset.locked = "1"; s.textContent = txt[i]; }
    });
    if (all && prog > txt.length) { clearInterval(iv); spans.forEach((s, i) => { s.textContent = txt[i]; }); }
  }, 50);
}

    if (bc) bc.innerHTML = pad2(d.getHours()) + '<span class="sep">:</span>' + pad2(d.getMinutes()) + '<span class="sep">:</span>' + pad2(d.getSeconds());
    const sd = $("subDate"); if (sd) sd.textContent = d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate());
    const dy = $("subDay"); if (dy) dy.textContent = "#" + pad2(Math.floor(Date.now() / 86400000) % 365);

function drawCal() {
  const y = calD.getFullYear(), m = calD.getMonth();
  const ct = $("calTitle"); if (ct) ct.textContent = y + " / " + pad2(m + 1);
  const first = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  const prevDim = new Date(y, m, 0).getDate();
  const today = new Date();
  const cells = [];
  for (let p = first - 1; p >= 0; p--) cells.push({ d: prevDim - p, dim: true });
  for (let c = 1; c <= dim; c++) cells.push({ d: c, dim: false, today: today.getFullYear() === y && today.getMonth() === m && today.getDate() === c });
  let k = 0;
  while (cells.length % 7) cells.push({ d: ++k, dim: true });
  const cd = $("calDays");
  if (cd) cd.innerHTML = cells.map(c => "<span" + (c.dim ? ' class="dim"' : c.today ? ' class="today"' : "") + ">" + c.d + "</span>").join("");
}

/* ================= HERO 打字机（数据驱动）
   - 首次进入固定显示第一条（欢迎词），之后加权随机
   - data 格式：字符串（w=1）或 {t,w} 对象；w 越大出现越频繁（彩蛋条把 w 调低即可）
   ================= */
let twC = 0, twDel = false, twFirst = true, twCur = "";
function twPick() {
  const raw = (D && D.home && D.home.typewriter) || ["CYBERMORGUE"];
  if (twFirst) {
    twFirst = false;
    return typeof raw[0] === "string" ? raw[0] : raw[0].t;
  }
  const pool = [];
  raw.forEach(it => {
    const txt = typeof it === "string" ? it : it.t;
    const w = typeof it === "string" ? 1 : (it.w == null ? 1 : Math.max(0.1, it.w));
    const n = Math.max(1, Math.round(w * 10));
    for (let k = 0; k < n; k++) pool.push(txt);
  });
  /* 避免连续两次抽到同一文本：剔除上一轮，重抽最多 20 次兜底 */
  let pick = twCur, guard = 0;
  while (pick === twCur && guard < 20) {
    pick = pool[Math.floor(Math.random() * pool.length)];
    guard++;
  }
  return pick;
}
function typeLoop() {
  const el = $("typewriter");
  if (!el) return;
  if (twC === 0 && !twDel) twCur = twPick();
  const t = twCur;
  el.textContent = t.slice(0, twC);
  if (!twDel) {
    if (++twC > t.length) { twDel = true; return setTimeout(typeLoop, 3600); }
  } else {
    if (--twC <= 0) { twDel = false; }
  }
  setTimeout(typeLoop, twDel ? 30 : 70);
}
function startHero() { if (D) typeLoop(); }

const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: .12 });

/* ================= 数字滚动计数 ================= */
const countIO = new IntersectionObserver(es => {
  es.forEach(e => {
    if (!e.isIntersecting) return;
    countIO.unobserve(e.target);
    if (e.target.dataset.inf) { e.target.textContent = "∞"; return; }
    const raw = String(e.target.dataset.count || "");
    const m = raw.match(/^(\d+)(.*)$/);
    if (!m) { e.target.textContent = raw; return; }
    const target = +m[1], suffix = m[2];
    const t0 = performance.now(), dur = 1400;
    (function step(now) {
      const p = Math.min((now - t0) / dur, 1);
      e.target.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3))) + suffix;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}, { threshold: .6 });
function bindCounts() { document.querySelectorAll("[data-count]").forEach(el => countIO.observe(el)); }

}, 7000);

/* ================= 启动 ================= */
async function init() {
  try {
    D = await fetch(DATA).then(r => r.json());
    renderMain();
    $("view-form").innerHTML = formHtml();
    quizShow(false);
    $("view-zones").innerHTML = zonesHtml();
    initMap();
    decodeZoneTitle();
    $("view-login").innerHTML = loginHtml();
    $("view-staff").innerHTML = staffHtml();
    quizPreloadAudio();
    bindReveal();
    bindCounts();
    for (let i = 0; i < 7; i++) pushLog();
    setInterval(pushLog, 1800);
    let booted = false;
    try { booted = sessionStorage.getItem("cm-booted") === "1"; } catch (e) {}
    if (booted) skipBoot(); else nextBootLine();
    let goto = (location.hash || "").replace("#", "");
    try { const s = sessionStorage.getItem("cm-goto"); if (s) { goto = s; sessionStorage.removeItem("cm-goto"); } } catch (e) {}
    if (goto && $("view-" + goto)) show(goto, null, false);
  } catch (e) {
    /* 出错时仍然可以进入：把错误显示在 boot 屏，点击放行 */
    console.error(e);
    try {
      const b = $("boot");
      if (b) {
        b.style.cursor = "pointer";
        b.innerHTML = '<div style="color:var(--red);font-size:15px;white-space:pre-wrap">BOOT ERROR<br>' +
          esc((e && e.message) || String(e)) + '</div>' +
          '<div style="color:var(--ph-dim);margin-top:10px">— 点击任意处继续 —</div>';
        b.onclick = function () {
          try { sessionStorage.setItem("cm-booted", "1"); } catch (e2) {}
          b.remove();
          document.body.classList.add("powering");
          if (typeof startHero === "function") startHero();
        };
      }
    } catch (e2) {}
  }
}
init();
if (typeof spherse !== "undefined" && spherse.events) {
  spherse.events.on("file:update", { path: DATA }, () => init());
}

/* ===== 瞄准光标 ===== */
(function () {
  if (window.__CM_CURSOR__) return; /* 共享 base.js 已接管光标 */
  if (!window.matchMedia || matchMedia("(hover: none)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sel = ".gate,.mi,.cal-nav,.gnext,.tbtns button,.todo,.todo-add button,.logout,.step-next,.step-back,.zone-link,.chip,.more,.entry,.path,.logo,nav a,.gate-red,.gate-green,#q,.clearbtn,.back,.fchip";
  var w = document.createElement("div"); w.className = "cc";
  w.innerHTML = '<i class="cc-dot"></i><i class="cc-c cc-tl"></i><i class="cc-c cc-tr"></i><i class="cc-c cc-br"></i><i class="cc-c cc-bl"></i>';
  document.body.appendChild(w);
  var dot = w.querySelector(".cc-dot"), cs = Array.from(w.querySelectorAll(".cc-c"));
  var free = [[-15,-15],[6,-15],[6,6],[-15,6]];
  var mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, locked = null;
  document.body.classList.add("has-cc");
  function frame() {
    cx += (mx - cx) * .2; cy += (my - cy) * .2;
    dot.style.left = cx + "px"; dot.style.top = cy + "px";
    if (clickT >= 0) {
      var p = (performance.now() - clickT) / 380;
      if (p >= 1) {
        clickT = -1;
        cs.forEach(function (c) { c.style.transition = ""; });
      } else {
        var ang = p * Math.PI * 2;
        var cos = Math.cos(ang), sin = Math.sin(ang);
        var cr = locked ? locked.getBoundingClientRect() : null;
        /* 轨道圆心 = 四角的视觉中心（准星自身中心），绕它转才不偏心 */
        var cxs, cys;
        if (cr) { cxs = (cr.left + cr.right) / 2; cys = (cr.top + cr.bottom) / 2; }
        else { cxs = cx - 4.5; cys = cy - 4.5; }
        cs.forEach(function (c, i) {
          var ox, oy;
          if (cr) {
            var cps = [[cr.left - 1, cr.top - 1], [cr.right - 7, cr.top - 1], [cr.right - 7, cr.bottom - 7], [cr.left - 1, cr.bottom - 7]];
            ox = cps[i][0] - cxs; oy = cps[i][1] - cys;
          } else { ox = free[i][0] + 4.5; oy = free[i][1] + 4.5; }
          c.style.left = (cxs + ox * cos - oy * sin) + "px";
          c.style.top = (cys + ox * sin + oy * cos) + "px";
        });
      }
    }
    if (clickT < 0 && !locked) { cs.forEach(function (c, i) { c.style.left = (cx + free[i][0]) + "px"; c.style.top = (cy + free[i][1]) + "px"; }); }
    requestAnimationFrame(frame);
  }
  function lock(t) {
    if (t === locked) return;
    locked = t; w.classList.add("locked");
    var r = t.getBoundingClientRect();
    var p = [[r.left - 1, r.top - 1], [r.right - 7, r.top - 1], [r.right - 7, r.bottom - 7], [r.left - 1, r.bottom - 7]];
    cs.forEach(function (c, i) { c.style.left = p[i][0] + "px"; c.style.top = p[i][1] + "px"; });
  }
  function unlock(t) { if (t && t === locked) { locked = null; w.classList.remove("locked"); } }
  addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
  var clickT = -1;
  addEventListener("mousedown", function () { w.classList.add("cc-press"); w.classList.add("cc-click"); clickT = performance.now(); cs.forEach(function (c) { c.style.transition = "none"; }); });
  addEventListener("mouseup", function () { w.classList.remove("cc-press"); setTimeout(function () { w.classList.remove("cc-click"); }, 380); });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(sel); if (t) lock(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(sel); unlock(t); });
  requestAnimationFrame(frame);
})();
</script>
