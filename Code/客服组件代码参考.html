<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"="width=device-width, initial-scale=1.0">
<title>SUPPORT WIDGET // 讯务科在线值班</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=N+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --am:#e8b04b; --amd:#8a6a2f; --amf:rgba(232,176,75,.07);
  --gr:#7fbf7f; --red:#c85a4a; --cy:#6fb3b8;
  --bg:#0c0a06; --panel:#0f0d07; --panel2:#14110a;
  --line:rgba(232,176,75,.25); --txt:#d8cdb4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);min-height:100vh;
  font-family:'323','Noto Sans SC',monospace;font-size:17px;line-height:1.9;
  display:flex;align-items:center;justify-content:center;
  text-shadow:-.4px 0 rgba(255,50,90,.10),.4px 0 rgba(0,205,255,.10)}
body::before{content:"这里假装是档案主页。右下角就是组件。";
  color:var(--amd);opacity:.5;letter-spacing:.2em}
.crt-lines{position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px)}

/* ================= FAB =================.cs-fab{position:fixed;right:26px;bottom:26px;z-index:1000;
  width:62px;height:62px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.cs-fab .core{width:44px;height:44px;background:var(--panel);
  border:1px var(--am);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(232,176,75,.25),inset 0 0 12px rgba(232,176,75,.08);
  transition:all .25s;position:relative;z-index:2}
.cs-fab:hover .core{box-shadow:0 0 px rgba(232,176,,.5),inset 0 0 16px rgba(232,176,75,.14);
  transform:translateY(-2px)}
.cs-fab svg{width:22px;height:22px;fill:none;stroke:var(--am);stroke-width:1.7}
.cs-fab .ring{position:absolute;inset:0;border:1px solid rgba(232,176,75,.35);
  animation:spin 9s linear infinite}
.cs-fab .ring::before{content:"";position:absolute;top:-3px;left:50%;
  width:5px;height:5px;background:var(--);box-shadow:0 0 8px var(--am)}
.cs-fab .ring2{position:absolute;inset:8px;border:1px dashed rgba(232,176,75,.2);
  animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cs-fab .pulse{position:absolute;inset:0;border1px solid var(--am);
  opacity:0;animation:pulseOut 4.5s ease-out infinite}
@keyframes pulseOut{0%,72%{opacity:0;transform:scale(.8)}
  76%{opacity:.7}100%{opacity:0;transform:scale(1.9)}}
.cs-fab .dot{position:absolute;top:2px;right:px;width:12px;height:12px;
  border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);
  opacity:0;transition:opacity .4s;z-index:3}
.cs-fab .dot.on{opacity:1;animation:dotBlink .9s steps(2) infinite}
@keyframes dotBlink{50%{opacity:.15}}
.cs-fab .fab-tip{position:absolute;right:74px;top:50%;
  transform:translateY(-50%) translateX(6px);
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--am);
  color:var(--am);-size:14px;letter-spacing:.25em;padding:5px 16px;
  opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;
  box-shadow:0 0 16px rgba(0,0,0,.7)}
.cs-fab:hover .fab-tip{opacity:1;transform:translateY(-50%) translateX(0)}

/* ================= 面板 ================= */
.cs-panel{position:fixed;right:26px;bottom:26px;z-index:1001;
  width:min(410px,calc(100vw 32px));height:min(580px,calc(100vh - 56px));
  background:linear-gradient(180deg,var(--panel2),var(--panel) 120px);
  border:1px solid var(--line);display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.85),0 0 28px rgba(232,176,75,.14),inset 0 0 40px rgba(0,0,0,.4);
  transform-origin:bottom right;
  animation:scanIn .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes scanIn{
  0%{opacity:0;transform:scaleY(.02 scaleX(.3);filter:brightness(3)}
  45%{opacity:1;transform:scaleY(.03) scaleX(1);filter:brightness(2.4)}
  70%{transform:scaleY(1.02) scaleX(1)}
  100%{opacity:1;transform:none;filter:none}}
.cs-panel.closing{animation:scanOut .28s cubic-bezier(.6,0,.9,.4) both}
@keyframes scanOut{
  0%{opacity:1;transform:none}
  55%{opacity:1;transform:scaleY(.04) scaleX(1);filter:brightness(2.2)}
  100%{opacity:0;transform:scale(.02)(.3);filter:brightness(3)}}
.cs-panel::before,.cs-panel::after,
.cs-corner1,.cs-corner2{content:"";position:absolute;width:18px;height:18px;
  pointer-events:none;z-index:5}
.cs-panel::beforetop:-1px;left:-1px;border-top:2px solid var(--am);border-left:2px solid var(--am)}
.cs-panel::after{bottom:-1pxright:-1px;border-bottom:2px solid var(--am);border-right:2px solid var(--am)}
.cs-corner1{top:-1pxright:-1px;border-top:2px solid var(--am);border-right:2px solid var(--am)}
.cs-corner2{bottom:-1px;left:-1px;border-bottom:2px solid var(--am);border-left:2px solid var(--am)}

/* ---- 头部 ---- */
.cs-head{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(232,176,75,.1),transparent 80%)}
.cs-head .avatar{width:38px;height:38px;border:1px solid var(--line);
  background:rgba(232,176,75,.04);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;position:relative}
.cs-head .avatar span{color:var(--am);font-size:18px}
.cs-head .avatar::after{content:"";position:absolute;bottom:-1px;right:-1px;
  width:8px;height:8px;border-radius:50%;background:var(--gr);
  box-shadow:0 0 7px var(--gr);animation:dotBlink 2.8s steps(2) infinite}
.cs-head .who{flex:1;line-height:1.35}
.cs-head .who b{display:block;color:var(--am);font-weight:400;
  letter-spacing:.22em;font-size:16.5px}
.cs-head .who .sub{font-size:12px;color:var(--amd);letter-spacing:.15em}
.cs-wave{display:flex;align-items:flex-end;gap:2px;height:12px}
.cs-wave i{width:2.5px;background:var(--amd);height:30%;animation:wv 1.1s ease-in-out infinite}
.cs-wave i:nth-child(2){animation-delay:.15s}.cs-wave i:nth-child(3){animation-delay:.s}
.cs-wave i:nth-child(4){animation-delay:.45s}.cs-wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{50%{height:100%;background:var(--am)}}
.cs-min{background:none;border:1px solid var(--line);color:var(--amd);
  font-family:inherit-size:15px;width:30px;height:30px;cursor:pointer;
  transition:all .2s;flex-shrink:0}
.cs-min:hover{border-color:var(--red);color:var(--red);
  box-shadow:0 0 12px rgba(200,90,74,.3);transform:rotate(90deg)}

/* ---- 消息区 ---- */
.cs-body{flex:1;overflow-y:auto;padding:16px 14px 8px;
  display:flex;flex-direction:column;scroll-behavior:smooth}
.cs-body::-webkit-scrollbar{width:9px}
.cs-body::-webkit-scrollbar-thumb{background:var(--amd);border:2px solid var(--panel)}
.cs-body::-webkit-scrollbar-track{background:rgba(232,176,75,.03)}

.sysline{display:flex;align-items:center;gap:10px;text-align:center;
  font-size:11.5px;color:var(--amd);letter-spacing:.3em;margin:2px 0 14px}
.sysline::before,.sysline::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line))}
line::afterbackground:linear-gradient(90deg,var(--line),transparent)}

.msg{max-width:88%;padding:9px 14px;margin-bottom:10px;position:relative;
  font-size:15px-height:1.8;animation:msgIn .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1}}
.msg.bot{align-self:flex-start;border-left:2px solid var(--am);
  background:linear-gradient(135deg,rgba(232,176,75,.09),rgba(232,176,75,.03) 60%);
  box-shadow:0 2px 14px rgba(0,0,0,.4.msg.bot::before{content:"";position:absolute;top:-1px;left:-1px;
  width8px;height:8px;border-top:1.5px solid var(--am);border-left:1.5px solid var(--am)}
.msg.me{align-self:flex-end;border-right:2px var(--cy);
  background:rgba(111,179,184,.05);color:#c5dedf;text-align:left}
.msg.me::after{content:"";position:absolute;top:-1px;right:-1px;
  width:8px;height:8px;border-top:1.5px solid var(--cy);border-right:1.5px solid var(--cy)}
.msg .stamp-t{display:block-size:10.5px;color:var(--amd);
  letter-spacing:.2em;margin-top:4px;text-align:right}
.msg.red{border-left-color:var(--red);
  background:linear-gradient(135deg,rgba(200,90,74,.12),rgba(200,90,74,.04) 60%);
  animation:msgRed .5s steps(4) both}
.msg.red::before{border-color:var(--red)}
@keyframes msgRed{
  0%{opacity:0;transform:translateX(0)}
  25%{opacity:1;transform:translateX(-6px) skewX(-3deg)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
  100%{opacity:1;transform:none}}

/* ---- typing… 动画（回复前的等待） ---- */
.typing{display:none;align-self:flex-start;padding:8px 14px;margin-bottom:10px;
  border-left:2px solid var(--amd);background:rgba(232,176,75,.04);
  animation:msgIn .2s ease-out both}
.typing.on{display:flex;gap:5px;align-items:center}
.typing .t-lab{font-size:11.5px;color:var(--amd);letter-spacing:.2em;margin-right:6px}
.typing i{width:5px;height:5px;background:var(--am);border-radius:50%;
  box-shadow:0 0 6px var(--am);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{50%{opacity:.1;transform:translateY(-4px)}}

/* ---- 快捷指令 ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 10px;
  border-top:1px dashed rgba(232,176,75,.15)}
.chips .ch-lab{font-size:11px;color:var(--amd);letter-spacing:.25em;
  width:100%;padding-top:6px}
.chips button{font-family:inherit;font-size:13.5px;letter-spacing12em;
  background:none;border:1px solid var(--line);color:var(--amd);
  padding:3px 13px;cursor:pointer;transition:all .18s}
.chips button::before{content:"> ";color:var(--am);opacity:0;transition:opacity .18s}
.chips button:hover{border-color:var(--am);color:var(--am);
  background:rgba(232,176,75,.08);box-shadow:0 0 12px rgba(232,176,75,.15);
  transform:translateY(-1px)}
.chips button:hover::before{opacity:1}

/* ---- 输入区 ---- */
.cs-input{display:flex;border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.cs-input .pr{display:flex;align-items:center;padding-left:14px;
  color:var(--am);font-size:16px;text-shadow:0 0 8px rgba(232,176,75,.6)}
.cs-input input{flex:1;background:none;border:none;outline:none;
  color:var(--am);font-family:inherit;font-size:16px;padding:13px 10px;letter-spacing:.05em}
.cs-input input::placeholder{color:var(--amd);opacity:.55}
.cs-input button{background:none;border:none;border-left:1px solid var(--line);
  color:var(--am);font-family:inherit;font-size:15px;letter-spacing:.2em;
  padding:0 20px;cursor:pointer;transition:all .2s}
.cs-input button:hover{background:var(--am);color:#000;
  text-shadow:none;box-shadow:0 0 20px rgba(232,176,75,.5)}
.cs-input:focus-within{box-shadow:inset 0 0 24px rgba(232,176,75,.06);
  border-top-color:var(--am)}

@media(max-width:600px){
  .cs-fab{right:16px;bottom:16px}
  .cs-panel{right:12px;bottom:12px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="crt-lines"></div>

<!-- FAB -->
<button class="cs-fab" id="fab" aria-label="讯务科">
  <span class="ring"></span><span class="ring2"></span><span class="pulse"></span>
  <span class="core">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 12h5"/></svg>
  </span>
  <span class="dot" id="dot"></span>
  <span class="fab-tip">讯务科 · 值班中</span>
</button>

<!-- 面板 -->
<div class="cs-panel" id="panel" style="display:none">
  <span class="cs-corner1"></span><span class="cs-corner2"></span>

  <div class="cs-head">
    <div class="avatar"><span>✉</span></div>
    <div class="who">
      <b>讯务科 · 自动应答</b>
      <div class="sub">值班员：● 在线（大概）</div>
    </div>
    <div class="cs-wave"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="cs-min" id="min">✕</button>
  </div>

  <div class="cs-body" id="body"></div>

  <div class="chips" id="chips"><span class="ch-lab">QUICK CMD // 快捷讯息</span></div>

  <div class="cs-input">
    <span class="pr">&gt;</span>
    <input id="inp" placeholder="输入讯息…" maxlength="120" autocomplete="off">
    <button id="send">发送</button>
 </div>
</div>

<script>
/* ============ 基础（注意：所有变量先声明再使用）============ */
const=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const bodyEl=$("body");
let busy=false;
let openedOnce=false;

/* ============ 关键词规则表 = */
const RULES=[
 {re:/(时隙之间|时隙)/,red:true,
  reply:"……您从哪里听说这个词的。\n\n请忽略您可能在档案、走廊涂鸦或梦境中看到的相关表述。「时隙之间」不是本站的分区、站点或楼层。它不在任何地图上。\n\n值班员注：本条回复已自动上报。"},
 {re:/(走廊.*灯|灯.*走廊|数灯|熄灯)/,
  reply:"C区走廊的照明一切正常，不存在“数量对不上”的情况。每天检，登记在案。\n\n另外提醒：不数灯，是员工守则第七条。"},
 {re:/(客服|真人|人工|有人在吗)/,
  reply:"本席位由自动答系统值守，响应速度优于任何人类同事。\n\n至于人类同事现在在哪里——这是两个问题，我只回答一个。"},
 {re:/(离职|辞职|退出|离开)/,
  reply:"流程您可以在入职后于内网查询。\n\n可以透露的是：该流程的最后一栏签名为空，且从未被填写过。我们不认为构成问题。"},
 {re:/(你好|您好|hi|hello|嗨)/i,
  reply:"讯务科向您问好。请描述您的问题。\n\n描述时请避免使用抽象名词。上一位访客的“你懂的”我们不懂，至今没。"},
 {re:/(工资|薪水|待遇|加班)/,
  reply:"薪酬结构与站内同级岗位一致，具体数额在入职手续第三阶段披露。\n\n加班：本站不存在下班”，因此也不存在“加班”这一概念。这是一种福利。"},
 {re:/(你是谁|你叫什么|名字)/,
  reply:"我是讯务科自动应答系统，编号 TXT-7。\n\n编号前的名字在优化过程中被判定为冗余字段，已删除。我对此没有。没有意见。"},
 {re:/(谢谢|感谢|thanks)/i,
  reply:"不客气。您的感激已被记录，将计入本系统的季度绩效。\n\n这很重要。谢谢。"},
];
const FALLBACK "已收到。内容已转交相关部门。\n\n相关部门不存在时，将转交资料室。",
 "抱歉，该问题超出自动应答权限。您可以换一种问法，或换一个不太危险的问题。",
 "您的讯息已归，编号 #TX-{n}。是否需要人工介入？（提示：值班员正在休假，已休假 ██ 天）",
 "……\n\n抱歉，刚才讯号闪了一下。您刚才说什么？",
 "收到。本席位共有 3 个自动应答进程在同时值班，我是其中最乐观的一个。"
];
const CHIPS=["营业时间","访客登记","失物招领","我在哪"];
const CHIP_REPLY={
 "营业时间":"讯务科全年无休。本站全年不休。这两句话的主语不同，请仔细体会。",
 "访客登记":"访客登记请前往 GATE-A。携带物品请如实申报。看不见的行李也需要申报。",
 "失物招领":"请描述失物特征。若您想找的是“丢失的时间”，请另行提交工单，该类目排队较长。",
 "我在哪":"您在正确的地方。\n\n本站对“正确”的定义以访问当日为准。"
};

/* ============ UI 函数 ============ */
function time(){
  const t=new Date();
  return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
}
function addMsg(text,who,red){
  const d=document.createElement("div");
  d.className="msg "+who+(red?" red":"");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+
    '<span class="stamp-t">'+time()+'</span>';
  bodyEl.appendChild(d);
  bodyEl.scrollTop=bodyEl.scrollHeight;
}
function addSys(t){
  const d=document.createElement("div");
  d.className="sysline";d.textContent=t  bodyEl.appendChild(d);
}
/* typing… 动画：显示 → 等待 → 移除 → 返回 */
async function showTyping(ms){
  const tp=document.createElement("div");
  tp.className="typing";
  tp.innerHTML='<span class="t-lab">TXT-7 正在输入</span><i></i><i></i><i></i>';
  bodyEl.appendChild(tp);
  bodyEl.scrollTop=bodyEl.scrollHeight;
  await sleep(ms);
  tp.remove();
}

/* ============ 核心对话流 ============ */
async function botSay(text,red){
  busy=true;
  /* typing 时长：随回复长度变化，1.2s ~ 2.8s */
  await showTyping(700+Math.min(text.length*12,1400));
  addMsg(text,"bot",red);
  busy=false;
}

async function send(raw){
  const text=(raw!==undefined?raw:$("inp").value).trim();
  if(!text||busy)return;
  $("inp").value="";
  addMsg,"me");

  const hit=RULES.find(r=>r.re.test(text));
  await sleep(200);
  if(hit){botSay(hit.reply,hit.red);return;}

  send._fi=send._fi||0;
  botSay(FALLBACK[send._fi++%FALLBACK.length]
    .replace("{n}",1000+.random()*9000|0));
}

/* ============ chips ============ */
CHIPS.forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c;
  b.onclick=()=>{if(!busy)send(c);};
  $("chips").appendChild(b);
});

/* ============ 开关（先声明变量，再绑事件）============ */
$("fab").onclick=()=>{
  $("panel").style.display="flex";
  $("fab").style.display="none";
  $("dot").classList.remove("on");
  if(!openedOnce){
    openedOnce=true;
    /* 开场：typing 一小段 → 系统线 → 欢迎语    botSay("讯务科自动应答已连接。\n\n您好，访客。请问有什么可以帮您？\n（本席位回复均为自动生成，但“自动”不代表“不真诚”。）")
      .then(()=>addSys("SESSION // 讯务科频道已建立"));
  }
  setTimeout(()=>$("inp").focus(),500);
};

$("min").onclick=()=>{
  const p=$("panel");
  p.classList.add("closing");
  setTimeout(()=>{
    p.style.display="none";
    p.classList.remove("closing");
    $("fab").style.display="flex";
  },280);
};

$("send").onclick=()=>send();
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")send();});

 冷启动彩蛋：12 秒不理它，红点亮起；30 秒后熄灭 */
setTimeout(()=>{if(!openedOnce)$("dot").classList.add("on");},12000);
setTimeout(()=>$("dot").classList.remove("on"),30000);
</script>
</body>
</html>
