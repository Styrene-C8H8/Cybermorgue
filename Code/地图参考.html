<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACILITY MAP // 12 区划</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --am:#e8b04b; --amd:#8a6a2f; --amf:rgba(232,176,75,.07);
  --gr:#7fbf7f; --red:#c85a4a;
  --bg:#0c0a06; --panel:#121008; --line:rgba(232,176,75,.25); --txt:#d8cdb4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);
  font-family:'VT323','Noto Sans SC',monospace;font-size:17px;line-height:1.9;
  min-height:100vh;text-shadow:-.4px 0 rgba(255,50,90,.10),.4px 0 rgba(0,205,255,.10)}
::selection{background:var(--am);color:#000}
.crt-lines{position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px)}
.crt-vig{position:fixed;inset:0;z-index:901;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%)}

.wrap{max-width:1060px;margin:0 auto;padding:56px 22px 110px}
.pagehead{text-align:center;margin-bottom:30px}
.pagehead .en{color:var(--amd);font-size:13.5px;letter-spacing:.5em}
.pagehead h1{font-size:clamp(30px,5vw,46px);color:var(--am);margin-top:6px;
  letter-spacing:.15em;text-shadow:0 0 22px rgba(232,176,75,.4)}

/* ============ 地图台座（3D） ============ */
.stage{perspective:1400px}
.map3d{
  position:relative;border:1px solid var(--line);
  background:
    repeating-linear-gradient(to right,transparent 0 39px,rgba(232,176,75,.05) 39px 40px),
    repeating-linear-gradient(to bottom,transparent 0 39px,rgba(232,176,75,.05) 39px 40px),
    radial-gradient(ellipse at center,#141008 0%,#0e0b06 70%);
  box-shadow:0 40px 80px -30px rgba(232,176,75,.25),inset 0 0 80px rgba(0,0,0,.7);
  transform-style:preserve-3d;
  aspect-ratio:16/10;min-height:480px}
.map3d .corner{position:absolute;width:18px;height:18px;z-index:20;pointer-events:none}
.corner.tl{top:-1px;left:-1px;border-top:2px solid var(--am);border-left:2px solid var(--am)}
.corner.tr{top:-1px;right:-1px;border-top:2px solid var(--am);border-right:2px solid var(--am)}
.corner.bl{bottom:-1;left:-1px;border-bottom:2px solid var(--am);border-left:2px solid var(--am)}
.corner.br{:-1px;right:-1px;border-bottom:2px solid var(--am);border-right:2px solid var(--am)}

 ---- 区块 ---- */
.zone{position:absolute;border:1px rgba(138,106,47,.55);
  background:rgba(232,176,75,.04);cursor:pointer;transition:all .2s}
.zone:hover,.zone.hot{border-color:varam);background:rgba(232,176,75,.13);
  box-shadow:0 0 24px rgba(232,,75,.35),inset 0 0 20px rgba(232,176,75,.12)}
.zone .zcode{position:absolute;top:50%;left:50%;transform:translate(-%,-50%);
  color:var(--amd);font-size26px;letter-spacing:.15em;transition:all .2}
.zone:hover .zcode{color:var(--am);text-shadow:0 0 12px rgba(232,176,75,.7)}
.zone.locked{border-style:dashed;border-color:rgba(200,90,74,.45)}
.zone.locked:hover,.zone.locked.hot{border-color:var(--red);
  background:rgba(20090,74,.08);box-shadow:0 0 22px rgba(200,90,74,.3)}
.zone.locked .zcode{color:var(--red)}

/* 引导 + 标签 */
.leader{position:absolute;height:1px;pointer-events:none;z-index:6;
  background:linear-gradient(90deg,var(--am),transparent);opacity:.6}
.zlabelposition:absolute;color:var(--am);font-size:14px;letter-spacing:.18em;
  pointer-events:none;white-space:nowrap;z-index:7;line-height:1.6;
  text:0 0 8px rgba(232,176,755)}
.zlabel small{display:block;font-size:10.px;color:var(--amd);letter-spacing:.28em}

/* ---- 雷达（右上） ---- */
.radar{position:absolute:14px;right:14px;width:92px;height:92px;z-index:10;
  border-radius:50%;border:px solid var(--line);
  background:radial-gradient(circle,rgba(232,176,75,.03) 0 60%,rgba(127,191,127,.06));
  overflow:hidden;box-shadow:inset 0 0 14px rgba(0,0,0,.7)}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(138,106,47,.35)}
.radar::before{left:50%;top:0bottom:0;width:1px}
.radar::aftertop:50%;left:0;right:0;height:1px}
.ring1{position:absolute;inset:28%;border1px solid rgba(138,106,47,.3);border:50%}
.ring2{position:absolute;inset:42%;border:1px solid rgba(138,106,473);border-radius:50%}
.sweep{position:absolute;set:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(232,176,75,.45transparent 70deg,transparent 360deg);
  animation:sweepA 3.2s linear infinite}
@keyframes sweepAto{transform:rotate(360deg)}}
.blip{position;width:5px;height:5px;border-radius:50%;:var(--red);
  box-shadow:0 0 8 var(--red);animation:blipA 3.2s infinite}
@keyframes blipA{0%,12%{opacity0}16%,80%{opacity:1}100%{opacity:0}}
.radar-tag{position:absolute;top:108px;right:14px;z-index:10;text-align:center;
  width:92px;color:var(--amd);font-size:10.px;letter-spacing:.35em}

/* ---- 罗盘（下） ---- */
.compass{position:absolute;bottom:14px;left:14px;width:76px;height:76px;z-index:10;
  border-radius:50%;border:1px solid varline);
  display:flex;align-items:center;justify-content:center  background:radial-gradient(circle,rgba(232,176,,.04),transparent 70%);
  box-shadow:inset  0 12px rgba(0,0,0,.7)}
.compass-ring{position:absolute;inset:-6px;border1px dashed rgba(138,106,47,.3);
  border-radius:50%;animation:spinC 24s linear infinite@keyframes spinC{to{transform:rotate(360deg}
.needle{width:2px;height:50px;position:relative;transition:transform .4s cubic-bezier(.3,.4,.4,1)}
.needle::before,.needle::after{content:"";position:absolute;left:-4px;
  border-left:5px solid transparent;border-right:5px solid transparent}
.needle::before{top:0;border-bottom:22px solid var(--am);filter:drop-shadow(0 0 5px rgba(232,176,75,.8))}
.needle::after{bottom:0;border-top:22px solid var(--red)}
.cdirposition:absolute;font-size:11px;color:var(--amd)}
.cdir.n{top:2px;left:50%;transform:translate(-50%);color:var(--am)}
.cdir.s{:2px;left:50%;transform:translateX(-50%)}
.cdir.w{left:6px;top:50%;transformtranslateY(-50%)}
.cdir.e{right:6;top:50%;transform:translateY(-50%)}

/* ----例 / 坐标 ---- */
.legend{position:absolute;top:px;left:14px;z-index:10;font-size:11.px;
  letter-spacing:.2em;color:var(--amd);line-height:2.1}
.legend i{display:inline-block;width10px;height:10px;margin-right:6px;vertical-align1px}
.lg-a{background:rgba(232,176,75,.15);border:1px solid var(--am)}
.lg-b{background:rgba(200,90,74,.1);border:1px dashed var(--red)}
.lg-c{background:rgba(127,191,127,.12);border:1px solid var(--gr)}
.coordbox{position:absolute;bottom:14px;right:14px;text-align:right;z-index:10;
  color:var(--amd);font-size:125px;letter-spacing:.2em;line-height:1.}
.coordbox b{color:var(--am);font-weight400}

/* ---- 描述面板 ---- */
.descbar{
  margin:16px;border:1px solid var(--line);backgroundvar(--panel);
  padding:12px 20px;min:96px;display:flex;gap:22px;align-items-start;
  position:relative;overflow:hidden}
.descbar::before{:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--amd);transition: .2s}
.descbar.on::before{background:varam)}
.db-name{color:var(--am);font-size:px;letter-spacing:.12em;white-space:nowrap;min-width:170px}
.db-name small{display:block;color:varamd);font-size:11.5px;letter-spacing:.em}
.db-text{font-size:15px;line-height:2;flex:1}
.db-text em{font-style:normal;color:var(--am)}
.db-warn{color:var(--red);font-size:13.5px;letter-spacing:.1em}
.descbar.idle .db-text{color:var(--amd)}
@keyframes descIn{from{opacity:0;transform:translate(6px)}to{opacity:1;transform:none}}
bar.on .db-name,.descbar.on .db-text{animationdescIn .3s ease both}
</style>
</head>
<body<div class="crt-lines"></div><div class="c-vig"></div>

<div class="wrap">
  <div classpagehead">
    <p class="en">FACILITY SCMATIC · CM-SITE</p>
    <h1> 点 十 二 区 划</h1>
  </div>

  <div class="stage">
    <div class="map3d" id="map">
      <i class="corner tl"></i><i="corner tr"></i>
      <i class="corner bl"></i><i class="corner br"></i>

      <!-- 雷达 -->
      <div class="radar">
        <i class="1"></i><i class="ring2"></i>
        <div class="sweep"></div>
        <span class="bl" style="top:30%;left:62%"></span        <span class="blip" style="top:64%;left:36%;animation-duration:1.9s"></span>
      </div>
      <div class="radar-tag">RADAR</div      <!-- 罗盘 -->
      <div class="compass">
 <div class="compass-ring"></div>
        <div class="needle" id="needle"></div>
        <span class="c n">N</span><span class="cdir s">S</span        <span class="cdir w">W</span><span="cdir e">E</span>
      </div>

      <!--例 -->
      <div class="legend">
        <div><i="lg-a"></i>开放区域</div>
        <div> class="lg-b"></i>封锁区域</div>
        ><i class="lg-c"></i>活跃信号</div>
      </div>

      <!-- 坐标读数 -->
      <div class="coordbox" id="coord">CURSOR &gt; <b>000 : 000</b><br>SITE-CM · 12</div>
    </div>
  </div>

 <div class="descbar idle" id="descbar">
    <div class="db-name" id="dbName">—<small>STANDBY</small></div>
    <div class="db-text" id="dbText">将指针移至任意区块以读取区域档案。封锁区域的描述可能不完整。</div>
  </div>
</div>

<script>
/* ============ 数据：pos = [x%, y%, 宽%, 高%]，lead = 标签拉向 left/right ============ */
var ZONES=[
 {id:"A",name:"A区 · 主厅",sub:"MAIN HALL",pos:[34,3815,26],lead:"left",
  desc:"接待登记处所有访客在此领取通行牌。<em>通行牌回收率：97%</em>。"},
 {id:"B",name:"B区 · 办公翼",sub:"OFFICE WINGpos:[51,34,16,22],lead:"right",
  desc:"行政办公区。夜间照明按节能模式关闭——总有几层<em>自己亮着</em>。"},
 {id:"C",name:"C区 · 东侧走廊",sub:" CORRIDOR",pos:[69,38,13,18],:true,
  desc:"[数据已编辑]。<span classdb-warn'>⚠ 排班表上无任何人员被至此。请勿途经。</span>"},
 {id:"D",:"D区 · 中庭",sub:"ATRIUM",pos33,66,13,22],lead:"left",
  desc:"露天中庭，种植着不知名的常绿植物。<em>它们在冬天也不落叶。</em>"},
 {id:"E",name:"E区 · 食堂",sub:"CANTEEN",:[48,64,13,18],lead:"left",
 desc:"供应三餐。周五炖菜使用 OAM 工地周边采购的原料。<em>欢迎品尝。</em>"},
 {:"F",name:"F区 · 机房",sub:" ROOM",pos:[63,60,13,16],lead:"",
  desc:"站点主服务器所在。恒温 18℃。散热声在夜里听起来像<em>某种呼吸</em>。"},
 {:"G",name:"G区 · 档案室",:"ARCHIVE",pos:[15,58,15,20],lead:"left",
  desc:"本页面所属部门。纸质与数字轨管理。<em>有些柜子没有钥匙孔。</em> {id:"H",name:"H区 · 医务室sub:"INFIRMARY",pos:[15,34,14,18],lead:"left",
  desc:"常规医务。值班医生■■■。<em>挂号记录比员工名册多。>"},
 {id:"J",name:"J区 · 观测塔",sub:"WATCH TOWER",pos:[31,20,,14],lead:"right",
  desc:"全站最高点。视野良好，可俯瞰兆回廊。<em>望远镜总是朝向同一个方向。</em>"},
 {id:"K",:"K区 · 地下车库",sub:"UNDERGROUND",:[84,66,12,20],lead:"right",
 :"车辆维护与仓储。B2 层以下照明<em暂缓修复</em>。"},
 {id:"L",name:"区 · 温室",sub:"GREENHOUSE",pos:[713,13,14],lead:"right",
  desc:"植物区。湿度常年偏高。<em>玻璃上总蒙着一层擦不掉的雾。</em>"},
 {id:"M",nameM区 · 封存库",sub:"SEALED VAULT",pos:[86,42,9,15],lock:true,
  desc:"[权限不足]。<span class='db-warn'>⚠一次开启时间：[数据缺失]</span>"}
];

/* = 渲染区块 + 引导线 + 标签 ============ */
(function(){
  var map=document.getElementById("map");
  ZONES.forEach(z,i){
    /* 区块 */
    var el=document.createElement("");
    el.className="zone"+(z.lock?" locked":"");
 el.style.left=z.pos[0]+"%";
    el.style.top=z.pos[1]+"%";
    el.style.width=z.pos[2]+"%";
    el.style.height=z.pos[3]+"%";
    el.innerHTML='<span="zcode">'+z.id+'</span>';
    el.addEventListener("mouseenter",function(){hot(i,true)});
    el.addEventListener("mouseleave",(){hot(i,false)});
    map.appendChild(el);

    /* 引导线：从区块边缘水平拉出 */
    var lead=document.createElementi");
    lead.className="leader";
    if(z.lead==="left"){
      var len=z.pos[0]-3;
      lead.left="3%";
      lead.style.top=(z.pos[1z.pos[3]/2)+"%";
      lead.style.width=len+"    }else{
      var len2=97-(z.pos0]+z.pos[2]);
      lead.style.left=(z.pos0]+z.pos[2])+"%";
      lead.style.top=(z.pos[1]+z.pos[3]/2)+"%";
     .style.width=len2+"%";
    }
    map.appendChild(lead);

 /* 标签 */
    var lab=document.createElement("div");
 lab.className="zlabel";
    lab.innerHTML=z.name+"<small>"+z.sub+"</small>";
    if(z.lead==="left"){
      lab.style.right=(100-z.pos[0]+1)+"%";
      lab.style.top=(z.pos[1]+z.pos[3]/2-14)+"%";
    }else{
      lab.style.left=(z.pos[0]+z.pos[2]+1)+"%";
      lab.style.top=(z.pos[1]+z.pos[32-14)+"%";
    }
    map.appendChild(lab);
  });
})();

/* ============ 描述面板 ============ */
function hot(i){
  document.getElementById("descbar").classList.toggle("on",on  document.getElementById("descbar").classList.toggle("idle",!);
  if(!on)return;
  var z=ZONES[i];
  document.getElementById("dbName").innerHTML=
    z.name+"<smallz.sub+" · "+(z.lock?"LOCKED":"ACTIVE")+"</small>";
  document.getElementById("dbText").innerHTML=z.desc;
}

 ============ 3D 倾斜 + 罗盘 + 标联动 ============ */
(function(){
  var m=document.getElementById("map");
  var needle=document.getElementById("needle");
  var coord=document.getElementByIdcoord");
  var raf=null;

  window.addEventListener("mousemovefunction(e){
    if(raf)return;
    raf=requestAnimationFrame(){
      var x=e.clientX/window.innerWidth-.5;   /* -.5 ~ 0.5 */
      var y=e.clientY.innerHeight-.5;
      m.style.transform="rotateY("+(x10).toFixed(2)+"deg) rotateX("+(-y*8).toFixed(2)+"deg)";
      needle.style.transform="rotate("+(x*160).toFixed(0)+"deg)";
      coord.innerHTML="SOR &gt; <b>"+
        ("00"+Math.round(e.clientX)).slice(-3)+" : "+
        ("00"+Math.round.clientY)).slice(-3)+
        "</b><br>SITEM · GRID 12";
      raf=null;
    });
 });
})();
</script>
</body>
</html>
