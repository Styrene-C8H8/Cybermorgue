<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAFF INDEX // 员工档案索引</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --am:#e8b04b; --amd:#8a6a2f; --amf:rgba(232,176,75,.07);
  --gr:#7fbf7f; --grd:#4a6b4a; --red:#c85a4a;
  --bg:#0c0a06; --panel:#121008; --line:rgba(232,176,75,.25); --txt:#d8cdb4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);
  font-family:'VT323','Noto Sans SC',monospace;font-size:17px;line-height:1.8;min-height:100vh}
::selection{background:var(--am);color:#000}

/* CRT 覆层 */
.crt-lines{position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px)}
.crt-vig{position:fixed;inset:0;z-index:901;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%)}
.crt-sweep{position:fixed;left:0;width:100%;height:90px;z-index:902;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(232,176,75,.05),transparent);
  animation:sweep 9s linear infinite}
@keyframes sweep{from{top:-15%}to{top:110%}}

/* 返回 */
.back{position:fixed;top:14px;left:14px;z-index:950;font-family:inherit;font-size:16px;
  background:var(--panel);border:1px solid var(--line);color:varamd);
  padding:5px 14px;cursor:pointer;-spacing:.1em;transition:all .2s}
.back:hover{color:var(--am);border-color:var(--am)}

.wrap{max-width:1080px;margin:0 auto;padding:80px 26px 100px}

/* 标题 */
.pagehead{text-align:center;margin-bottom:40px}
.pagehead .en{color:var(--amd);letter-spacing:.55em;font-size:15px;text-transform:uppercase}
h1{font-size:clamp(42px,7vw,84px);color:var(--am);line-height:1;margin-top:10px;
  text-shadow:0 0 22px rgba(232,176,75,.35);min-height:1em}
h1 .ch{display:inline-block;opacity:0}
h1.in .ch{opacity:1;transition:none}
.count{margin-top:12px;color:var(--grd);letter-spacing:.25em;font-size:16px}
.count b{color:var(--gr)}

/* 工具栏 */
.toolbar{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:34px}
.tb-head{display:flex;align-items:center;gap:10px;color:var(--amd);
  font-size:14px;letter-spacing:.3em;margin-bottom:12px}
.tb-head::before,.tb-head::after{content:"";flex:1;height:1px;background:var(--line)}
.searchrow{display:flex;gap:10px}
#q{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  font-family:inherit;font-size:17px;padding:9px 14px;outline:none;letter-spacing:.05em;
  transition:border-color .2s,box-shadow .2s}
#q:focus{border-color:var(--am);box-shadow:0 0 12px rgba(232,176,75,.2)}
#q::placeholder{color:var(--amd)}
.clearbtn{font-family:inherit;font-size:15px;background:none;border:1px solid var(--line);
  color:var(--amd);padding:0 16px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
.clearbtn:hover{color:var(--red);border-color:var(--red)}

.filters{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.fg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fl{font-size:14px;color:var(--amd);letter-spacing:.2em;flex:0 0 92px}
.fchip{font-family:inherit;font-size:15px;border:1px solid var(--line);
  background:transparent;color:var(--txt);padding:2px 13px;cursor:pointer;
  letter-spacing:.08em;transition:all .15s}
.fchip:hover{border-color:var(--am);color:var(--am)}
.fchip.sel{background:var(--am);color:#000;border-color:var(--am);
  box-shadow:0 0 10px rgba(232,176,75,.4);animation:flickIn .3s steps(3)}
@keyframes flickIn{0%{opacity:.2}50%{opacity:.9}75%{opacity:.5}100%{opacity:1}}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);
  padding:16px 18px 14px;cursor:pointer;color:var(--txt);font-family:inherit;
  overflow:hidden;opacity:0;transform:translateY(14px);
  transition:border-color .2s,transform .2s,box-shadow .2s}
.card.show{animation:cardIn .45s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);border-color:var(--am);
  box-shadow:0 0 0 1px var(--am),0 14px 40px -14px rgba(232,176,75,.4)}
/* 悬停扫描线 */
.card::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(232,176,75,.09),transparent);
  transition:left .55s;pointer-events:none}
.card:hover::after{left:130%}
/* 角标 */
.card::before{content:"";position:absolute;top:0;right:0;border-style:solid;
  border-width:0 14px 14px 0;border-color:transparent var(--line) transparent transparent;
  transition:border-color .2s}
.card:hover::before{border-right-color:var(--am)}

.card .no-row{display:flex;align-items:center;justify-content:space-between;
  font-size:14px;color:var(--amd);letter-spacing:.15em;margin-bottom:6px}
.cldot{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:7px;vertical-align:0;box-shadow:0 0 6px currentColor}
.cl-yellow{background:#eab308;color:#eab308}
.cl-white{background:#e5e7eb;color:#e5e7eb}
.cl-red{background:#dc2626;color:#dc2626}
.cl-black{background:#17181c;color:#555;box-shadow:0 0 0 1px #444}
.cl-rainbow{background:linear-gradient(90deg,#ff5f5f,#ffb15f,#e6d76f,#7fce6f,#5fb4ff,#a06fff);
  background-size:300% 100%;color:transparent;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:300% 50%}}

.card b{display:block;font-family:'Noto Sans SC',sans-serif;font-weight:500;
  font-size:21px;color:var(--am);letter-spacing:.12em}
.card i{font-style:normal;font-size:15px;color:var(--txt);opacity:.75}
.card .t{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card .t em{font-style:normal;font-size:13.5px;border:1px solid var(--line);
  color:var(--amd);padding:1px 10px;letter-spacing:.08em}
.card .t em:first-child{border-color:var(--amd);color:var(--am)}
.card:hover b{text-shadow:0 0 12px rgba(232,176,75,.6)}

.empty{grid-column:1/-1;text-align:center;color:var(--amd);padding:60px 0;
  letter-spacing:.3em;font-size:18px}

.errbox{max-width:520px;margin:60px auto;text-align:center;color:var(--red);
  border:1px solid rgba(200,90,74,.4);padding:24px;letter-spacing:.1em;line-height:2}

@media(max-width:700px){
  .fl{flex-basis:100%}
  .wrap{padding-top:70px}
}
</style>
</head>
<body>

<div class="crt-lines"></div><div class="crt-vig"></div><div class="crt-sweep"></div>

<button class="back" onclick="goBack()">&lt;&lt; BACK</button>

<div class="wrap">
  <div class="pagehead">
    <p class="en">Personnel File Archive · Restricted</p>
    <h1 id="title">STAFF INDEX</h1>
    <p class="count">RECORDS LOADED : <b id="count">--</b></p>
  </div>

  <div class="toolbar">
    <div class="tb-head">QUERY TERMINAL</div>
    <div class="searchrow">
      <input id="q" type="text" placeholder="&gt; 输入检索关键词…（别名 / 姓名 / 工号 / 部门）" oninput="apply()">
      <button class="clearbtn" onclick="resetAll()">RESET</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">ESTABLISHING UPLINK…</div>
  </div>
</div>

<script>
/* ============ 配置 ============ */
var OC_FILES = ["./DyeOxide.data.json","./Kameron.data.json","./Valentina.data.json",
 "./Nyxstr.data.json","./ZakeVacuma.data.json","./TatyanaCrimson.data.json",
 "./MarcusVacarcel.data.json","./BellerophusDessner.data.json","./HowarSterling.data.json",
 "./rofayeColotis.data.json"];
var CL_ORDER = ["white","yellow","red","black","rainbow"]; /* 权限排序用，可选 */

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var OCS = [];
var st = { q:"", gender:"", zone:"", department:"" };

/* ============ 标题解码动画 ============ */
(function(){
  var h1=$("title"), txt=h1.textContent, chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/\\<>_";
  h1.textContent="";
  for(var i=0;i<txt.length;i++){
    var s=document.createElement("span");
    s.className="ch"; s.textContent=txt[i]===" "?"\u00A0":txt[i];
    s.style.transitionDelay=(i*45)+"ms";
    h1.appendChild(s);
  }
  requestAnimationFrame(function(){ h1.classList.add("in"); });
  /* 扫码乱转效果 */
  var spans=h1.querySelectorAll(".ch"), done=false;
  var iv=setInterval(function(){
    if(done){ clearInterval(iv); return; }
    spans.forEach(function(s,i){
      if(i < Math.floor(performance.now()/45)) return;
      if(Math.random()<.6) s.textContent=chars[Math.floor(Math.random()*chars.length)];
    });
  },60);
  setTimeout(function(){
    done=true;
    spans.forEach(function(s,i){
      setTimeout(function(){ s.textContent=txt[i];i*45);
    });
  },600);
})();

/* ============ 加载数据 ============ */
function load(){
  Promise.all(OC_FILES.map(function(f){
    return fetch(f).then(function(r){
      if(!r.ok) throw new Error(f+" -> HTTP "+r.status);
      return r.json();
    }).then(function(d){
      return {
        name:d.indexName||d.name,
        alias:d.indexAlias||d.alias||"",
        fileNo:d.indexNo||d.fileNo||"",
        clearance:d.clearance||"yellow",
        realName:d.name||"", realAlias:d.alias||"",
        gender:(d.tags&&d.tags.gender)||"",
        zone:(d.tags&&d.tags.zone)||"",
        department:(d.tags&&d.tags.department)||"",
        faction:d.faction||"",
        path:"project/OC/"+f.replace(/^\.\//,"").replace(/\.data\.json$/,".html"),
        pathRel:f.replace(/^\.\//,"").replace(/\.data\.json$/,".html")
      };
    });
  })).then(function(list){
    OCS=list;
    $("count").textContent=String(OCS.length).padStart(3,"0");
    buildFilters();
    apply();
  }).catch(function(e){
    $("grid").innerHTML='<div class="errbox">// ARCHIVE UPLINK FAILED<br>'+esc(e.message)+
      '<br><span style="color:var(--amd)">提示：本页需要通过本地服务器打开（fetch 无法在 file:// 下读取 json）。</span></div>';
  });
}

/* ============ 筛选器 ============ */
function uniq(k){ var seen={},out=[]; OCS.forEach(function(o){
  var v=o[k]; if(v && !seen[v]){seen[v]=1;out.push(v);} }); return out; }
function group(label,key,vals){
  return '<div class="fg"><span class="fl">'+label+'</span>'
    +'<button class="fchip sel" data-k="'+key+'" data-v="">ALL</button>'
    + vals.map(function(v){return '<button class="fchip" data-k="'+key+'" data-v="'+esc(v)+'">'+esc(v)+'</button>';}).join("")
    +'</div>';
}
function buildFilters(){
  $("filters").innerHTML =
    group("GENDER / 性别","gender",uniq("gender"))+
    group("ZONE / 区域","zone",uniq("zone"))+
    group("DEPT / 部门","department",uniq("department"));
  document.querySelectorAll(".fchip").forEach(function(b){
    b.addEventListener("click",function(){
      var k=b.dataset.k,v=b.dataset.v;
      st[k]=(st[k]===v)?"":v;
      document.querySelectorAll('.fchip[data-k="'+k+'"]').forEach(function(c){
        c.classList.toggle("sel",c.dataset.v===st[k]);
      });
      apply();
    });
  });
}

/* ============ 渲染 ============ */
function apply(){
  var q=$("q").value.trim().toLowerCase();
  var list=OCS.filter(function(o){
    return (!st.gender||o.gender===st.gender)
      && (!st.zone||o.zone===st.zone)
      && (!st.department||o.department===st.department)
      && (!q || [o.name,o.alias,o.fileNo,o.realName,o.realAlias,o.faction].join(" ").toLowerCase().indexOf(q)>-1);
  });
  $("count").textContent=String(list.length).padStart(3,"0")+" / "+String(OCS.length).padStart(3,"0");
  var g=$("grid"); g.innerHTML="";
  if(!list.length){
    g.innerHTML='<div class="empty">// NO MATCHING RECORD //</div>'; return;
  }
  list.forEach(function(o,i){
    var el=document.createElement("button");
    el.className="card";
    el.style.animationDelay=(i*45)+"ms";
    el.innerHTML=
      '<div class="no-row"><span><i class="cldot cl-'+esc(o.clearance)+'"></i>'+esc(o.fileNo)+'</span>'+
      '<span style="color:var(--grd)">FILE_'+String(i+1).padStart(2,"0")+'</span></div>'+
      '<b>'+esc(o.name)+'</b>'+
      (o.alias?'<i>'+esc(o.alias)+'</i>':'')+
      '<div class="t">'+[o.gender,o.zone,o.department].filter(Boolean).map(function(t){
        return '<em>'+esc(t)+'</em>'; }).join("")+'</div>';
    el.addEventListener("click",function(){ openFile(o.path,o.pathRel); });
    g.appendChild(el);
  });
}

function resetAll(){
  st={q:"",gender:"",zone:"",department:""};
  $("q").value="";
  document.querySelectorAll(".fchip").forEach(function(c){
    c.classList.toggle("sel",c.dataset.v==="");
  });
  apply();
}

/* ============ 导航（保留 spherse 兼容） ============ */
function openFile(p,pr){
  if(typeof spherse!=="undefined"&&spherse.openFile) spherse.openFile(p);
  else location.href=pr||p;
}
function goBack(){
  try{ sessionStorage.setItem("cm-goto","staff"); }catch(e){}
  if(typeof spherse!=="undefined"&&spherse.openFile)
    spherse.openFile("project/Cybermorgue-档案主页.html");
  else location.href="../Cybermorgue-档案主页.html";
}
if(typeof spherse!=="undefined"&&spherse.events){
  OC_FILES.forEach(function(f){ spherse.events.on("file:update",{path:f},load); });
}

load();
</script>
</body>
</html>
