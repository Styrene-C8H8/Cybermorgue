<body>
<div class="clbar"></div>
<button class="back" onclick="goBack()">← 返回</button>
<div class="wrap">
  <div class="pagehead">
    <h1>专有名词库</h1>
    <span class="sub">Glossary</span>
    <span class="count" id="count"></span>
  </div>
  <div class="dlayout">
    <nav class="dnav" id="dnav"></nav>
    <main class="dcontent" id="dcontent">加载中…</main>
  </div>
</div>
<script>
const DATA = "./专有名词库.data.json";
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

async function render() {
  const d = await fetch(DATA).then(r => r.json());
  const groups = {};
  d.terms.forEach(t => {
    const L = (t.p || "A").toUpperCase().charAt(0);
    (groups[L] = groups[L] || []).push(t);
  });
  document.getElementById("count").textContent = `${d.terms.length} 词条`;
  document.getElementById("dnav").innerHTML = LETTERS.map(L =>
    groups[L] ? `<button onclick="jump('L-${L}')">${L}</button>` : `<span class="dim">${L}</span>`
  ).join("");
  document.getElementById("dcontent").innerHTML = LETTERS.filter(L => groups[L]).map(L => `
    <div class="dgroup" id="L-${L}">
      <div class="dletter">${L}</div>
      ${groups[L].map(t => `<div class="dterm"><b>${esc(t.term)}</b><p>${esc(t.def)}</p></div>`).join("")}
    </div>`).join("");
  window.scrollTo(0, 0);
}
function jump(id) { document.getElementById(id).scrollIntoView({ behavior: "smooth" }); }
function goBack() {
  if (typeof spherse !== "undefined" && spherse.openFile) spherse.openFile("project/员工手册.html");
  else location.href = "员工手册.html";
}
if (typeof spherse !== "undefined" && spherse.events) {
  spherse.events.on("file:update", { path: DATA }, () => render());
}
function initAnim(){try{document.querySelectorAll(".dnav,.dlist,.dhead").forEach(s=>{if(!s.classList.contains("rv"))s.classList.add("rv");});const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.06});document.querySelectorAll(".rv").forEach(el=>io.observe(el));}catch(err){document.querySelectorAll(".rv").forEach(el=>el.classList.add("in"));}}
render().then(initAnim).catch(e => { document.getElementById("dcontent").innerHTML = "加载失败：" + e.message; });
</script>
<script>
(function () {
  var css = `body::before{content:none}
body::after{content:'';background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");opacity:.045;animation:none}
body{text-shadow:none}
h1,.ftitle,.ttitle,.splash-title,.greet{text-shadow:none}
.ftitle::after,h1::after{content:none!important}
.step-next,.submit,.entry.manual,.path:hover,.more:hover{box-shadow:none}
.card:hover,.entry:hover,.path:hover,.ocline:hover,.more:hover,.fchip:hover,.zone-link:hover,.chip:hover{text-shadow:none!important}`;
  var st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);
  if (document.getElementById("page-main")) return;
  if (!window.matchMedia || matchMedia("(hover: none)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sel = ".card,.entry,.path,.thread,.rec,.sysdlg,.attach,.mailcard,.recipe,.video,.music-ui,.mbtn,.rec-toggle,.email-btn,.linkbtn,.mnav button,.arc-item,.fchip,.zone-link,.chip,.more,.step-next,.step-back,.back";
  var w = document.createElement("div"); w.className = "cc";
  w.innerHTML = '<i class="cc-dot"></i><i class="cc-c cc-tl"></i><i class="cc-c cc-tr"></i><i class="cc-c cc-br"></i><i class="cc-c cc-bl"></i>';
  document.body.appendChild(w);
  var dot = w.querySelector(".cc-dot"), cs = Array.from(w.querySelectorAll(".cc-c"));
  var free = [[-15,-15],[6,-15],[6,6],[-15,6]];
  var mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, locked = null;
  document.body.classList.add("has-cc");
  function frame() {
    cx += (mx - cx) * .2; cy += (my - cy) * .2;
    dot.style.left = cx + "px"; dot.style.top = cy + "px";
    if (clickT >= 0) {
      var p = (performance.now() - clickT) / 380;
      if (p >= 1) {
        clickT = -1;
        cs.forEach(function (c) { c.style.transition = ""; });
      } else {
        var ang = p * Math.PI * 2;
        var cos = Math.cos(ang), sin = Math.sin(ang);
        var cr = locked ? locked.getBoundingClientRect() : null;
        /* 轨道圆心 = 四角的视觉中心（准星自身中心），绕它转才不偏心 */
        var cxs, cys;
        if (cr) { cxs = (cr.left + cr.right) / 2; cys = (cr.top + cr.bottom) / 2; }
        else { cxs = cx - 4.5; cys = cy - 4.5; }
        cs.forEach(function (c, i) {
          var ox, oy;
          if (cr) {
            var cps = [[cr.left - 1, cr.top - 1], [cr.right - 7, cr.top - 1], [cr.right - 7, cr.bottom - 7], [cr.left - 1, cr.bottom - 7]];
            ox = cps[i][0] - cxs; oy = cps[i][1] - cys;
          } else { ox = free[i][0] + 4.5; oy = free[i][1] + 4.5; }
          c.style.left = (cxs + ox * cos - oy * sin) + "px";
          c.style.top = (cys + ox * sin + oy * cos) + "px";
        });
      }
    }
    if (clickT < 0 && !locked) { cs.forEach(function (c, i) { c.style.left = (cx + free[i][0]) + "px"; c.style.top = (cy + free[i][1]) + "px"; }); }
    requestAnimationFrame(frame);
  }
  function lock(t) {
    if (t === locked) return;
    locked = t; w.classList.add("locked");
    var r = t.getBoundingClientRect();
    var p = [[r.left - 1, r.top - 1], [r.right - 7, r.top - 1], [r.right - 7, r.bottom - 7], [r.left - 1, r.bottom - 7]];
    cs.forEach(function (c, i) { c.style.left = p[i][0] + "px"; c.style.top = p[i][1] + "px"; });
  }
  function unlock(t) { if (t && t === locked) { locked = null; w.classList.remove("locked"); } }
  addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
  var clickT = -1;
  addEventListener("mousedown", function () { w.classList.add("cc-press"); w.classList.add("cc-click"); clickT = performance.now(); cs.forEach(function (c) { c.style.transition = "none"; }); });
  addEventListener("mouseup", function () { w.classList.remove("cc-press"); setTimeout(function () { w.classList.remove("cc-click"); }, 380); });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(sel); if (t) lock(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(sel); unlock(t); });
  requestAnimationFrame(frame);
})();
</script>
</body>
