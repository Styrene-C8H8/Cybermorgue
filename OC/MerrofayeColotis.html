<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merrofaye Colotis · 员工档案</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=LXGW+WenKai:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/oc-base.css">
<style>
:root{
  --am:#e8b04b; --amd:#8a6a2f; --amf:rgba(232,176,75,.07);
  --gr:#7fbf7f; --grd:#4a6b4a; --red:#c85a4a; --cy:#6fb3b8;
  --bg:#0c0a06; --panel:#121008; --line:rgba(232,176,75,.25); --txt:#d8cdb4;
  --shell1:#1a1509; --shell2:#241d0e; --shell3:#100d07;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);
  font-family:'VT323','Noto Sans SC',monospace;font-size:17px;line-height:1.9;
  min-height:100vh}
::selection{background:var(--am);color:#000}

.crt-lines{position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px)}
.crt-vig{position:fixed;inset:0;z-index:901;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%)}
body{text-shadow:-0.4px 0 rgba(255,50,90,.10),0.4px 0 rgba(0,205,255,.10)}

.clbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:950}
.cl-yellow{background:linear-gradient(90deg,#8a6a2f,#eab308,#8a6a2f)}
.cl-white{background:linear-gradient(90deg,#555,#eee,#555)}
.cl-red{background:linear-gradient(90deg,#5a1f16,#dc2626,#8a1f16);animation:pul 2s infinite}
.cl-black{background:linear-gradient(90deg,#000,#333,#000)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.55}}

.back{position:fixed;top:14px;left:24px;z-index:960;font-family:inherit;font-size:16px;
  background:var(--panel);border:1px solid var(--line);color:var(--amd);
  padding:4px 14px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
.back:hover{color:var(--am);border-color:var(--am)}

.wrap{max-width:900px;margin:0 auto;padding:64px 26px 130px;
  animation:pageIn .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.fhead{border:1px solid var(--line);background:
  repeating-linear-gradient(45deg,var(--panel) 0 14px,rgba(232,176,75,.02) 14px 28px);
  padding:20px 24px;margin-bottom:22px;position:relative;overflow:hidden}
.fhead::after{content:"CLASSIFIED";position:absolute;top:34px;right:-58px;
  transform:rotate(35deg);color:rgba(200,90,74,.5);font-size:22px;
  letter-spacing:.5em;border-top:2px solid rgba(200,90,74,.5);
  border-bottom:2px solid rgba(200,90,74,.5);padding:2px 40px;pointer-events:none}
.fmeta{display:flex;gap:22px;flex-wrap:wrap;font-size:14.5px;color:var(--amd);
  letter-spacing:.18em;border-bottom:1px dashed var(--line);padding-bottom:12px}
.fmeta b{color:var(--txt);font-weight:400}
.cldot{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:6px;box-shadow:0 0 7px currentColor;vertical-align:1px}
.cl-dot-y{background:#eab308;color:#eab308}

h1{font-family:'VT323','Noto Sans SC',monospace;font-size:clamp(46px,8vw,88px);
  color:var(--am);line-height:1;margin-top:16px;
  text-shadow:0 0 26px rgba(232,176,75,.4);min-height:1em;letter-spacing:.03em}
h1 .ch{display:inline-block;opacity:0}
.alias{color:var(--amd);letter-spacing:.3em;margin-top:8px;font-size:17px}
.ftags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.ftag{font-size:14px;border:1px solid var(--line);color:var(--amd);
  padding:1px 12px;letter-spacing:.15em}
.ftag:first-child{color:var(--am);border-color:var(--amd)}

.idcard-wrap{display:flex;justify-content:center;margin-bottom:30px}
.idcard{width:min(580px,100%);background:linear-gradient(155deg,#181307,#100d08 60%,#14100a);
  border:1px solid var(--line);position:relative;padding:22px 26px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 50px -18px rgba(232,176,75,.35);
  transition:transform .3s,box-shadow .3s}
.idcard:hover{transform:rotate(-.6deg) translateY(-3px);
  box-shadow:0 0 0 1px var(--am),0 24px 60px -18px rgba(232,176,75,.5)}
.idcard::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,var(--amd) 0 12px,transparent 12px 24px);
  opacity:.55}
.hole{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:56px;height:11px;background:var(--bg);border-radius:6px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.9),inset 0 -1px 0 rgba(232,176,75,.15)}
.ic-head{display:flex;justify-content:space-between;align-items:center;
  color:var(--amd);font-size:13.5px;letter-spacing:.3em;margin-top:14px;
  border-bottom:1px dashed var(--line);padding-bottom:8px}
.ic-body{display:flex;gap:20px;margin-top:14px;align-items:center}
.ic-left{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ic-photo{flex:0 0 150px;height:200px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--amd);font-size:13px;letter-spacing:.2em;line-height:2.2;
  background:var(--bg);overflow:hidden;position:relative}
.ic-photo img{width:100%;height:100%;object-fit:cover}
.ic-photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(232,176,75,.09) 50%,transparent 60%)}
.ic-info{flex:1;min-width:0}
.ic-row{display:flex;gap:10px;font-size:16px;padding:3.5px 0;
  border-bottom:1px dotted rgba(232,176,75,.13)}
.ic-row:last-child{border-bottom:none}
.ic-row .k{flex:0 0 118px;color:var(--amd);letter-spacing:.1em}
.ic-row .v{color:var(--txt);word-break:break-word}
.barcode{margin-top:0;display:flex;align-items:flex-end;gap:1.5px;height:24px;
  justify-content:center;opacity:.75}
.barcode i{background:var(--txt);display:block;width:2px}
.bcno{text-align:center;color:var(--amd);font-size:11px;letter-spacing:.25em;margin-top:2px}

.panel{border:1px solid var(--line);background:var(--panel);margin-bottom:22px;
  position:relative;opacity:0;transform:translateY(18px);
  transition:opacity .55s ease,transform .55s ease}
.panel.in{opacity:1;transform:none}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--am);border-left:2px solid var(--am)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--am);border-right:2px solid var(--am)}
.p-head{display:flex;justify-content:space-between;align-items:center;
  padding:8px 18px;border-bottom:1px dashed var(--line);
  color:var(--am);font-size:19px;letter-spacing:.3em}
.p-head small{font-family:'VT323',monospace;color:var(--amd);font-size:13px;letter-spacing:.2em}
.p-body{padding:16px 22px}

.item{padding:10px 0;border-bottom:1px dotted rgba(232,176,75,.12)}
.item:last-child{border-bottom:none}
.ilabel{color:var(--am);font-size:15px;letter-spacing:.25em;margin-bottom:2px}
.ilabel::before{content:"> ";color:var(--amd)}
.itext p{margin-bottom:8px}
.itext p:last-child{margin-bottom:0}

.rednote{color:var(--red);border-bottom:1px dashed rgba(200,90,74,.6)}
.spoiler{background:#221b10;color:transparent;cursor:help;padding:0 4px;
  border:1px solid rgba(138,106,47,.4);user-select:none;transition:all .18s}
.spoiler:hover{color:var(--am);background:var(--amf);user-select:auto}

.thread{border:1px solid var(--line);background:var(--bg);margin-bottom:18px}
.t-head{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--amf)}
.t-board{display:inline-block;font-size:13px;color:#000;background:var(--am);
  padding:0 10px;letter-spacing:.2em;margin-bottom:6px}
.t-title{color:var(--am);font-size:19px;letter-spacing:.05em}
.post{padding:12px 18px;border-bottom:1px dashed rgba(232,176,75,.14);position:relative;
  margin-left:calc(var(--d)*30px)}
.post:last-child{border-bottom:none}
.post[data-d]:not([data-d="0"])::before{content:"";position:absolute;left:-16px;top:0;
  bottom:0;width:1px;background:rgba(232,176,75,.3)}
.post[data-d]:not([data-d="0"])::after{content:"└";position:absolute;left:-22px;top:8px;
  color:var(--amd);font-size:14px}
.p-head2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.uname{color:var(--am);letter-spacing:.06em}
.lvtag{font-size:12px;border:1px solid var(--line);color:var(--amd);
  padding:0 7px;letter-spacing:.1em}
.lvtag.op{color:#000;background:var(--am);border-color:var(--am)}
.lvtag.custom{color:var(--cy);border-color:var(--cy)}
.pmeta{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--grd);white-space:nowrap}
.ipx{color:var(--cy)}
.p-body2{margin-top:4px;font-size:16px}
.expand{padding:8px 18px;font-size:14px;color:var(--amd);cursor:pointer;
  border-bottom:1px dashed rgba(232,176,75,.14);letter-spacing:.1em;
  margin-left:calc(var(--d)*30px)}
.expand:hover{color:var(--am)}
.sysdel{padding:8px 18px;text-align:center;color:rgba(200,90,74,.7);
  font-size:14px;letter-spacing:.15em;border-bottom:1px dashed rgba(232,176,75,.14)}

/* ===== 录音（单击展开） ===== */
.rec{border:1px solid rgba(232,176,75,.18);margin:14px 0;background:rgba(232,176,75,.02)}
.rec.playing{border-color:var(--am)}
.rec-head{padding:8px 14px;font-size:14px;letter-spacing:.15em;color:var(--txt);
  background:rgba(200,90,74,.08);border-bottom:1px solid rgba(232,176,75,.18);
  display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#3a2c12;transition:all .2s;flex-shrink:0}
.rec.playing .rec-dot{background:var(--red);box-shadow:0 0 8px var(--red);animation:recB 1s infinite}
@keyframes recB{50%{opacity:.15}}
.rec-dur{margin-left:auto;color:var(--amd);letter-spacing:.1em}
.eqbars{display:none;gap:2px;align-items:flex-end;height:12px}
.rec.playing .eqbars{display:flex}
.eqbars i{width:3px;background:var(--am);height:20%}
.rec.playing .eqbars i{animation:eq .5s ease-in-out infinite alternate}
@keyframes eq{from{height:15%}to{height:100%}}
.rec-body{padding:10px 14px;display:none}
.rec.open .rec-body{display:block}
.rline{font-family:"Courier New",Consolas,"Noto Sans SC",monospace;
  font-size:14.5px;line-height:2.1;padding:2px 0;
  opacity:0;transform:translateX(-8px)}
.rline.in{opacity:1;transform:none;transition:all .35s ease}
.fx{color:var(--gr);font-size:13px;letter-spacing:.05em}

/* ===== 随身听（参考 随身听.html 外观） ===== */
.walkman{
  width:min(720px,100%);margin:6px auto 0;
  background:linear-gradient(160deg,var(--shell2),var(--shell1) 45%,var(--shell3));
  border:1px solid var(--line);border-radius:18px;
  box-shadow:inset 0 1px 0 rgba(232,176,75,.18),inset 0 -3px 12px rgba(0,0,0,.7),
    0 0 0 1px rgba(0,0,0,.6),0 26px 70px -18px rgba(232,176,75,.28),0 4px 14px rgba(0,0,0,.8);
  padding:26px 30px 30px;position:relative;transition:transform .25s}
.walkman:hover{transform:translateY(-3px)}
.walkman::before{content:"";position:absolute;top:10px;left:36px;right:36px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(232,176,75,.35),transparent)}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding:0 4px}
.brand .logo{color:var(--am);font-size:23px;letter-spacing:.35em;text-shadow:0 0 12px rgba(232,176,75,.45)}
.brand .logo small{display:block;font-size:11.5px;color:var(--amd);letter-spacing:.55em;margin-top:-4px}
.brand .model{color:var(--amd);font-size:13.5px;letter-spacing:.3em;text-align:right;line-height:1.9}
.brand .model b{color:var(--gr);font-weight:400}
.batt{display:inline-flex;gap:3px;margin-left:4px}
.batt i{width:7px;height:11px;background:var(--gr);box-shadow:0 0 6px var(--gr);animation:pulB 2.4s infinite}
.batt i:nth-child(2){animation-delay:.4s}
.batt i:nth-child(3){animation-delay:.8s}
@keyframes pulB{0%,100%{opacity:1}50%{opacity:.4}}
.deck{border-radius:10px;background:
  radial-gradient(ellipse at 50% 120%,rgba(232,176,75,.06),transparent 60%),
  repeating-linear-gradient(90deg,#0a0805 0 3px,#0e0b07 3px 6px);
  border:1px solid rgba(232,176,75,.3);
  box-shadow:inset 0 0 26px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.04);
  padding:14px 20px 10px;position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;top:0;left:-30%;width:45%;height:200%;
  background:linear-gradient(105deg,transparent,rgba(232,176,75,.05) 45%,rgba(255,255,255,.03) 50%,transparent);
  transform:rotate(4deg);pointer-events:none}
.deck-label{display:flex;justify-content:space-between;color:var(--amd);
  font-size:12.5px;letter-spacing:.3em;margin-bottom:10px}
.deck-label i{font-style:normal;color:var(--red);animation:pul 1s infinite}
.cassette{background:linear-gradient(170deg,#191308,#110e08);
  border:1px solid rgba(232,176,75,.35);border-radius:6px;padding:12px 16px 10px;
  box-shadow:0 6px 18px rgba(0,0,0,.7),inset 0 1px 0 rgba(232,176,75,.15)}
.cas-label{background:linear-gradient(180deg,#201808,#171106);
  border:1px dashed rgba(138,106,47,.6);padding:6px 14px;text-align:center;position:relative}
.cas-label .tname{color:var(--am);font-size:16px;letter-spacing:.12em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cas-label .tsub{color:var(--amd);font-size:11.5px;letter-spacing:.35em}
.reels{display:flex;align-items:center;gap:0;margin-top:8px;padding:0 6%}
.hub{width:58px;height:58px;border-radius:50%;flex-shrink:0;position:relative;
  border:2px solid rgba(232,176,75,.4);
  background:radial-gradient(circle,#0a0805 34%,#14100a 35%);box-shadow:inset 0 0 10px #000}
.hub i{position:absolute;inset:10px;border-radius:50%;
  background:conic-gradient(var(--amd) 0 20%,transparent 20% 33%,var(--amd) 33% 53%,transparent 53% 66%,var(--amd) 66% 86%,transparent 86%);opacity:.9}
.walkman.playing .hub i{animation:spin 1.9s linear infinite}
.hub.r i{animation-duration:1.9s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tape-line{flex:1;height:40px;position:relative;margin:0 -6px}
.tape-line::before{content:"";position:absolute;top:50%;left:0;right:0;height:9px;transform:translateY(-50%);
  background:linear-gradient(180deg,#2b2110,#3d3018 50%,#221a0c);
  border-top:1px solid rgba(232,176,75,.25);border-bottom:1px solid rgba(0,0,0,.8)}
.counter{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:8px;
  color:var(--amd);font-size:12.5px;letter-spacing:.25em}
.cnt-window{background:#050402;border:1px solid rgba(232,176,75,.3);
  padding:2px 16px;color:var(--am);font-size:18px;letter-spacing:.35em;
  box-shadow:inset 0 0 8px rgba(0,0,0,.9);min-width:96px;text-align:center}
.vurow{display:flex;gap:20px;margin-top:18px;align-items:center;flex-wrap:wrap}
.vu{flex:0 0 170px;background:#0a0804;border:1px solid var(--line);border-radius:6px;
  padding:10px 12px 6px;box-shadow:inset 0 0 14px rgba(0,0,0,.85)}
.vu-scale{position:relative;height:52px;border-bottom:1px solid rgba(232,176,75,.2);
  background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(138,106,47,.12) 20px 21px)}
.vu-needle{position:absolute;left:50%;bottom:4px;width:2px;height:34px;margin-left:-1px;
  background:var(--am);box-shadow:0 0 6px rgba(232,176,75,.8);
  transform-origin:50% 100%;transform:rotate(-42deg);transition:transform .1s linear}
.vu-lamp{display:flex;justify-content:center;gap:6px;margin-top:6px}
.vu-lamp i{width:8px;height:8px;border-radius:50%;background:#241d0e;box-shadow:inset 0 0 3px #000}
.vu-lamp.vu-lit1 i:nth-child(-n+3){background:var(--gr);box-shadow:0 0 8px var(--gr)}
.vu-lamp.vu-lit2 i:nth-child(-n+5){background:var(--am);box-shadow:0 0 8px var(--am)}
.vu-lamp.vu-lit3 i:nth-child(n+6){background:var(--red)!important;box-shadow:0 0 10px var(--red)!important}
.vu-lamp.vu-lit3 i:nth-child(-n+5){background:var(--am);box-shadow:0 0 8px var(--am)}
.vu-name{text-align:center;color:var(--amd);font-size:11.5px;letter-spacing:.4em;margin-top:4px}
.nowplay{flex:1;min-width:220px;padding-bottom:6px}
.np-en{color:var(--amd);font-size:12.5px;letter-spacing:.4em}
.np-title{color:var(--am);font-size:23px;letter-spacing:.08em;margin-top:2px;
  min-height:1.4em;text-shadow:0 0 14px rgba(232,176,75,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{color:var(--amd);font-size:14px;letter-spacing:.25em}
.np-time{margin-top:8px;font-size:14px;color:var(--txt);letter-spacing:.12em}
.np-time b{color:var(--gr);font-weight:400}
.np-trackbar{height:7px;background:#050402;border:1px solid rgba(232,176,75,.25);
  margin-top:6px;cursor:pointer;position:relative}
.np-fill{position:absolute;inset:0;right:auto;width:0;
  background:linear-gradient(90deg,var(--amd),var(--am));
  box-shadow:0 0 9px rgba(232,176,75,.5)}
.eqmini{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:10px}
.eqmini i{width:5px;background:var(--am);height:12%;opacity:.75}
.walkman.playing .eqmini i{animation:eqB .6s ease-in-out infinite alternate}
@keyframes eqB{from{height:10%}to{height:95%}}
.keys{display:flex;gap:12px;margin-top:20px;justify-content:center}
.key{flex:1;max-width:108px;padding:11px 0 9px;text-align:center;
  font-family:inherit;font-size:14px;letter-spacing:.18em;color:var(--txt);cursor:pointer;
  background:linear-gradient(180deg,var(--shell2),var(--shell3));
  border:1px solid rgba(232,176,75,.3);border-radius:6px;
  box-shadow:0 4px 0 rgba(0,0,0,.65),inset 0 1px 0 rgba(232,176,75,.2);
  position:relative;transition:all .1s;user-select:none}
.key small{display:block;font-size:10.5px;color:var(--amd);letter-spacing:.25em;margin-top:1px}
.key:hover{border-color:var(--am);color:var(--am)}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.65)}
.key.on{color:#000;background:linear-gradient(180deg,var(--am),#c9922f);
  border-color:var(--am);box-shadow:0 3px 0 #6e5420,inset 0 1px 0 rgba(255,255,255,.35),0 0 18px rgba(232,176,75,.45)}
.key.on small{color:#000000aa}
.bottomrow{display:flex;align-items:center;gap:26px;margin-top:20px;flex-wrap:wrap}
.volwheel-wrap{display:flex;align-items:center;gap:14px}
.volwheel-wrap .lbl{color:var(--amd);font-size:12.5px;letter-spacing:.3em;
  writing-mode:vertical-rl;transform:rotate(180deg);line-height:1}
.wheelbox{width:44px;height:120px;background:var(--shell3);border:1px solid var(--line);
  border-radius:8px;box-shadow:inset 0 0 10px rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.volwheel{width:20px;height:96px;border-radius:10px;
  background:repeating-linear-gradient(to bottom,var(--am) 0 2px,#7a5c26 2px 5px);
  cursor:ns-resize;touch-action:none;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 12px rgba(232,176,75,.3)}
.vol-ticks{position:absolute;right:4px;top:8px;bottom:8px;width:8px;
  background:repeating-linear-gradient(to bottom,rgba(138,106,47,.5) 0 1px,transparent 1px 10px)}
.vol-readout{color:var(--am);font-size:17px;min-width:50px;text-align:center}
.jacks{margin-left:auto;display:flex;gap:18px;align-items:center}
.jack{text-align:center}
.jack .hole{width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#2b2110 0 30%,#000 62%);
  border:2px solid rgba(232,176,75,.35);
  box-shadow:inset 0 0 8px #000,0 1px 0 rgba(232,176,75,.15);margin:0 auto}
.jack span{display:block;color:var(--amd);font-size:11.5px;letter-spacing:.25em;margin-top:4px}

footer{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;
  color:var(--amd);font-size:14px;white-space:pre-wrap;text-align:center;letter-spacing:.1em}

.errbox{max-width:520px;margin:80px auto;text-align:center;color:var(--red);

function sp(t){return esc(t)

var WM={a:null,on:false,t:0,dur:0,vol:.7};
function initWalkman(){
  document.getElementById("casName").textContent=D.music.title;
  document.getElementById("casSub").textContent="TYPE I NORMAL · SIDE A";
  document.getElementById("npTitle").textContent=D.music.title;
  document.getElementById("npArtist").textContent="CYBERMORGUE RECORDS";
  var eq=document.getElementById("eqMini");
  for(var i=0;i<10;i++){
    var b=document.createElement("i");
    b.style.animationDelay=(Math.random()*.55)+"s";
    b.style.animationDuration=(.45+Math.random()*.4)+"s";
    eq.appendChild(b);
  }
  WM.a=new Audio();
  WM.a.preload="auto";
  WM.a.src=D.music.src;
  WM.a.volume=WM.vol;
  WM.a.addEventListener("loadedmetadata",function(){WM.dur=WM.a.duration||0;wmPaint();});
  WM.a.addEventListener("timeupdate",function(){WM.t=WM.a.currentTime;wmPaint();});
  WM.a.addEventListener("waiting",function(){var t=document.getElementById("npTime");if(t)t.textContent="缓冲中…";});
  WM.a.addEventListener("playing",function(){WM.on=true;document.getElementById("wm").classList.add("playing");document.getElementById("kPlay").classList.add("on");document.getElementById("kPlay").innerHTML="■<small>PLAY</small>";});
  WM.a.addEventListener("pause",function(){WM.on=false;document.getElementById("wm").classList.remove("playing");document.getElementById("kPlay").classList.remove("on");document.getElementById("kPlay").innerHTML="▶<small>PLAY</small>";});
  WM.a.addEventListener("ended",function(){WM.a.currentTime=0;WM.a.pause();WM.t=0;wmPaint();});
  wmPaint();
}
function wmToggle(){
  if(!WM.a)return;
  if(WM.a.paused){var p=WM.a.play();if(p&&p.catch)p.catch(function(){});}
  else WM.a.pause();
}
function wmStop(){ if(WM.a){WM.a.pause();WM.a.currentTime=0;WM.t=0;wmPaint();} }
function wmRew(){ if(WM.a)WM.a.currentTime=Math.max(0,WM.a.currentTime-5); }
function wmFf(){ if(WM.a)WM.a.currentTime=Math.min((WM.dur||9999)-.2,WM.a.currentTime+5); }
function wmNext(){ if(WM.a){WM.a.currentTime=0;wmToggle();} }
function wmSeek(e){
  if(!WM.a||!WM.dur)return;
  var w=e.currentTarget.getBoundingClientRect();
  WM.a.currentTime=(e.clientX-w.left)/w.width*WM.dur;
}
function wmPaint(){
  var d=WM.dur||0;
  var fill=document.getElementById("npFill"); if(fill)fill.style.width=(d?(WM.t/d*100):0)+"%";
  var tm=document.getElementById("npTime"); if(tm)tm.textContent=fmtT(WM.t)+" / "+fmtT(WM.dur);
  var cur=document.getElementById("npCur"); if(cur)cur.textContent=fmtT(WM.t);
  var cnt=document.getElementById("cntWin"); if(cnt)cnt.textContent=String(Math.floor(WM.t)).padStart(3,"0");
  vuTick();
}
function fmtT(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
/* VU 指针 + 灯组 */
var needleAngle=-42;
function vuTick(){
  var level = WM.on ? (Math.sin(Date.now()/140)*.5+.5) : 0;
  needleAngle += ((-42+level*84)-needleAngle)*.3;
  var nd=document.getElementById("needle");
  if(nd)nd.style.transform="rotate("+needleAngle.toFixed(1)+"deg)";
  var lamp=document.getElementById("vuL");
  if(lamp){
    var lit=WM.on?Math.max(0,Math.min(8,Math.round(level*8))):0;
    lamp.className="vu-lamp"+(lit>=3?" vu-lit1":"")+(lit>=5?" vu-lit2":"")+(lit>=7?" vu-lit3":"");
  }
}
setInterval(vuTick,120);
/* 音量滚轮（拖动） */
(function(){
  var wheel=document.getElementById("volWheel"),drag=false,startY=0,startV=0;
  function apply(v){
    v=Math.max(0,Math.min(1,v));
    WM.vol=v; if(WM.a)WM.a.volume=v;
    var pct=Math.round(v*100);
    document.getElementById("volNum").textContent=pct+"%";
    wheel.style.transform="rotate("+((v-.5)*40)+"deg)";
  }
  wheel.addEventListener("mousedown",function(e){drag=true;startY=e.clientY;startV=WM.vol;e.preventDefault();});
  window.addEventListener("mousemove",function(e){if(drag)apply(startV-(e.clientY-startY)/260);});
  window.addEventListener("mouseup",function(){drag=false;});
  wheel.addEventListener("touchstart",function(e){drag=true;startY=e.touches[0].clientY;startV=WM.vol;},{passive:true});
  window.addEventListener("touchmove",function(e){if(drag)apply(startV-(e.touches[0].clientY-startY)/260);},{passive:true});
  window.addEventListener("touchend",function(){drag=false;});
  apply(.7);
})();

function recsHtml(recs){

        var fx = /【(杂音|脚步声|关门声|笑声|沉默|吸气声|叹气声|一段时间之后)/.test(txt);
        if(fx)return '<div class="rline"><span class="fx">'+esc(txt)+'</span></div>';
        return '<div class="rline">'+sp(txt)+'</div>';
      }).join("")+'</div></div>';
  }).join("");
}
function toggleRec(head){
  var rec=head.parentElement;
  var open=rec.classList.toggle("open");
  rec.classList.toggle("playing",open);
  if(open){
    var lines=rec.querySelectorAll(".rline");
    lines.forEach(function(l,i){setTimeout(function(){l.classList.add("in");},i*380);});
  }
}

/* ===== 动画 ===== */
function decodeName(){
  var h=document.getElementById("bigname");
  if(!h)return;
  var txt=h.textContent,chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/*-+_";
  h.textContent="";
  var spans=[];
  for(var i=0;i<txt.length;i++){
    var s=document.createElement("span");s.className="ch";
    s.style.transitionDelay=(i*40)+"ms";
    s.textContent=txt[i]===" "?"\u00A0":txt[i];
    h.appendChild(s);spans.push(s);
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    spans.forEach(function(s){s.style.opacity=1;s.style.transition="opacity .3s";});
  });});
  var iv=setInterval(function(){
    var prog=Math.floor(performance.now()/40)-2;
    var all=true;
    spans.forEach(function(s,i){
      if(i>=prog)return;
      if(Math.random()<.25&&s.dataset.locked!="1"){s.textContent=chars[Math.floor(Math.random()*chars.length)];all=false;}
      else{s.dataset.locked="1";s.textContent=txt[i];}
    });
    if(all&&prog>txt.length){clearInterval(iv);
      spans.forEach(function(s,i){s.textContent=txt[i];});}
  },50);
}
function revealPanels(){
  var els=document.querySelectorAll(".panel");
  if(!("IntersectionObserver" in window)){
    els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});
  },{threshold:.05});
  els.forEach(function(e){io.observe(e);});
}

/* ============ 导航 ============ */
function goBack(){
  if(typeof spherse!=="undefined"&&spherse.openFile)spherse.openFile("project/OC/索引.html");
  else location.href="索引.html";
}
if(typeof spherse!=="undefined"&&spherse.events)
  spherse.events.on("file:update",{path:DATA},function(){location.reload();});

/* ============ 瞄准光标 ============ */
(function () {
  if (window.__CM_CURSOR__) return; /* 共享 base.js 已接管光标 */
  if (!window.matchMedia || matchMedia("(hover: none)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sel = ".back,.spoiler,.expand,.rec-head,.key,.np-trackbar,.volwheel";
  var w = document.createElement("div"); w.className = "cc";
  w.innerHTML = '<i class="cc-dot"></i><i class="cc-c cc-tl"></i><i class="cc-c cc-tr"></i><i class="cc-c cc-br"></i><i class="cc-c cc-bl"></i>';
  document.body.appendChild(w);
  var dot = w.querySelector(".cc-dot"), cs = Array.from(w.querySelectorAll(".cc-c"));
  var free = [[-15,-15],[6,-15],[6,6],[-15,6]];
  var mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, locked = null;
  document.body.classList.add("has-cc");
  function frame() {
    cx += (mx - cx) * .2; cy += (my - cy) * .2;
    dot.style.left = cx + "px"; dot.style.top = cy + "px";
    if (clickT >= 0) {
      var p = (performance.now() - clickT) / 380;
      if (p >= 1) {
        clickT = -1;
        cs.forEach(function (c) { c.style.transition = ""; });
      } else {
        var ang = p * Math.PI * 2;
        var cos = Math.cos(ang), sin = Math.sin(ang);
        var cr = locked ? locked.getBoundingClientRect() : null;
        /* 轨道圆心 = 四角的视觉中心（准星自身中心），绕它转才不偏心 */
        var cxs, cys;
        if (cr) { cxs = (cr.left + cr.right) / 2; cys = (cr.top + cr.bottom) / 2; }
        else { cxs = cx - 4.5; cys = cy - 4.5; }
        cs.forEach(function (c, i) {
          var ox, oy;
          if (cr) {
            var cps = [[cr.left - 1, cr.top - 1], [cr.right - 7, cr.top - 1], [cr.right - 7, cr.bottom - 7], [cr.left - 1, cr.bottom - 7]];
            ox = cps[i][0] - cxs; oy = cps[i][1] - cys;
          } else { ox = free[i][0] + 4.5; oy = free[i][1] + 4.5; }
          c.style.left = (cxs + ox * cos - oy * sin) + "px";
          c.style.top = (cys + ox * sin + oy * cos) + "px";
        });
      }
    }
    if (clickT < 0 && !locked) { cs.forEach(function (c, i) { c.style.left = (cx + free[i][0]) + "px"; c.style.top = (cy + free[i][1]) + "px"; }); }
    requestAnimationFrame(frame);
  }
  function lock(t) {
    if (t === locked) return;
    locked = t; w.classList.add("locked");
    var r = t.getBoundingClientRect();
    var p = [[r.left - 1, r.top - 1], [r.right - 7, r.top - 1], [r.right - 7, r.bottom - 7], [r.left - 1, r.bottom - 7]];
    cs.forEach(function (c, i) { c.style.left = p[i][0] + "px"; c.style.top = p[i][1] + "px"; });
  }
  function unlock(t) { if (t && t === locked) { locked = null; w.classList.remove("locked"); } }
  addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
  var clickT = -1;
  addEventListener("mousedown", function () { w.classList.add("cc-press"); w.classList.add("cc-click"); clickT = performance.now(); cs.forEach(function (c) { c.style.transition = "none"; }); });
  addEventListener("mouseup", function () { w.classList.remove("cc-press"); setTimeout(function () { w.classList.remove("cc-click"); }, 380); });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(sel); if (t) lock(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(sel); unlock(t); });
  requestAnimationFrame(frame);
})();
</script>
