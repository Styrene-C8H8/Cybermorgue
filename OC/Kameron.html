<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kameron Channte · 员工档案</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/oc-base.css">
<style></style>
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/base.js"></script>
<script src="../assets/oc-base.js"></script>
</head>
<body>

<div class="clbar" id="clbar"></div>
<div class="crt-lines"></div><div class="crt-vig"></div>

<button class="back" onclick="goBack()">&lt;&lt; RETURN TO INDEX</button>

<div class="wrap" id="app">
  <div class="errbox">RETRIEVING FILE…</div>
</div>

<script>
/* ============ 配置 ============ */
var DATA = "./Kameron.data.json";
var SELF_IDS = [];

function render(d){
  document.getElementById("clbar").className="clbar "+(CLMAP[d.clearance]||CLMAP.yellow);
  document.getElementById("app").innerHTML=
    fheadHtml(d)+badgeHtml(d)+sectionsHtml(d)+galleryHtml(d)+
    '<footer>'+sp(d.notes||"")+'</footer>';
  decodeName(); revealPanels();
}
fetch(DATA).then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}).then(render).catch(function(e){
  document.getElementById("app").innerHTML=
    '<div class="errbox">// FILE RETRIEVAL FAILED<br>'+esc(e.message)+
    '<br><span style="color:var(--amd)">提示：需通过本地服务器打开以读取数据。</span></div>';
});
if(typeof spherse!=="undefined"&&spherse.events)
  spherse.events.on("file:update",{path:DATA},function(){location.reload();});
</script>
</body>
</html>
