<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyxstr Campbell · 员工档案</title>
<style>
  :root {
    --bg: #f1f2e6; --fg: #36382a; --card: #fcfdf7; --card2: #e6ead7;
    --border: #cbd0b2; --primary: #6d8426; --primary-fg: #f6f7ec;
    --muted: #767a5c; --danger: #a0452c;
    --grad: linear-gradient(135deg, #949545, #5f7a26);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12150f; --fg: #e4e6d2; --card: #1c1f16; --card2: #272b1d;
      --border: #3c412f; --primary: #a8b456; --primary-fg: #13150d;
      --muted: #979c7c; --danger: #e08060;
      --grad: linear-gradient(135deg, #a8b456, #6d8a2e);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--primary) 7%, var(--bg)) 0%, var(--bg) 48%);
    color: var(--fg);
    line-height: 1.8;
    padding: 28px 20px 40px;
  }
  .wrap { max-width: 860px; margin: 0 auto; animation: pageIn .7s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  header.top { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; padding-top: 46px; }
  .back { position: fixed; top: 14px; left: 14px; z-index: 9999; font-family: inherit; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .back:hover { color: var(--primary); border-color: var(--primary); }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; }
  h1 { font-size: 28px; letter-spacing: 2px; color: var(--primary); font-weight: 800; }
  .alias { color: var(--muted); font-size: 13px; margin-top: 4px; letter-spacing: 1px; }

  /* 密级色条与圆点 */
  .clbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; }
  .cl-yellow { background: #d6b767; }
  .cl-red { background: #dc2626; }
  .cldot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 1px rgba(128,128,128,.2); }

  /* 密级悬停扭曲 */
  .clwrap { cursor: help; }
  .clwrap .clhover { display: none; }
  .clwrap:hover .clhover { display: inline; color: var(--danger); font-weight: 700; animation: glitch .3s infinite steps(2); }
  .clwrap:hover .clbase { display: none; }
  @keyframes glitch {
    0% { transform: translate(0); text-shadow: 2px 0 rgba(220,38,38,.6), -2px 0 rgba(47,214,198,.5); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); text-shadow: -2px 0 rgba(220,38,38,.6), 2px 0 rgba(47,214,198,.5); }
    75% { transform: translate(-1px, 2px); }
    100% { transform: translate(0); }
  }

  .badge { display: flex; gap: 20px; align-items: flex-start; width: fit-content; max-width: 100%; margin: 0 auto 26px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .bimg { position: relative; flex: 0 0 180px; aspect-ratio: 3/4; border: 2px dashed var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-align: center; background: color-mix(in srgb, var(--card) 60%, transparent); overflow: hidden; }
  .bimg.filled { border: 1px solid var(--border); }
  .bimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; }
  .binfo { flex: 1; min-width: 0; }
  .btitle { font-size: 11px; letter-spacing: 2px; color: var(--muted); border-bottom: 1px dashed var(--border); padding-bottom: 8px; margin-bottom: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag { font-size: 11px; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 1px 10px; }
  .tag:first-child { border-color: var(--primary); color: var(--primary); }
  .brow { display: flex; gap: 10px; padding: 5px 0; font-size: 13px; }
  .brow .bk { flex: 0 0 120px; color: var(--muted); font-size: 12px; }
  .brow .bv { flex: 1; min-width: 0; word-break: break-word; overflow-wrap: anywhere; }
  /* 平板：紧凑双栏（图左文右），图片缩小，防止内容溢出 */
  @media (max-width: 900px) {
    .badge { gap: 14px; padding: 12px; }
    .bimg { flex: 0 0 140px; }
    .brow { gap: 8px; }
    .brow .bk { flex-basis: 92px; }
  }
  /* 手机：更紧凑双栏，图片再缩小，文字行换行不溢出 */
  @media (max-width: 640px) {
    .bimg { flex: 0 0 110px; }
    .brow { gap: 6px; }
    .brow .bk { flex-basis: 78px; }
  }
  /* 极小屏幕（≤400px）才竖排，图片限宽居中 */
  @media (max-width: 400px) {
    .badge { flex-direction: column; width: 100%; }
    .bimg { flex: none; width: 100%; max-width: 180px; margin: 0 auto; }
  }

  section { margin-bottom: 26px; }
  h2 { font-size: 14px; letter-spacing: 3px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--primary), transparent); }
  .card { background: transparent; border: none; border-left: 3px solid var(--primary); border-bottom: 1px solid var(--border); border-radius: 0; padding: 14px 20px 16px; }
  .item { padding: 12px 0; }
  .ilabel { font-size: 12px; letter-spacing: 1px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
  .itext p { font-size: 13px; margin-bottom: 10px; }
  .itext p:last-child { margin-bottom: 0; }

  /* 隐藏文本（悬停正常文字 → 抖动乱码 → 替换为隐藏文字；移开逆动画还原） */
  .ghost-zone { cursor: default; }
  .gtext {
    display: inline-block; transition: color .15s;
    color: color-mix(in srgb, var(--fg) 82%, var(--danger) 18%);
    text-decoration: underline dotted;
    text-decoration-color: color-mix(in srgb, var(--danger) 50%, transparent);
    text-underline-offset: 3px;
    animation: hintGlow 3.4s ease-in-out infinite;
  }
  @keyframes hintGlow {
    0%, 100% { text-shadow: 0 0 0 transparent; }
    50% { text-shadow: 0 0 7px color-mix(in srgb, var(--danger) 26%, transparent); }
  }
  .shaking { animation: shake .12s infinite; text-shadow: 0 0 7px color-mix(in srgb, var(--danger) 55%, transparent); }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
  }

  /* 论坛 */
  .thread { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 14px; background: var(--card); }
  .thead { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
  .tboard { display: inline-block; font-size: 10px; letter-spacing: 1px; color: var(--primary-fg); background: var(--primary); border-radius: 999px; padding: 1px 10px; margin-bottom: 6px; }
  .ttitle { font-size: 14px; font-weight: 700; }
  .post { padding: 10px 16px; border-top: 1px dashed var(--border); margin-left: calc(var(--d, 0) * 26px); }
  .post.main { background: color-mix(in srgb, var(--card2) 55%, transparent); border-top: none; }
  .phead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .uname { font-weight: 700; }
  .pmeta { margin-left: auto; display: flex; gap: 10px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ip { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .pbody { margin-top: 4px; }
  .pbody p { font-size: 13px; margin-bottom: 8px; }
  .pbody p:last-child { margin-bottom: 0; }
  .expand { padding: 8px 16px; font-size: 12px; color: var(--primary); border-top: 1px dashed var(--border); margin-left: calc(var(--d, 0) * 26px); cursor: pointer; }
  .cmtbar { padding: 7px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: color-mix(in srgb, var(--card2) 40%, transparent); }
  .lv { font-size: 10px; padding: 1px 7px; border-radius: 999px; color: #fff; line-height: 1.6; }
  .lv1 { background: #9ca3af; } .lv2 { background: #4ade80; } .lv3 { background: #38bdf8; }
  .lv4 { background: #a78bfa; } .lv5 { background: #fb923c; } .lv6 { background: #f87171; }
  .lv.custom { background: linear-gradient(135deg, #14b8a6, #0d9488); color: #f0fdfa; }
  .lv.custom.adm { background: linear-gradient(135deg, #eab308, #f59e0b); color: #1c1917; }
  .sysline { padding: 8px 16px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); text-align: center; letter-spacing: 2px; }

  /* 异常区 */
  .anomaly { margin-top: 8px; padding-top: 14px; border-top: 1px dashed var(--danger); }
  .anom-body > * { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; }
  .anom-body.show > * { opacity: 1; transform: none; }
  .anom-body.show > *:nth-child(2) { transition-delay: .12s; }
  .anom-body.show > *:nth-child(3) { transition-delay: .24s; }
  .apass { opacity: 0; transform: translateY(10px); }
  .anom-body.show .apass { opacity: 1; transform: none; transition: opacity .35s ease, transform .35s ease; transition-delay: calc(var(--i, 0) * .03s); }
  .abtn {
    display: block; margin: 14px auto 4px; font-family: "Times New Roman", "Noto Serif SC", "STKaiti", serif;
    font-size: 17px; letter-spacing: 3px; color: var(--danger);
    background: none; border: 1px dashed var(--danger); border-radius: 8px; padding: 12px 30px; cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  .abtn:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--danger) 45%, transparent); }
  .abtn.after { border-style: solid; }
  .apassage { text-align: center; margin: 18px 0 4px; }
  .apass { font-family: "Times New Roman", "Noto Serif SC", "STKaiti", serif; font-size: 14px; line-height: 1.9; color: var(--danger); letter-spacing: 1px; }
  .rec { border: 1px solid var(--border); border-radius: 4px; margin-top: 16px; overflow: hidden; background: var(--card); }
  .rec-head { padding: 8px 14px; font-size: 12.5px; letter-spacing: 1px; color: var(--fg); background: color-mix(in srgb, var(--danger) 10%, var(--card2)); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .rec-dot { width: 9px; height: 9px; border-radius: 999px; background: var(--danger); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .rec-body { padding: 10px 14px; }
  .rec-line { font-family: "Courier New", "Sarasa Mono SC", "Noto Sans Mono CJK SC", ui-monospace, SFMono-Regular, Consolas, "FangSong", "STFangsong", "仿宋", monospace; font-size: 14.5px; padding: 4px 0; }
  .rec-line.sfx { color: var(--muted); letter-spacing: 1px; }
  .rec-line.creepy { font-family: "Times New Roman", "Noto Serif SC", "STKaiti", serif; color: var(--danger); font-size: 15px; letter-spacing: 1px; text-shadow: 0 0 8px color-mix(in srgb, var(--danger) 40%, transparent); }
  .err-box { margin-top: 20px; border: 1px solid var(--danger); border-radius: 4px; padding: 18px 16px; text-align: center; background: color-mix(in srgb, var(--danger) 5%, var(--card)); }
  .err-msg { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--danger); font-size: 13px; letter-spacing: 1px; }
  .reload-btn { margin-top: 14px; font-family: inherit; font-size: 13px; letter-spacing: 2px; padding: 9px 26px; border-radius: 8px; border: 1px solid var(--danger); background: transparent; color: var(--danger); cursor: pointer; transition: all .15s; }
  .reload-btn:hover { background: var(--danger); color: #fff; }

  footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); text-align: center; white-space: pre-wrap; }

  /* 异常模式：点击「你便是那个死者」后整页变色 */
  body { transition: background .6s ease, color .6s ease; }
  body.anom-mode {
    --bg: #06090b; --fg: #f2d9d9; --card: #0d0f12; --card2: #14181c;
    --border: #3a2024; --primary: #ff5a52; --primary-fg: #1a0505;
    --muted: #b08a8a; --danger: #ff3b30; --gold: #ffb020;
  }
  body.anom-mode::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
    background: radial-gradient(ellipse at 50% 15%, rgba(255, 59, 48, .12), rgba(0, 0, 0, .42) 72%);
    animation: anomVig .9s ease both;
  }
  @keyframes anomVig { from { opacity: 0; } to { opacity: 1; } }

  /* 系统提示框（正常版结尾） */
  .sysdlg { max-width: 420px; margin: 26px auto; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); font-size: 13px; }
  .sysdlg-bar { background: color-mix(in srgb, var(--primary) 12%, var(--card2)); padding: 6px 12px; font-size: 12px; letter-spacing: 1px; color: var(--muted); display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--border); }
  .sysdlg-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--primary); }
  .sysdlg-body { padding: 14px 16px 6px; }
  .sysdlg-actions { padding: 8px 12px 12px; text-align: right; }
  .sysdlg-btn { font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 6px; padding: 5px 16px; cursor: pointer; }
  .sysdlg-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* 修正版结尾气泡 */
  .bubble-end { max-width: 560px; margin: 26px auto 0; text-align: center; font-family: "Times New Roman", "Noto Serif SC", "STKaiti", serif; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 24px; }
  .be-line { font-size: 14.5px; line-height: 2.1; letter-spacing: 1px; }
  /* 字号：正文16px，标题等比放大 */
  .brow, .brow .bv, .itext p, .pbody p, .alias, .ending .el, .be-line, .rec-line, .apass { font-size: 16px; }
  h1 { font-size: 30px; }
  h2 { font-size: 16px; }
  .ilabel, .phead, .uname, .ttitle { font-size: 14px; }
  .btitle, .tboard, .lvl-badge { font-size: 13px; }
  .meta, footer, .pmeta, .tag, .expand, .cmtbar, .rec-head { font-size: 12.5px; }
  .lv { font-size: 11px; }
</style>
</head>
<body>
<div class="clbar" id="clbar"></div>
<button class="back" onclick="goBack()">← 返回</button>
<div class="wrap" id="app">加载中…</div>
<script>
const DATA = "./Nyxstr.data.json";
const ANOM = location.hash === "#anom";
const RESTORED = location.hash === "#restored";
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const hasGhost = t => /\+\+/.test(String(t ?? ""));
const stripGhost = t => String(t ?? "").replace(/\+\+[\s\S]+?\+\+/g, "");
const GARB = "▓▒░█#@%&*$?!≡0123456789ABCDEF乱码死";
function scramble(el, real, end) {
  if (el._iv) clearInterval(el._iv);
  const steps = 8, dur = 300;
  let i = 0;
  el._iv = setInterval(() => {
    i++;
    if (i >= steps) {
      clearInterval(el._iv); el._iv = null; el.textContent = real;
      if (end) end();
    } else {
      el.textContent = Array.from(real).map(c => c === " " ? " " : GARB[Math.floor(Math.random() * GARB.length)]).join("");
    }
  }, dur / steps);
}
function enterGhost(zone, g) {
  zone._h = true;
  if (!g.style.minWidth) g.style.minWidth = g.offsetWidth + "px";
  const real = zone.dataset.hidden || "";
  g.classList.add("shaking");
  g.style.fontFamily = '"Times New Roman", "Noto Serif SC", "STKaiti", serif';
  g.style.color = "var(--danger)";
  g.style.letterSpacing = "1px";
  scramble(g, real, () => g.classList.remove("shaking"));
}
function leaveGhost(zone, g) {
  zone._h = false;
  const real = zone.dataset.normal || "";
  g.classList.add("shaking");
  scramble(g, real, () => {
    g.classList.remove("shaking");
    if (zone._h) return;
    g.style.fontFamily = "";
    g.style.color = "";
    g.style.letterSpacing = "";
    g.style.minWidth = "";
  });
}
function bindGhosts() {
  document.querySelectorAll(".ghost-zone").forEach(zone => {
    const g = zone.querySelector(".gtext");
    if (!g) return;
    zone.addEventListener("mouseenter", () => enterGhost(zone, g));
    zone.addEventListener("mouseleave", () => leaveGhost(zone, g));
  });
}
function rich(t) {
  t = String(t ?? "");
  if (!ANOM) return esc(stripGhost(t)).replace(/\n/g, "<br>");
  const m = t.match(/\+\+([\s\S]+?)\+\+/);
  if (!m) return esc(t).replace(/\n/g, "<br>");
  const normal = (t.slice(0, m.index) + t.slice(m.index + m[0].length)).replace(/\n/g, "<br>");
  return `<span class="ghost-zone" data-normal="${esc(normal)}" data-hidden="${esc(m[1])}"><span class="gtext">${esc(normal)}</span></span>`;
}
function paras(t) {
  t = ANOM ? String(t ?? "") : stripGhost(t);
  return t.split(/\n{2,}/).map(p => `<p>${rich(p)}</p>`).join("");
}
const lvClass = tag => /^lv\d+$/.test(tag || "") ? `lv ${tag}` : `lv custom${tag === "管理员" ? " adm" : ""}`;
function postHtml(p) {
  if (p.expand) return `<div class="expand">${esc(p.content)} →</div>`;
  if (p.system) return `<div class="sysline">${esc(p.content)}</div>`;
  const tag = p.tag ? `<span class="${lvClass(p.tag)}">${esc(p.tag)}</span>` : "";
  return `<div class="post" style="--d:${p.depth || 0}">
    <div class="phead"><span class="uname">${esc(p.author)}</span>${tag}
      <span class="pmeta"><span class="ip">${esc(p.ip || "")}</span><span>${esc(p.time || "")}</span></span>
    </div>
    <div class="pbody">${paras(p.content)}</div>
  </div>`;
}
function threadHtml(f) {
  return `<div class="thread">
    <div class="thead"><span class="tboard">亡语之声论坛 · ${esc(f.board)}</span><div class="ttitle">${esc(f.title)}</div></div>
    ${postHtml(f.main)}
    <div class="cmtbar">评论</div>
    ${f.replies.map(postHtml).join("")}
  </div>`;
}
function anomalyHtml() {
  const a = D.anomaly;
  const passage = a.passage.map((p, i) => `<div class="apass" style="--i:${i}">${esc(p)}</div>`).join("");
  const recs = a.recordings.map(r => `
    <div class="rec">
      <div class="rec-head"><i class="rec-dot"></i>${esc(r.title)}</div>
      <div class="rec-body">${r.lines.map(l => {
        if (typeof l === "object") return `<div class="rec-line creepy">${esc(l.text)}</div>`;
        return `<div class="rec-line${l.startsWith("【") ? " sfx" : ""}">${esc(l)}</div>`;
      }).join("")}
      </div>
    </div>`).join("");
  return `
    <div class="anomaly">
      <button id="abtn" class="abtn" onclick="revealAnomaly()">${esc(a.button)}</button>
      <div id="anom-body" class="anom-body" style="display:none">
        <div class="apassage">${passage}</div>
        <div class="recs">${recs}</div>
        <div class="err-box">
          <div class="err-msg">${esc(a.error)}</div>
          <button class="reload-btn" onclick="reloadNormal()">${esc(a.reload)}</button>
        </div>
      </div>
    </div>`;
}
function revealAnomaly() {
  const b = $("abtn");
  scramble(b, D.anomaly.buttonAfter, () => b.classList.add("after"));
  document.body.classList.add("anom-mode");
  const body = $("anom-body");
  body.style.display = "block";
  requestAnimationFrame(() => body.classList.add("show"));
  b.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function toAnom() {
  location.hash = "anom";
  location.reload();
}
function reloadNormal() {
  location.hash = "restored";
  location.reload();
}

function goBack() {
  if (typeof spherse !== "undefined" && spherse.openFile) spherse.openFile("OC/索引.html");
  else location.href = "索引.html";
}
function alignPortrait() {
  const badge = document.querySelector(".badge");
  const bimg = badge && badge.querySelector(".bimg");
  if (!badge || !bimg || !bimg.querySelector("img")) return;
  if (getComputedStyle(badge).flexDirection !== "row") return;
  const br = badge.getBoundingClientRect();
  const pad = parseFloat(getComputedStyle(badge).paddingTop) || 0;
  let sex = null, dept = null;
  badge.querySelectorAll(".brow").forEach(r => {
    const t = (r.querySelector(".bk") || {}).textContent || "";
    if (!sex && t.indexOf("性别") === 0) sex = r.getBoundingClientRect();
    if (!dept && t.indexOf("所属分区") === 0) dept = r.getBoundingClientRect();
  });
  if (!sex || !dept) return;
  const gapMid = (sex.bottom + dept.top) / 2 - br.top;
  const mt = Math.max(0, gapMid - bimg.offsetHeight / 2 - pad - 10);
  bimg.style.marginTop = mt + "px";
}
window.addEventListener("resize", () => alignPortrait());
async function render() {
  const d = await fetch(DATA).then(r => r.json());
  D = d;
  const clc = ANOM ? "red" : "yellow";

  const badge = `
    <div class="badge">
      <div class="bimg${d.portrait ? " filled" : ""}">${d.portrait ? `<img src="${esc(d.portrait)}" alt="${esc(d.name)}">` : `<span>图片占位<br>待导入</span>`}</div>
      <div class="binfo">
        <div class="btitle">CYBERMORGUE · 员工工牌</div>
        <div class="tags">${(d.tags ? [d.tags.gender, d.tags.zone, d.tags.department] : []).filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        ${d.badge.map(r => `<div class="brow"><span class="bk">${esc(r.k)}</span><span class="bv">${rich(r.v)}</span></div>`).join("")}
      </div>
    </div>`;

  const sections = d.sections.map(s => {
    const items = (s.items || []).filter(i => i.text).map(i =>
      `<div class="item">${i.label ? `<div class="ilabel">${esc(i.label)}</div>` : ""}<div class="itext">${paras(i.text)}</div></div>`
    ).join("");
    const forum = (s.forum || []).map(threadHtml).join("");
    const anomaly = (ANOM && s.anomaly) ? anomalyHtml() : "";
    return (items || forum || anomaly) ? `<section><h2>${esc(s.title)}</h2><div class="card">${items}${forum}${anomaly}</div></section>` : "";
  }).join("");

  const meta = ANOM
    ? `<span>密级：<i class="cldot cl-${clc}"></i><span class="clwrap"><span class="clbase">${esc(d.level)}</span><span class="clhover">${esc(d.levelTrue)}</span></span></span>`
    : `<span>密级：<i class="cldot cl-${clc}"></i>${esc(d.level)}</span>`;

  const dlg = (!ANOM && !RESTORED) ? `
    <div class="sysdlg">
      <div class="sysdlg-bar"><span class="sysdlg-dot"></span>系统提示</div>
      <div class="sysdlg-body">文档有新版本，点击查看</div>
      <div class="sysdlg-actions"><button class="sysdlg-btn" onclick="toAnom()">查看新版本</button></div>
    </div>` : "";
  const restoredEnd = (RESTORED && d.restoredEnd && d.restoredEnd.length) ? `
    <div class="bubble-end">
      ${d.restoredEnd.map(l => `<div class="be-line">${esc(l)}</div>`).join("")}
    </div>` : "";
  $("clbar").className = "clbar cl-" + clc;
  document.getElementById("app").innerHTML = `
    <header class="top">
      <div class="meta">
        <span>档案编号：${esc(d.fileNo)}</span>
        ${meta}
        <span>归档日期：${esc(d.date)}</span>
      </div>
      <h1>${esc(d.name)}</h1>
      <div class="alias">${esc(d.alias)}</div>
    </header>
    ${badge}
    ${sections}
    ${restoredEnd}
    ${dlg}
    <footer>${esc(d.notes)}</footer>`;
  bindGhosts();
  alignPortrait();
  window.scrollTo(0, 0);
}

if (typeof spherse !== "undefined" && spherse.events) {
  spherse.events.on("file:update", { path: DATA }, () => render());
}
render().catch(e => { document.getElementById("app").innerHTML = "加载失败：" + e.message; });
</script>
</body>
</html>
