<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyxstr Campbell · 员工档案</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=LXGW+WenKai:wght@300;400;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/oc-base.css">
<style>
:root{
  --am:#e8b04b; --amd:#8a6a2f; --amf:rgba(232,176,75,.07);
  --gr:#7fbf7f; --grd:#4a6b4a; --red:#c85a4a; --cy:#6fb3b8;
  --bg:#0c0a06; --panel:#121008; --line:rgba(232,176,75,.25); --txt:#d8cdb4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);
  font-family:'VT323','LXGW WenKai','Noto Sans SC',monospace;font-size:17px;line-height:1.9;
  min-height:100vh}
::selection{background:var(--am);color:#000}

.crt-lines{position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px)}
.crt-vig{position:fixed;inset:0;z-index:901;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%)}
body{text-shadow:-0.4px 0 rgba(255,50,90,.10),0.4px 0 rgba(0,205,255,.10)}

/* 密级顶条 */
.clbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:950}
.cl-yellow{background:linear-gradient(90deg,#8a6a2f,#eab308,#8a6a2f)}
.cl-red{background:linear-gradient(90deg,#5a1f16,#dc2626,#8a1f16);animation:pul 2s infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.55}}

.back{position:fixed;top:14px;left:24px;z-index:960;font-family:inherit;font-size:16px;
  background:var(--panel);border:1px solid var(--line);color:var(--amd);
  padding:4px 14px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
.back:hover{color:var(--am);border-color:var(--am)}

.wrap{max-width:900px;margin:0 auto;padding:64px 26px 130px;
  animation:pageIn .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== 文件头 ===== */
.fhead{border:1px solid var(--line);background:
  repeating-linear-gradient(45deg,var(--panel) 0 14px,rgba(232,176,75,.02) 14px 28px);
  padding:20px 24px;margin-bottom:22px;position:relative;overflow:hidden}
.fhead::after{content:"CLASSIFIED";position:absolute;top:34px;right:-58px;
  transform:rotate(35deg);color:rgba(200,90,74,.5);font-size:22px;
  letter-spacing:.5em;border-top:2px solid rgba(200,90,74,.5);
  border-bottom:2px solid rgba(200,90,74,.5);padding:2px 40px;pointer-events:none}
.fmeta{display:flex;gap:22px;flex-wrap:wrap;font-size:14.5px;color:var(--amd);
  letter-spacing:.18em;border-bottom:1px dashed var(--line);padding-bottom:12px}
.fmeta b{color:var(--txt);font-weight:400}
.cldot{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:6px;box-shadow:0 0 7px currentColor;vertical-align:1px}
.cl-dot-y{background:#eab308;color:#eab308}
.cl-dot-r{background:#dc2626;color:#dc2626}

h1{font-family:'VT323','Noto Sans SC',monospace;font-size:clamp(46px,8vw,88px);
  color:var(--am);line-height:1;margin-top:16px;
  text-shadow:0 0 26px rgba(232,176,75,.4);min-height:1em;letter-spacing:.03em}
h1 .ch{display:inline-block;opacity:0}
.alias{color:var(--amd);letter-spacing:.3em;margin-top:8px;font-size:17px}
.ftags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.ftag{font-size:14px;border:1px solid var(--line);color:var(--amd);
  padding:1px 12px;letter-spacing:.15em}
.ftag:first-child{color:var(--am);border-color:var(--amd)}

/* ===== 工牌 ===== */
.idcard-wrap{display:flex;justify-content:center;margin-bottom:30px}
.idcard{width:min(580px,100%);background:linear-gradient(155deg,#181307,#100d08 60%,#14100a);
  border:1px solid var(--line);position:relative;padding:22px 26px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 50px -18px rgba(232,176,75,.35);
  transition:transform .3s,box-shadow .3s}
.idcard:hover{transform:rotate(-.6deg) translateY(-3px);
  box-shadow:0 0 0 1px var(--am),0 24px 60px -18px rgba(232,176,75,.5)}
.idcard::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,var(--amd) 0 12px,transparent 12px 24px);
  opacity:.55}
.hole{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:56px;height:11px;background:var(--bg);border-radius:6px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.9),inset 0 -1px 0 rgba(232,176,75,.15)}
.ic-head{display:flex;justify-content:space-between;align-items:center;
  color:var(--amd);font-size:13.5px;letter-spacing:.3em;margin-top:14px;
  border-bottom:1px dashed var(--line);padding-bottom:8px}
.ic-body{display:flex;gap:20px;margin-top:14px;align-items:center}
.ic-left{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ic-photo{flex:0 0 150px;height:200px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--amd);font-size:13px;letter-spacing:.2em;line-height:2.2;
  background:var(--bg);overflow:hidden;position:relative}
.ic-photo img{width:100%;height:100%;object-fit:cover}
.ic-photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(232,176,75,.09) 50%,transparent 60%)}
.ic-info{flex:1;min-width:0}
.ic-row{display:flex;gap:10px;font-size:16px;padding:3.5px 0;
  border-bottom:1px dotted rgba(232,176,75,.13)}
.ic-row:last-child{border-bottom:none}
.ic-row .k{flex:0 0 118px;color:var(--amd);letter-spacing:.1em}
.ic-row .v{color:var(--txt);word-break:break-word}
.barcode{margin-top:0;display:flex;align-items:flex-end;gap:1.5px;height:24px;
  justify-content:center;opacity:.75}
.barcode i{background:var(--txt);display:block;width:2px}
.bcno{text-align:center;color:var(--amd);font-size:11px;letter-spacing:.25em;margin-top:2px}

/* ===== 面板 ===== */
.panel{border:1px solid var(--line);background:var(--panel);margin-bottom:22px;
  position:relative;opacity:0;transform:translateY(18px);
  transition:opacity .55s ease,transform .55s ease}
.panel.in{opacity:1;transform:none}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--am);border-left:2px solid var(--am)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--am);border-right:2px solid var(--am)}
.p-head{display:flex;justify-content:space-between;align-items:center;
  padding:8px 18px;border-bottom:1px dashed var(--line);
  color:var(--am);font-size:19px;letter-spacing:.3em}
.p-head small{font-family:'VT323',monospace;color:var(--amd);font-size:13px;letter-spacing:.2em}
.p-body{padding:16px 22px}

.item{padding:10px 0;border-bottom:1px dotted rgba(232,176,75,.12)}
.item:last-child{border-bottom:none}
.ilabel{color:var(--am);font-size:15px;letter-spacing:.25em;margin-bottom:2px}
.ilabel::before{content:"> ";color:var(--amd)}
.itext p{margin-bottom:8px}
.itext p:last-child{margin-bottom:0}

.rednote{color:var(--red);border-bottom:1px dashed rgba(200,90,74,.6)}
/* 隐藏文字：正文本体就是触发点（红色虚线下标提示）；悬停/点击 → 正文变乱码 → 解码为红色衬线异常文字 */
.anom-t{border-bottom:1px dashed var(--red);cursor:help;transition:color .2s,border-color .2s}
.anom-t:hover{border-bottom-style:solid}
.anom-t.revealed{color:#ff6b5a;border-bottom:1px dashed rgba(255,107,90,.5);
  font-family:"HuWenMingChao","Times New Roman","Noto Serif SC",serif}

/* ===== 论坛 ===== */
.thread{border:1px solid var(--line);background:var(--bg);margin-bottom:18px}
.t-head{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--amf)}
.t-board{display:inline-block;font-size:13px;color:#000;background:var(--am);
  padding:0 10px;letter-spacing:.2em;margin-bottom:6px}
.t-title{color:var(--am);font-size:19px;letter-spacing:.05em}
.post{padding:12px 18px;border-bottom:1px dashed rgba(232,176,75,.14);position:relative;
  margin-left:calc(var(--d)*30px)}
.post:last-child{border-bottom:none}
.post[data-d]:not([data-d="0"])::before{content:"";position:absolute;left:-16px;top:0;
  bottom:0;width:1px;background:rgba(232,176,75,.3)}
.post[data-d]:not([data-d="0"])::after{content:"└";position:absolute;left:-22px;top:8px;
  color:var(--amd);font-size:14px}
.p-head2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.uname{color:var(--am);letter-spacing:.06em}
.lvtag{font-size:12px;border:1px solid var(--line);color:var(--amd);
  padding:0 7px;letter-spacing:.1em}
.lvtag.op{color:#000;background:var(--am);border-color:var(--am)}
.lvtag.custom{color:var(--cy);border-color:var(--cy)}
.pmeta{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--grd);white-space:nowrap}
.ipx{color:var(--cy)}
.p-body2{margin-top:4px;font-size:16px}
.expand{padding:8px 18px;font-size:14px;color:var(--amd);cursor:pointer;
  border-bottom:1px dashed rgba(232,176,75,.14);letter-spacing:.1em;
  margin-left:calc(var(--d)*30px)}
.expand:hover{color:var(--am)}
.sysdel{padding:8px 18px;text-align:center;color:rgba(200,90,74,.7);
  font-size:14px;letter-spacing:.15em;border-bottom:1px dashed rgba(232,176,75,.14)}

footer{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;
  color:var(--amd);font-size:14px;white-space:pre-wrap;text-align:center;letter-spacing:.1em}

.errbox{max-width:520px;margin:80px auto;text-align:center;color:var(--red);
  border:1px solid rgba(200,90,74,.4);padding:26px;letter-spacing:.1em;line-height:2.2}

/* ===== 系统弹窗（参考 系统弹窗格式参考.html：页内放置，位于文档末尾） ===== */
.syspop{
  width:min(420px,92vw);margin:44px auto 0;background:var(--panel);position:relative;
  border:1px solid var(--line);
  box-shadow:0 24px 70px -16px rgba(232,176,75,.35),0 0 40px rgba(0,0,0,.8)}
.syspop::before,.syspop::after,.syspop .c3,.syspop .c4{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.syspop::before{top:-1px;left:-1px;border-top:2px solid var(--am);border-left:2px solid var(--am)}
.syspop::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--am);border-right:2px solid var(--am)}
.syspop .c3{top:-1px;right:-1px;border-top:2px solid var(--am);border-right:2px solid var(--am)}
.syspop .c4{bottom:-1px;left:-1px;border-bottom:2px solid var(--am);border-left:2px solid var(--am)}
.sp-head{display:flex;align-items:center;gap:10px;padding:7px 16px;
  border-bottom:1px dashed var(--line);color:var(--am);
  font-size:15px;letter-spacing:.35em;background:var(--amf)}
.sp-dot{width:8px;height:8px;border-radius:50%;background:var(--am);
  box-shadow:0 0 8px var(--am);animation:pul 1.2s infinite}
.sp-head small{margin-left:auto;color:var(--amd);font-size:12px;letter-spacing:.2em}
.sp-body{padding:20px 22px 6px;text-align:center}
.sp-body p{font-size:17px;line-height:2}
.sp-body .hl{color:var(--am);border-bottom:1px dashed rgba(138,106,47,.6);padding:0 2px}
.sp-code{margin-top:8px;color:var(--amd);font-size:12.5px;letter-spacing:.25em;
  font-family:'VT323',monospace;opacity:.75}
.sp-btns{display:flex;border-top:1px dashed var(--line);margin-top:16px}
.sp-btn{flex:1;padding:11px 0;font-family:inherit;font-size:15.5px;letter-spacing:.25em;
  background:none;border:none;cursor:pointer;color:var(--amd);transition:all .18s}
.sp-btn:hover{color:var(--am);background:var(--amf)}
.sp-btn.main{color:var(--am)}
.sp-btn.main:hover{background:var(--am);color:#000}
.sp-btn + .sp-btn{border-left:1px dashed var(--line)}
.syspop.done .sp-btns{display:none}
.sp-done{display:none;padding:14px 22px 18px;text-align:center;
  color:var(--gr);font-size:15px;letter-spacing:.3em;
  border-top:1px dashed var(--line)}
.syspop.done .sp-done{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 异象全局（点击忏悔按钮后出现） ===== */
.redveil{position:fixed;inset:0;z-index:905;pointer-events:none;opacity:0;
  transition:opacity .25s;
  background:radial-gradient(ellipse at center,rgba(200,40,30,.10) 40%,rgba(120,10,5,.35) 100%);
  mix-blend-mode:multiply}
body.anomaly .redveil{opacity:1;animation:veilPul 1.6s ease-in-out infinite}
@keyframes veilPul{0%,100%{opacity:.85}50%{opacity:.55}}
body.anomaly{animation:shake .12s infinite}
body.anomaly ::selection{background:var(--red);color:#fff}
body.anomaly *{color:#ff6b5a!important;text-shadow:0 0 10px rgba(255,60,40,.7)!important}
body.anomaly .p-head,body.anomaly h1{color:#ff3b28!important;
  text-shadow:0 0 22px rgba(255,50,30,.9)!important}
body.anomaly .panel{border-color:rgba(255,70,50,.45)!important}
body.anomaly .panel::before{border-color:#ff3b28!important;border-left-color:#ff3b28!important}
body.anomaly .panel::after{border-color:#ff3b28!important;border-right-color:#ff3b28!important}
body.anomaly .p-head{border-bottom-color:rgba(255,70,50,.4)!important}
body.anomaly h1{animation:rgbsplit .18s steps(2) infinite}
@keyframes rgbsplit{
  0%{transform:translate(0);clip-path:inset(0 0 0 0)}
  25%{transform:translate(-2px,1px);text-shadow:-3px 0 #00e5ff,3px 0 #ff0022!important}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,-1px);text-shadow:3px 0 #00e5ff,-3px 0 #ff0022!important}}
@keyframes shake{
  0%,100%{transform:translate(0)}
  25%{transform:translate(1px,-1px)}
  50%{transform:translate(-1px,1px)}
  75%{transform:translate(1px,0)}}
.glitchbars{position:fixed;inset:0;z-index:902;pointer-events:none;display:none}
body.anomaly .glitchbars{display:block}
.glitchbars i{position:absolute;left:0;right:0;height:14px;display:none;
  background:rgba(255,60,40,.08)}
.glitchbars i.on{display:block;animation:tear .35s steps(2) infinite}
@keyframes tear{
  0%{transform:translateX(-14px)}
  50%{transform:translateX(20px);opacity:.7}
  100%{transform:translateX(-8px)}}
.warnbar{position:fixed;top:0;left:0;right:0;z-index:910;padding:7px 0;
  text-align:center;font-size:15px;letter-spacing:.4em;color:#ffd9d4;
  background:linear-gradient(90deg,#3a0d08,#611510,#3a0d08);
  border-bottom:1px solid rgba(255,80,60,.5);
  display:none;animation:pulW 1.2s steps(1) infinite}
@keyframes pulW{0%,100%{opacity:1}50%{opacity:.55}}
body.anomaly .warnbar{display:block}
/* 异象中：录音 EQ 条改红、论坛区红底白字 */
body.anomaly .eqbars i{background:var(--red)!important}
body.anomaly .t-head{background:rgba(200,60,40,.18)!important;border-bottom-color:rgba(255,80,60,.45)!important}
body.anomaly .t-board{background:#c8453a!important;color:#fff!important}

/* 忏悔流程 */
.conf-line{opacity:0;animation:confIn .5s ease both;text-align:center;line-height:2.4;
  font-family:'HuWenMingChao','Noto Serif SC','STKaiti',serif}
@keyframes confIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.trig-btn{font-family:inherit;font-size:18px;letter-spacing:.3em;
  color:var(--am);background:none;border:1px solid var(--line);
  padding:12px 38px;cursor:pointer;transition:all .25s;display:inline-block}
.trig-btn:hover{border-color:var(--am);box-shadow:0 0 24px rgba(232,176,75,.35)}
.conf-err{text-align:center;font-size:17px;color:var(--red);letter-spacing:.12em;line-height:2.4}
.conf-err a{cursor:pointer;text-decoration:underline}

/* ===== 录音（参考录音记录参考.html：点击展开+逐行浮现） ===== */
.rec{border:1px solid rgba(232,176,75,.18);margin:14px 0;background:rgba(232,176,75,.02)}
.rec.playing{border-color:var(--am)}
.rec-head{padding:8px 14px;font-size:14px;letter-spacing:.15em;color:var(--txt);
  background:rgba(200,90,74,.08);border-bottom:1px solid rgba(232,176,75,.18);
  display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#3a2c12;transition:all .2s;flex-shrink:0}
.rec.playing .rec-dot{background:var(--red);box-shadow:0 0 8px var(--red);animation:recB 1s infinite}
@keyframes recB{50%{opacity:.15}}
.rec-dur{margin-left:auto;color:var(--amd);letter-spacing:.1em}
.eqbars{display:none;gap:2px;align-items:flex-end;height:12px}
.rec.playing .eqbars{display:flex}
.eqbars i{width:3px;background:var(--am);height:20%}
.rec.playing .eqbars i{animation:eq .5s ease-in-out infinite alternate}
@keyframes eq{from{height:15%}to{height:100%}}
.rec-body{padding:10px 14px;display:none}
.rec.open .rec-body{display:block}
.rline{font-family:"Courier New",Consolas,"Noto Sans SC",monospace;
  font-size:14.5px;line-height:2.1;padding:2px 0;
  opacity:0;transform:translateX(-8px)}
.rline.in{opacity:1;transform:none;transition:all .35s ease}
.fx{color:var(--gr);font-size:13px;letter-spacing:.05em}
.rline.special{color:var(--red);text-align:center;letter-spacing:.15em;
  text-shadow:0 0 10px rgba(200,90,74,.5);padding:8px 0}
@keyframes glitchKick{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px);filter:hue-rotate(-60deg)}
  40%{transform:translateX(3px)}
  60%{transform:translateX(-2px);filter:hue-rotate(-60deg) saturate(2)}}
.rec.kick{animation:glitchKick .28s steps(2)}

/* ===== 修正版：诗（参考特殊quote参考：稿纸框+◈+衬线逐行） ===== */
.poem-zone{text-align:center;margin-top:30px}
.poem-title{color:var(--amd);font-size:14px;letter-spacing:.55em;margin-bottom:20px;
  animation:pulW 3s infinite}
.poem{max-width:560px;margin:0 auto;border:1px solid rgba(232,176,75,.3);
  background:
    radial-gradient(ellipse at 50% -20%,rgba(232,176,75,.06),transparent 60%),
    repeating-linear-gradient(to bottom,transparent 0 34px,rgba(138,106,47,.08) 34px 35px),
    var(--panel);
  padding:34px 34px 28px;font-family:'HuWenMingChao','Noto Serif SC','STKaiti',serif;
  position:relative;box-shadow:0 20px 60px -24px rgba(232,176,75,.3)}
.poem::before{content:"◈";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--bg);color:var(--am);padding:0 14px;font-size:15px}
.pl{font-size:17.5px;letter-spacing:.14em;line-height:2.5;opacity:0;
  transform:translateY(10px);transition:all .8s cubic-bezier(.2,.7,.2,1)}
.poem.in .pl{opacity:1;transform:none}
.poem-sign{margin-top:18px;color:var(--amd);font-size:13.5px;letter-spacing:.4em}

/* 瞄准光标（桌面端） */
body.has-cc, body.has-cc * { cursor: none !important; }
body.has-cc input[type="text"], body.has-cc input[type="number"], body.has-cc input[type="email"], body.has-cc input[type="password"], body.has-cc textarea { cursor: text !important; }
.cc { position: fixed; top: 0; left: 0; width: 0; height: 0; z-index: 2147483647; pointer-events: none; }
.cc-dot { position: fixed; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: var(--am); box-shadow: 0 0 6px rgba(232,176,75,.5); transition: transform .25s ease; }
.cc-press .cc-dot { transform: scale(.6); }
.cc-click .cc-c { opacity: .3; }
.cc-click .cc-dot { transform: scale(1.7); box-shadow: 0 0 14px var(--ph, var(--am, var(--primary))); }
.cc-c { position: fixed; width: 9px; height: 9px; border: 1.5px solid var(--am); opacity: .85; box-shadow: 0 0 4px rgba(232,176,75,.4); transition: left .18s ease, top .18s ease, border-color .2s ease, transform .3s cubic-bezier(.2,.7,.2,1), background .2s ease; }
.cc-tl { border-right: none; border-bottom: none; }
.cc-tr { border-left: none; border-bottom: none; }
.cc-bl { border-right: none; border-top: none; }
.cc-br { border-left: none; border-top: none; }
.cc.locked .cc-c { border-color: var(--gr); opacity: 1; }

@media (prefers-reduced-motion: reduce) {

<script>
/* ============ 配置 ============ */
var DATA = "./Nyxstr.data.json";
var SELF_IDS = [];
var D = null;
var STATE = location.hash === "#anom" ? "anom" : (location.hash === "#restored" ? "restored" : "normal");
var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/*-+=_";

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
/* 文本渲染：
   normal —— ++隐藏段 整段消失（第一遍没有隐藏文字）
   anom   —— 正文本体成为触发点：++ 之前的正文带红色虚线提示，悬停/点击 → 正文变乱码 → 解码成红色衬线异常文字 */
function splitParts(t){
  var parts=[], re=/\+\+([\s\S]+?)\+\+/g, last=0, m;
  while((m=re.exec(t))){
    parts.push({txt:t.slice(last,m.index), hidden:m[1]});
    last=m.index+m[0].length;
  }
  parts.push({txt:t.slice(last), hidden:null});
  return parts;
}
function procEsc(t){
  return esc(t)
    .replace(/##([\s\S]+?)##/g,'<span class="rednote">$1</span>')
    .replace(/\/\/([\s\S]+?)\/\//g,'<i>$1</i>');
}
function bodyText(raw, anom){
  if(!anom) return procEsc(raw.replace(/\+\+[\s\S]+?\+\+/g,""));
  var out="";
  splitParts(raw).forEach(function(p){
    if(p.hidden!=null){
      out += '<span class="anom-t" data-t="'+esc(p.hidden)+'">'+procEsc(p.txt)+'</span>';
    }else{
      out += procEsc(p.txt);
    }
  });
  return out;
}
function garble(txt){
  var out="";
  for(var i=0;i<txt.length;i++)
    out += txt[i]==="\u3000"?txt[i]:CHARS[Math.floor(Math.random()*CHARS.length)];
  return out;
}
function paras(t, anom){
  return String(t||"").split(/\n{2,}/).map(function(p){
    return "<p>"+bodyText(p.replace(/\n/g,"<br>"),anom)+"</p>";
  }).join("");
}

function lvTag(tag){
  if(!tag)return "";
  var cls="lvtag";
  if(tag==="管理员"||tag==="官方")cls+=" op";
  else if(!/^lv\d+$/.test(tag))cls+=" custom";
  return '<span class="'+cls+'">'+esc(tag)+'</span>';
}

/* ============ 渲染 ============ */
fetch(DATA).then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){ D=d; render(); }).catch(function(e){
  document.getElementById("app").innerHTML=
    '<div class="errbox">// FILE RETRIEVAL FAILED<br>'+esc(e.message)+'</div>';
});

function render(){
  var d=D, anom = STATE==="anom", restored = STATE==="restored";
  /* 异象视觉只在「忏悔」后出现，进入 #anom 时还是干净外观 */
  var cl = restored ? "cl-red" : (anom ? "cl-yellow" : "cl-yellow");
  var dot = restored ? "cl-dot-r" : "cl-dot-y";
  var level = restored ? (d.levelTrue||d.level) : d.level;
  document.getElementById("clbar").className="clbar "+cl;
  document.body.classList.remove("anomaly");
  clearGlitch();

  var tags=(d.tags?[d.tags.gender,d.tags.zone,d.tags.department]:[]).filter(Boolean);
  var head=
   '<div class="fhead'+(d.status==="quit"?" is-quit":d.status==="garbled"?" is-garbled":d.status==="unknown"?" is-unknown":"")+'">'+
     '<div class="fmeta">'+
       '<span>FILE NO : <b>'+esc(d.fileNo)+'</b></span>'+
       '<span>CLEARANCE : <i class="cldot '+dot+'"></i><b>'+esc(level)+'</b></span>'+
       '<span>ARCHIVED : <b>'+esc(d.date||"＿＿＿＿")+'</b></span>'+
     '</div>'+
     '<h1 id="bigname">'+esc(d.name)+'</h1>'+
     '<div class="alias">AKA · '+esc(d.alias)+'</div>'+
     '<div class="ftags">'+tags.map(function(t){return '<span class="ftag">'+esc(t)+'</span>';}).join("")+
       '<span class="'+(STATUS[d.status]||STATUS.active).cls+'">'+(STATUS[d.status]||STATUS.active).label+'</span>'+
     '</div>'+
   '</div>';

  var barcode="";
  for(var i=0;i<42;i++){
    var w=Math.random()<.3?2:(Math.random()<.5?2:1);
    var h=12+Math.random()*8;
    if(Math.random()<.12)barcode+='<i style="width:'+w+'px;height:'+h+'px;background:transparent"></i>';
    else barcode+='<i style="width:'+w+'px;height:'+h+'px"></i>';
  }
  var badge=
   '<div class="idcard-wrap"><div class="idcard">'+
     '<div class="hole"></div>'+
     '<div class="ic-head"><span>CYBERMORGUE</span><span>STAFF ID CARD</span></div>'+
     '<div class="ic-body">'+
       '<div class="ic-left">'+
       '<div class="ic-photo">'+(d.portrait?'<img src="'+esc(d.portrait)+'" alt="">':'IMAGE<br>PENDING')+'</div>'+
       '<div class="barcode">'+barcode+'</div>'+
       '<div class="bcno">'+esc(d.fileNo)+'</div>'+
       '</div>'+
       '<div class="ic-info">'+
         d.badge.map(function(r){
           return '<div class="ic-row"><span class="k">'+esc(r.k)+'</span><span class="v">'+bodyText(r.v,anom)+'</span></div>';
         }).join("")+
       '</div>'+
     '</div>'+
   '</div></div>';

  var body=d.sections.map(function(s,idx){
    var items=(s.items||[]).filter(function(i){return i.text;}).map(function(i){
      return '<div class="item">'+(i.label?'<div class="ilabel">'+esc(i.label)+'</div>':"")+
        '<div class="itext">'+paras(i.text,anom)+'</div></div>';
    }).join("");
    var forums=(s.forum||[]).map(threadHtml).join("");
    if(!items&&!forums)return "";
    return '<section class="panel"><div class="p-head">'+
      '<span>'+esc(s.title).replace(/^[一二三四五六七八九十]+、?/,"")+'</span>'+
      '<small>SEC.'+String(idx+1).padStart(2,"0")+' // ENCRYPTED-OK</small>'+
      '</div><div class="p-body">'+items+forums+'</div></section>';
  }).join("");

  var tail;
  if(restored){
    tail = '<div class="poem-zone">'+
      '<div class="poem-title">— 档 案 附 页 —</div>'+
      '<div class="poem" id="poemBox">'+
        d.restoredEnd.map(function(l){return '<div class="pl">'+esc(l)+'</div>';}).join("")+
        '<div class="poem-sign">— 抄录自某段被遗忘的记忆 —</div>'+
      '</div></div>';
    setTimeout(function(){
      var box=document.getElementById("poemBox");
      if(!box)return;
      box.querySelectorAll(".pl").forEach(function(l,i){l.style.transitionDelay=(i*.14)+"s";});
      requestAnimationFrame(function(){box.classList.add("in");});
    },300);
  }else if(anom){
    tail = '<div style="text-align:center;margin-top:40px">'+
        '<button class="trig-btn" id="confBtn" onclick="confess()">◈ '+esc(d.anomaly.button)+' ◈</button>'+
      '</div>'+
      '<div id="confPass" style="display:none;margin-top:22px"></div>'+
      '<div id="confRecs" style="display:none;margin-top:22px"></div>'+
      '<div id="confErr" style="display:none" class="conf-err"></div>';
  }else{
    tail = sysdlgHtml();
  }

  document.getElementById("app").innerHTML=head+badge+body+tail+
    '<footer>'+sp(d.notes||"")+'</footer>';

  decodeName(); revealPanels();
  if(anom) initAnomT();
}

/* ===== 系统弹窗（页内块，位于文档末尾；文案全部来自 data.json） ===== */
function sysD(a,b){ return a==null||a===""?b:a; }
function sysdlgHtml(){
  var d=(D&&D.sysdlg)||{};
  var body=esc(sysD(d.body,"检测到本档案存在更新版本。"));
  var hl=esc(sysD(d.hl,"更新版本"));
  return '<div class="syspop" id="sysPop">'+
    '<i class="c3"></i><i class="c4"></i>'+
    '<div class="sp-head"><span class="sp-dot"></span><span>'+esc(sysD(d.title,"SYSTEM // 检测"))+'</span><small>'+esc(sysD(d.tag,"CM-SYS"))+'</small></div>'+
    '<div class="sp-body">'+
      '<p>'+body.split(hl).join('<span class="hl">'+hl+'</span>')+'</p>'+
      '<p class="sp-code">'+esc(sysD(d.code,"DIFF : +3 ENTRIES · LAST SYNC 04-17"))+'</p>'+
    '</div>'+
    '<div class="sp-btns">'+
      '<button class="sp-btn" onclick="sysAct(false)">'+esc(sysD(d.ignore,"忽 略"))+'</button>'+
      '<button class="sp-btn main" onclick="sysAct(true)">'+esc(sysD(d.view,"查 看"))+'</button>'+
    '</div>'+
    '<div class="sp-done" id="spDone"></div>'+
  '</div>';
}
function sysAct(view){
  var d=(D&&D.sysdlg)||{};
  var pop=document.getElementById("sysPop");
  if(!pop)return;
  pop.classList.add("done");
  var msg=document.getElementById("spDone");
  if(msg)msg.textContent=view
    ? sysD(d.loading,"正在载入新版本……")
    : sysD(d.ignored,"已忽略本次同步");
  if(view)setTimeout(toAnom,800);
}

/* ============ 论坛 ============ */
function postHtml(p,isMain){
  if(p.expand)return '<div class="expand" style="--d:'+(p.depth||0)+'">'+esc(p.content)+' ▾</div>';
  if(p.system)return '<div class="sysdel">'+esc(p.content)+'</div>';
  var isMe=!isMain&&SELF_IDS.indexOf(p.author)>-1;
  return '<div class="post" style="--d:'+(p.depth||0)+'"'+(p.depth?' data-d="'+p.depth+'"':"")+'>'+
    '<div class="p-head2">'+
      '<span class="uname">'+esc(p.author)+'</span>'+
      lvTag(p.tag)+
      (isMe?'<span class="me-flag">◆ 本档案关联者</span>':"")+
      '<span class="pmeta"><span class="ipx">IP:'+esc(p.ip||"--")+'</span><span>'+esc(p.time||"")+'</span></span>'+
    '</div>'+
    '<div class="p-body2">'+paras(p.content,STATE==="anom")+'</div>'+
  '</div>';
}
function threadHtml(f){
  return '<div class="thread">'+
    '<div class="t-head"><span class="t-board">亡语之声 · '+esc(f.board)+'</span>'+
    '<div class="t-title">'+esc(f.title)+'</div></div>'+
    postHtml(f.main,true)+
    f.replies.map(function(p){return postHtml(p,false);}).join("")+
  '</div>';
}

/* ============ 异象流程 ============ */
function toAnom(){ location.hash="#anom"; location.reload(); }
function toRestored(){ location.hash="#restored"; location.reload(); }
function confess(){
  var d=D.anomaly, btn=document.getElementById("confBtn");
  if(btn)btn.textContent="◈ "+d.buttonAfter+" ◈";
  /* 点击忏悔按钮，异象此刻才出现 */
  document.body.classList.add("anomaly");
  syncGlitch();
  var pass=document.getElementById("confPass");
  pass.style.display="block";
  pass.innerHTML=d.passage.map(function(l,i){
    return '<div class="conf-line" style="animation-delay:'+(i*0.22)+'s">'+esc(l)+'</div>';
  }).join("");
  /* 忏悔词后：三卷录音出现（折叠状态，单击展开） */
  setTimeout(function(){
    var recs=document.getElementById("confRecs");
    recs.style.display="block";
    recs.innerHTML=d.recordings.map(function(r){
      return '<div class="rec" data-rec><div class="rec-head" onclick="toggleRec(this)">'+
        '<i class="rec-dot"></i><span>'+esc(r.title)+'</span>'+
        '<span class="eqbars"><i></i><i></i><i></i><i></i><i></i></span>'+
        '<span class="rec-dur">--:--</span>'+
        '</div><div class="rec-body">'+r.lines.map(function(l){
          var txt = typeof l==="string" ? l : l.text;
          var special = typeof l==="object" && l.special;
          var fx = /【(杂音|脚步声|关门声|笑声)/.test(txt);
          if(special) return '<div class="rline special" data-special>'+esc(txt)+'</div>';
          if(fx) return '<div class="rline"><span class="fx">'+esc(txt)+'</span></div>';
          return '<div class="rline">'+esc(txt)+'</div>';
        }).join("")+'</div></div>';
    }).join("");
    recs.scrollIntoView({behavior:"smooth",block:"center"});
  }, d.passage.length*0.22*1000+700);
}

/* ===== 录音展开（参考录音记录参考.html，单击展开） ===== */
function toggleRec(head){
  var rec=head.parentElement;
  var open=rec.classList.toggle("open");
  rec.classList.toggle("playing",open);
  if(open){
    var lines=rec.querySelectorAll(".rline");
    lines.forEach(function(l,i){setTimeout(function(){l.classList.add("in");},i*380);});
    var sp=rec.querySelector(".special");
    if(sp&&!sp.dataset.done){
      setTimeout(function(){
        sp.classList.add("in");
        rec.classList.add("kick");
        setTimeout(function(){rec.classList.remove("kick");},320);
      },(Array.from(lines).indexOf(sp)*380)+400);
      sp.dataset.done="1";
    }
    /* 点开最后一条录音 → 致命错误弹窗 */
    var last=rec.parentElement.querySelector(".rec:last-of-type");
    if(last===rec) showConfErr();
  }
}
function showConfErr(){
  var err=document.getElementById("confErr");
  if(!err||err.dataset.done)return;
  err.dataset.done="1";
  err.style.display="block";
  err.innerHTML=esc(D.anomaly.error)+'<br><a onclick="toRestored()">'+esc(D.anomaly.reload)+'</a>';
  err.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ===== 正文本体触发解码（悬停一次即完整解码，不随鼠标位置回退；点击可还原） ===== */
function initAnomT(){
  var gs=document.querySelectorAll(".anom-t");
  gs.forEach(function(g){
    if(!g.dataset.o) g.dataset.o = g.textContent;
    g.addEventListener("mouseenter", function(){ if(g.dataset.done!=="1") decodeT(g); });
    g.addEventListener("click", function(){
      if(g.dataset.done==="1") reGarbleT(g);
      else decodeT(g);
    });
  });
}
function decodeT(g){
  clearInterval(g._iv);
  var real=g.dataset.t, i=0;
  g.classList.add("revealed"); /* 一开始就是红色衬线 */
  g._iv=setInterval(function(){
    i++;
    var out="";
    for(var k=0;k<real.length;k++)
      out += k<i ? real[k] : CHARS[Math.floor(Math.random()*CHARS.length)];
    g.textContent=out;
    if(i>=real.length){
      clearInterval(g._iv);
      g.dataset.done="1"; g.textContent=real;
    }
  },38);
}
function reGarbleT(g){
  clearInterval(g._iv);
  g.dataset.done="0";
  g.textContent=g.dataset.o||"";
  g.classList.remove("revealed");
}

/* ============ 故障撕条 ============ */
var bars=document.querySelectorAll("#gbars i"), glitchIv=null;
function syncGlitch(){
  if(glitchIv)return;
  glitchIv=setInterval(function(){
    bars.forEach(function(b){
      b.classList.toggle("on",Math.random()<(Math.random()<.3?.7:.25));
      if(b.classList.contains("on"))b.style.top=(Math.random()*95)+"%";
    });
  },180);
}
function clearGlitch(){
  if(glitchIv){clearInterval(glitchIv);glitchIv=null;}
  bars.forEach(function(b){b.classList.remove("on");});
}

/* ============ 动画 ============ */
function decodeName(){
  var h=document.getElementById("bigname");
  if(!h)return;
  var txt=h.textContent,chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/*-+_";
  h.textContent="";
  var spans=[];
  for(var i=0;i<txt.length;i++){
    var s=document.createElement("span");s.className="ch";
    s.style.transitionDelay=(i*40)+"ms";
    s.textContent=txt[i]===" "?"\u00A0":txt[i];
    h.appendChild(s);spans.push(s);
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    spans.forEach(function(s){s.style.opacity=1;s.style.transition="opacity .3s";});
  });});
  var iv=setInterval(function(){
    var prog=Math.floor(performance.now()/40)-2;
    var all=true;
    spans.forEach(function(s,i){
      if(i>=prog)return;
      if(Math.random()<.25&&s.dataset.locked!="1"){s.textContent=chars[Math.floor(Math.random()*chars.length)];all=false;}
      else{s.dataset.locked="1";s.textContent=txt[i];}
    });
    if(all&&prog>txt.length){clearInterval(iv);
      spans.forEach(function(s,i){s.textContent=txt[i];});}
  },50);
}
function revealPanels(){
  var els=document.querySelectorAll(".panel");
  if(!("IntersectionObserver" in window)){
    els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});
  },{threshold:.05});
  els.forEach(function(e){io.observe(e);});
}

/* ============ 导航 ============ */
function goBack(){
  if(typeof spherse!=="undefined"&&spherse.openFile)spherse.openFile("project/OC/索引.html");
  else location.href="索引.html";
}
if(typeof spherse!=="undefined"&&spherse.events)
  spherse.events.on("file:update",{path:DATA},function(){location.reload();});

/* ============ 瞄准光标（挂到 html 上，避免异象抖动动画影响 fixed） ============ */
(function () {
  if (window.__CM_CURSOR__) return; /* 共享 base.js 已接管光标 */
  if (!window.matchMedia || matchMedia("(hover: none)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sel = ".back,.anom-t,.expand,.trig-btn,.conf-err a,.sp-btn,.rec-head";
  var w = document.createElement("div"); w.className = "cc";
  w.innerHTML = '<i class="cc-dot"></i><i class="cc-c cc-tl"></i><i class="cc-c cc-tr"></i><i class="cc-c cc-br"></i><i class="cc-c cc-bl"></i>';
  document.documentElement.appendChild(w);
  var dot = w.querySelector(".cc-dot"), cs = Array.from(w.querySelectorAll(".cc-c"));
  var free = [[-15,-15],[6,-15],[6,6],[-15,6]];
  var mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, locked = null;
  document.body.classList.add("has-cc");
  function frame() {
    cx += (mx - cx) * .2; cy += (my - cy) * .2;
    dot.style.left = cx + "px"; dot.style.top = cy + "px";
    if (clickT >= 0) {
      var p = (performance.now() - clickT) / 380;
      if (p >= 1) {
        clickT = -1;
        cs.forEach(function (c) { c.style.transition = ""; });
      } else {
        var ang = p * Math.PI * 2;
        var cos = Math.cos(ang), sin = Math.sin(ang);
        var cr = locked ? locked.getBoundingClientRect() : null;
        /* 轨道圆心 = 四角的视觉中心（准星自身中心），绕它转才不偏心 */
        var cxs, cys;
        if (cr) { cxs = (cr.left + cr.right) / 2; cys = (cr.top + cr.bottom) / 2; }
        else { cxs = cx - 4.5; cys = cy - 4.5; }
        cs.forEach(function (c, i) {
          var ox, oy;
          if (cr) {
            var cps = [[cr.left - 1, cr.top - 1], [cr.right - 7, cr.top - 1], [cr.right - 7, cr.bottom - 7], [cr.left - 1, cr.bottom - 7]];
            ox = cps[i][0] - cxs; oy = cps[i][1] - cys;
          } else { ox = free[i][0] + 4.5; oy = free[i][1] + 4.5; }
          c.style.left = (cxs + ox * cos - oy * sin) + "px";
          c.style.top = (cys + ox * sin + oy * cos) + "px";
        });
      }
    }
    if (clickT < 0 && !locked) { cs.forEach(function (c, i) { c.style.left = (cx + free[i][0]) + "px"; c.style.top = (cy + free[i][1]) + "px"; }); }
    requestAnimationFrame(frame);
  }
  function lock(t) {
    if (t === locked) return;
    locked = t; w.classList.add("locked");
    var r = t.getBoundingClientRect();
    var p = [[r.left - 1, r.top - 1], [r.right - 7, r.top - 1], [r.right - 7, r.bottom - 7], [r.left - 1, r.bottom - 7]];
    cs.forEach(function (c, i) { c.style.left = p[i][0] + "px"; c.style.top = p[i][1] + "px"; });
  }
  function unlock(t) { if (t && t === locked) { locked = null; w.classList.remove("locked"); } }
  addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
  var clickT = -1;
  addEventListener("mousedown", function () { w.classList.add("cc-press"); w.classList.add("cc-click"); clickT = performance.now(); cs.forEach(function (c) { c.style.transition = "none"; }); });
  addEventListener("mouseup", function () { w.classList.remove("cc-press"); setTimeout(function () { w.classList.remove("cc-click"); }, 380); });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(sel); if (t) lock(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(sel); unlock(t); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
